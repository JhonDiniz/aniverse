/* Arrastar-e-soltar: cada slot guarda sua própria chave (c0-c2 dianteira,
   s0-s1 traseira) no dataTransfer. Soltar sobre outro slot TROCA os dois
   ocupantes -- nunca empurra o resto da fileira, e funciona indiferente de
   ser entre dois da dianteira, dois da traseira, ou um de cada. */
function lineupDragStart(ev, slotKey){
  ev.dataTransfer.setData("text/plain", slotKey);
  ev.dataTransfer.effectAllowed = "move";
  const el = ev.currentTarget;
  if(el) el.classList.add('dragging');
}
function lineupDragEnd(ev){
  document.querySelectorAll('.lineup-fighter.dragging,.lineup-fighter.drag-over').forEach(el=>el.classList.remove('dragging','drag-over'));
}
function lineupDragOver(ev, targetKey){
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  const el = ev.currentTarget;
  if(el && el.dataset.slotKey===targetKey) el.classList.add('drag-over');
}
function lineupDragLeave(ev){
  const el = ev.currentTarget;
  if(el) el.classList.remove('drag-over');
}
async function lineupDrop(ev, targetKey){
  ev.preventDefault();
  const sourceKey = ev.dataTransfer.getData("text/plain");
  document.querySelectorAll('.lineup-fighter.dragging,.lineup-fighter.drag-over').forEach(el=>el.classList.remove('dragging','drag-over'));
  if(!sourceKey || sourceKey===targetKey) return;
  await swapLineupSlots(sourceKey, targetKey);
}
function readLineupSlot(lu, key){
  return key[0]==="c" ? lu.combat[Number(key[1])] : lu.support[Number(key[1])];
}
function writeLineupSlot(lu, key, id){
  if(key[0]==="c") lu.combat[Number(key[1])] = id;
  else lu.support[Number(key[1])] = id;
}
async function swapLineupSlots(a, b){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  if(state.orderReady && state.orderReady[myKey]) return;
  const lu = state.lineup[myKey];
  const idA = readLineupSlot(lu, a), idB = readLineupSlot(lu, b);
  writeLineupSlot(lu, a, idB);
  writeLineupSlot(lu, b, idA);
  await commitAndDraw(state);
}

async function confirmOrder(){
  const myKey="p"+MY_SLOT;
  if(ROOM_CODE===TRAINING_CODE) return;
  try{
    const ref=db.collection("rooms").doc(ROOM_CODE);
    const result=await db.runTransaction(async tx=>{
      const snap=await tx.get(ref);
      if(!snap.exists) return null;
      const state=snap.data();
      const lu=(state.lineup&&state.lineup[myKey])||{combat:[],support:[]};
      if(lu.combat.length!==COMBAT_SIZE || lu.support.length!==SUPPORT_SIZE) return state;
      const ready={...(state.orderReady||{p1:false,p2:false})};
      ready[myKey]=true;
      state.orderReady=ready;
      state.attackOrder=state.attackOrder||{p1:[],p2:[]};
      state.attackOrder[myKey]=[...lu.combat];
      if(ready.p1 && ready.p2){
        state.battle=initBattle(state);
        state.phase="battle";
      }
      state.rev=(state.rev||0)+1;
      tx.set(ref,state);
      return state;
    });
    if(result){ LAST_STATE=result; LAST_REV=result.rev||0; draw(result); }
  }catch(e){
    console.error("Erro ao confirmar formação:",e);
    alert("Não foi possível confirmar a formação. Tente novamente.");
  }
}

async function changeLineup(){
  const state = await loadRoom(ROOM_CODE);
  const myKey="p"+MY_SLOT;
  if(!state.orderReady) state.orderReady={p1:false,p2:false};
  state.orderReady[myKey]=false;
  await commitAndDraw(state);
}

/* ============ MOTOR DE BATALHA ============
   TURNOS SIMULTÂNEOS: os dois jogadores escolhem a ação (atacar, trocar, ou
   Ultimate quando for do tipo que usa o turno) sem ver o que o outro escolheu.
   Só quando os DOIS têm uma ação pendente é que o turno resolve — e resolve na
   ordem de VELOCIDADE do personagem que está agindo (quem troca age com a
   velocidade de quem ENTRA, já que é ele quem golpeia). Ver `pending` no estado
   e `resolveTurn()` mais abaixo. Não existe mais "vez de fulano". */
function initBattle(state){
  // Todos os 5 personagens vivos participam da iniciativa. A posição (dianteira
  // ou traseira) continua controlando proteção/targeting, não se o personagem
  // possui ou não turno.
  const todos = [...state.teams.p1, ...state.teams.p2];
  const turnQueue = todos.sort((a,b)=>charById(b).vel-charById(a).vel || String(a).localeCompare(String(b)));
  const first = turnQueue[0];
  const battle = {
    pending:null, turnQueue, turnIndex:0, currentActorId:first || null,
    activeChar:{p1:first && state.teams.p1.includes(first)?first:null,p2:first && state.teams.p2.includes(first)?first:null},
    mustSwitch:{p1:false,p2:false},
    hp:{}, cooldowns:{}, onceUsed:{}, stunned:{}, def:{}, tempDef:{}, atkBonus:{},
    maxLifeBonus:{}, transformed:{}, dot:{}, growOnHit:{}, transformActive:{}, stunImmune:{}, selfRecoil:{},
    supportCharge:{}, mods:{}, survive1:{}, taunt:{}, confused:{}, charge:{}, atkOverride:{}, velOverride:{}, activeForm:{}, nextDodge:{},
    log:[`A batalha começou! ${first ? charById(first).name : ''} será o primeiro a agir.`]
  };
  [...state.teams.p1,...state.teams.p2].forEach(id=>{
    const c=charById(id); battle.hp[id]=c.vida; battle.def[id]={fis:c.defFis,mag:c.defMag};
    battle.cooldowns[id]=[0,0,0,0]; battle.onceUsed[id]=[false,false,false,false]; battle.stunned[id]=false;
    battle.atkBonus[id]=0; battle.maxLifeBonus[id]=0; battle.charge[id]=0;
  });
  return battle;
}

/* Desempate de velocidade: cai no resultado da moeda, pra ficar determinístico
   e igual nos dois clientes mesmo com empate exato. */
function tiebreak(state){
  return (state.coinResult==="p1" || state.coinResult==="p2") ? state.coinResult : "p1";
}

/* ---------- MODIFICADORES TEMPORÁRIOS ----------
   Buffs e debuffs percentuais com duração. Ficam em b.mods[id] como uma lista;
   vários do mesmo atributo SOMAM (dois -20% viram -40%), que é mais previsível
   pro jogador do que multiplicar. O piso de -90% evita que qualquer combinação
   zere um atributo por completo. */
function statPct(state, id, stat){
  const lista = (state.battle.mods && state.battle.mods[id]) || [];
  let soma = 0;
  lista.forEach(m=>{ if(m.stat===stat || m.stat==="all") soma += m.pct; });
  return Math.max(-90, soma);
}
function addMod(state, id, stat, pct, turns){
  const b = state.battle;
  if(!b.mods) b.mods = {};
  if(!b.mods[id]) b.mods[id] = [];
  b.mods[id].push({stat, pct, turnsLeft: turns || 3});
}
// Chamado uma vez por rodada resolvida, para cada lutador em campo.
function tickMods(state, id){
  const b = state.battle;
  if(!b.mods || !b.mods[id]) return;
  b.mods[id] = b.mods[id].filter(m=>{ m.turnsLeft -= 1; return m.turnsLeft > 0; });
  if(!b.mods[id].length) delete b.mods[id];
}

/* ---------- atributos efetivos em combate ---------- */
function atkStat(state, id, dmgType){
  // dmgType fica só como parâmetro por compatibilidade de assinatura (quem
  // chama ainda passa "physical"/"magic") -- mas o personagem não tem mais
  // dois ataques separados, só UM. O tipo de dano é propriedade do ATAQUE
  // (dmgType do Attack), não do personagem.
  const b = state.battle;
  const ov = b.atkOverride && b.atkOverride[id];
  const base = ov ? ov.atk : charById(id).atk;
  const bruto = (base + (state.battle.atkBonus[id]||0)) * (1 + statPct(state,id,"atk")/100);
  return Math.max(1, Math.round(bruto));
}
function defStat(state, id, dmgType){
  const b = state.battle;
  const k = dmgType==="physical" ? "fis" : "mag";
  const temp = (b.tempDef && b.tempDef[id] && b.tempDef[id][k]) || 0;
  const bruto = (b.def[id][k] + temp) * (1 + statPct(state,id,"def")/100);
  return Math.max(0, Math.round(bruto));
}
function velStat(state, id){
  const b = state.battle;
  const base = (b.velOverride && b.velOverride[id]!==undefined) ? b.velOverride[id] : charById(id).vel;
  return Math.max(1, Math.round(base * (1 + statPct(state,id,"vel")/100)));
}

/* ---------- FORMAS (transformação, ver classe Form em characters.py) ----------
   liveChar() devolve o personagem "como ele está agora" na batalha: se
   estiver numa forma transformada, os ATAQUES vêm da forma (os atributos
   numéricos passam por atkOverride/velOverride/b.def, que já são lidos por
   atkStat/defStat/velStat acima). Use isto em vez de charById() sempre que
   o que importa é "quais ataques ele tem agora". */
function liveChar(state, id){
  const c = charById(id);
  const b = state.battle;
  const formKey = b.activeForm && b.activeForm[id];
  if(!formKey) return c;
  const forms = CHAR_FORMS[c.name];
  const form = forms && forms[formKey];
  if(!form) return c;
  return Object.assign({}, c, {name: form.name, attacks: form.attacks, _formKey: formKey});
}

function applyFormTransform(state, attackerId, formKey){
  const b = state.battle;
  const c = charById(attackerId);
  const form = CHAR_FORMS[c.name] && CHAR_FORMS[c.name][formKey];
  if(!form) return;
  if(!b.atkOverride) b.atkOverride = {};
  if(!b.velOverride) b.velOverride = {};
  if(!b.activeForm) b.activeForm = {};
  const prevMax = maxLifeOf(state, attackerId);
  b.activeForm[attackerId] = formKey;
  b.atkOverride[attackerId] = {atk: form.atk};
  b.velOverride[attackerId] = form.vel;
  b.def[attackerId] = {fis: form.defFis, mag: form.defMag};
  b.maxLifeBonus[attackerId] = form.vida - c.vida;
  const novoMax = maxLifeOf(state, attackerId);
  // preserva a PROPORÇÃO de vida atual em vez de curar/zerar de graça
  b.hp[attackerId] = Math.max(1, Math.round(b.hp[attackerId] * (novoMax/prevMax)));
  b.cooldowns[attackerId] = [0,0,0,0];
  b.onceUsed[attackerId] = [false,false,false,false];
  b.log.unshift(`${c.name} se transforma em ${form.name}!`);
}

/* ---------- LINHAS DE BATALHA (dianteira/traseira) e SELEÇÃO DE ALVO ----------
   Genérico: não sabe o nome de nenhum personagem ou ataque. Só olha
   target_type/ignoreFrontline do ataque e quem está vivo em cada linha.
   combatIds() = dianteira (3), supportIds() = traseira (2) -- já existiam
   com esses papéis; só ganharam a regra de proteção agora. */
function eligibleTargets(state, attackerKey, atk){
  const b = state.battle;
  const attackerId = b.currentActorId || b.activeChar[attackerKey];
  const effects = Array.isArray(atk.effects) ? atk.effects : (atk.effect ? [atk.effect] : []);
  const selfOnly = effects.length && atk.power<=0 && effects.every(e=>!e.target || e.target==='self');
  const allyEffect = effects.some(e=>e.target==='allies' || e.target==='team');
  const ownAlive = [...combatIds(state, attackerKey), ...supportIds(state, attackerKey)].filter(id=>b.hp[id]>0);
  if(selfOnly) return attackerId ? [attackerId] : [];
  if(allyEffect && atk.power<=0) {
    if(effects.some(e=>e.target==='team')) return ownAlive;
    return ownAlive.filter(id=>id!==attackerId);
  }

  const oppKey = otherKey(attackerKey);
  const frontAlive = combatIds(state, oppKey).filter(id=>b.hp[id]>0);
  const backAlive  = supportIds(state, oppKey).filter(id=>b.hp[id]>0);
  const frontlineOpen = frontAlive.length===0;
  const canHitBack = frontlineOpen || !!atk.ignoreFrontline;
  switch(atk.targetType){
    case "all_frontline": return frontAlive.length ? frontAlive.slice() : (canHitBack ? backAlive.slice() : []);
    case "all_backline": return canHitBack ? backAlive.slice() : [];
    case "nearest_line_all": return frontAlive.length ? frontAlive.slice() : backAlive.slice();
    case "mixed": return [...frontAlive.slice(0,atk.frontlineCount||0), ...(canHitBack?backAlive.slice(0,atk.backlineCount||0):[])];
    default: return canHitBack ? [...frontAlive,...backAlive] : frontAlive;
  }
}

/* DANO
     Bruto = Ataque x (Poder da Habilidade / 100)
     Final = Bruto x (100 / (100 + Defesa))
   A defesa deixou de ser subtração e virou divisor: ela agora reduz uma FRAÇÃO
   do dano, então nunca zera um golpe nem deixa de importar contra golpes fortes. */
function calcDano(state, attackerId, targetId, atk, bonusExtra, critico){
  // Dano aleatório fixo ignora a fórmula normal (ex.: "Arremesso de Dados").
  if(atk.minDmg!==undefined && atk.maxDmg!==undefined){
    return Math.max(1, Math.round((atk.minDmg + atk.maxDmg)/2));
  }
  // Alguns golpes usam a DEFESA de quem ataca em vez do ataque.
  const a = (atk.scalesWithDef
      ? defStat(state, attackerId, atk.dmgType)
      : atkStat(state, attackerId, atk.dmgType)) + (bonusExtra||0);
  const dBase = defStat(state, targetId, atk.dmgType);
  const d = Math.max(0, Math.round(dBase * (1 - (atk.ignoreDef||0))));
  const bruto = a * ((atk.power||0)/100);
  let dano = bruto * (100/(100+d));
  if(critico) dano *= 1.5;
  return Math.max(1, Math.round(dano));
}
// Sorteia o dano quando o ataque tem faixa aleatória; senão devolve o normal.
function rolaDano(state, attackerId, targetId, atk, bonusExtra, critico){
  if(atk.minDmg!==undefined && atk.maxDmg!==undefined){
    const base = atk.minDmg + Math.floor(Math.random()*(atk.maxDmg-atk.minDmg+1));
    return Math.max(1, Math.round(critico ? base*1.5 : base));
  }
  return calcDano(state, attackerId, targetId, atk, bonusExtra, critico);
}

/* ESQUIVA E PRECISÃO
   Quem é mais rápido esquiva de quem é mais lento: o dobro da velocidade dá 25%.
   A chance de errar soma a esquiva do alvo com o que falta pra precisão do golpe
   chegar a 100 — e o total nunca passa de 60%, senão golpes fortes viraria loteria. */
const MAX_MISS = 60;
function chanceEsquiva(state, attackerId, targetId){
  const va = velStat(state, attackerId), vt = velStat(state, targetId);
  const porVelocidade = vt > va ? ((vt/va) - 1) * 25 : 0;
  const b = state.battle;
  const nextDodge = (b.nextDodge && b.nextDodge[targetId]) || 0; // Clone das Sombras e afins
  // Buffs de evasão entram direto na conta, somados ao ganho por velocidade.
  return Math.min(MAX_MISS, Math.max(0, porVelocidade + statPct(state,targetId,"eva") + nextDodge));
}
function chanceErro(state, attackerId, targetId, atk){
  const precisao = (atk.precision===undefined ? 100 : atk.precision)
                 + statPct(state, attackerId, "acc");
  const falta = Math.max(0, 100 - precisao);
  return Math.min(MAX_MISS, chanceEsquiva(state, attackerId, targetId) + falta);
}

function checkDeathPenalty(state, id, wasAliveBefore){}

// Alguns Ultimates (o do Garou) fazem o personagem crescer conforme apanha, até um teto.
function checkGrowOnHit(state, id, wasAliveBefore){
  const b = state.battle;
  if(!b.growOnHit || !b.growOnHit[id]) return;
  if(!wasAliveBefore || b.hp[id]<=0) return;
  const g = b.growOnHit[id];
  if(g.current >= g.cap) return;
  const gain = Math.min(g.perHit, g.cap-g.current);
  g.current += gain;
  b.atkBonus[id] = (b.atkBonus[id]||0) + gain;
  const c = charById(id);
  b.log.unshift(`${c.name} fica mais forte ao apanhar! (+${gain} de dano, ${g.current}/${g.cap} acumulado)`);
}

// O outro lado da mecânica do Garou: se ele cair carregado, o poder explode no próprio time.
function checkExplodeOnDeath(state, id, wasAliveBefore){
  const b = state.battle;
  if(!wasAliveBefore || b.hp[id]>0) return;
  const c = charById(id);
  if(!c.ultimate || !c.ultimate.explodeOnDeath) return;
  const grow = b.growOnHit && b.growOnHit[id];
  if(!grow || grow.current<=0) return;
  const dmg = Math.max(1, Math.round(grow.current*0.5));
  const myKey = teamOf(state, id);
  combatIds(state,myKey).filter(allyId=>allyId!==id && b.hp[allyId]>0).forEach(allyId=>{
    const ally = charById(allyId);
    const wasAllyAlive = b.hp[allyId]>0;
    b.hp[allyId] = Math.max(0, b.hp[allyId]-dmg);
    b.log.unshift(`A energia acumulada de ${c.name} explode ao cair e atinge ${ally.name} em ${dmg} de dano!`);
    checkDeathPenalty(state, allyId, wasAllyAlive);
    if(b.hp[allyId]<=0) b.log.unshift(`${ally.name} foi derrotado pela explosão!`);
  });
}

function tickSelfRecoil(state, id){
  const b = state.battle;
  if(!b.selfRecoil || !b.selfRecoil[id]) return;
  const r = b.selfRecoil[id];
  const wasAlive = b.hp[id]>0;
  b.hp[id] = Math.max(0, b.hp[id]-r.value);
  const c = charById(id);
  b.log.unshift(`${c.name} sofre ${r.value} de dano pelo esforço da transformação.`);
  checkDeathPenalty(state, id, wasAlive);
  checkExplodeOnDeath(state, id, wasAlive);
  r.turnsLeft -= 1;
  if(r.turnsLeft<=0 || b.hp[id]<=0) delete b.selfRecoil[id];
}

// Conta as rodadas DO PRÓPRIO personagem transformado. Ao acabar, tudo reverte
// junto: vida bônus, dano bônus (incluindo o acúmulo estilo Garou) e o corte de defesa.
function tickTransformDuration(state, id){
  const b = state.battle;
  if(!b.transformActive || !b.transformActive[id]) return;
  const t = b.transformActive[id];
  t.turnsLeft -= 1;
  if(t.turnsLeft<=0){
    b.def[id].fis = t.original.fis;
    b.def[id].mag = t.original.mag;
    b.atkBonus[id] = 0;
    b.maxLifeBonus[id] = 0;
    b.hp[id] = Math.min(b.hp[id], maxLifeOf(state,id));
    b.transformed[id] = false;
    if(b.growOnHit) delete b.growOnHit[id];
    const c = charById(id);
    b.log.unshift(`A transformação de ${c.name} termina — tudo volta ao normal.`);
    delete b.transformActive[id];
  }
}

function tickStunImmunity(state, id){
  const b = state.battle;
  if(!b.stunImmune || !b.stunImmune[id]) return;
  b.stunImmune[id].turnsLeft -= 1;
  if(b.stunImmune[id].turnsLeft<=0){
    delete b.stunImmune[id];
    const c = charById(id);
    b.log.unshift(`${c.name} não está mais imune a atordoamento.`);
  }
}

const ELEMENT_ICON = {
  Fogo:"🔥", Gelo:"❄️", "Elétrico":"⚡", Sombrio:"🌑", Sagrado:"✨", Venenoso:"☠️",
  Espiritual:"👻", "Psíquico":"🌀", Vento:"🌪️", Terra:"🪨", "Água":"💧", Metal:"⚙️", Natureza:"🌿", Normal:"◽"
};

const ELEMENT_GLOW = {
  Fogo:"#e05a2d", Gelo:"#6fb3d9", "Elétrico":"#e0b559", Sombrio:"#8a5fd4", Sagrado:"#f0d98a",
  Venenoso:"#4fbf63", Espiritual:"#a68fe0", "Psíquico":"#e078a8", Vento:"#3fc4b4", Terra:"#c48a52",
  "Água":"#4a9be0", Metal:"#c9c9c9", Natureza:"#4fbf63", Normal:"#e0b559"
};

// Cada elemento tem uma FORMA de partícula, não só uma cor: raio vira risco,
// gelo e metal viram cacos, o resto vira partícula redonda. É o que faz um
// Zoltraak parecer diferente de um Thunderbolt sem precisar de sprite de efeito.
function fxShapeFor(element, dmgType){
  if(element==="Elétrico") return "bolt";
  if(element==="Gelo" || element==="Metal") return "shard";
  if(dmgType==="physical" && (element==="Normal")) return "slash";
  return "dot";
}

function activeIdOf(state, key){ return state.battle.activeChar[key]; }

/* Velocidade de quem vai agir NESTE turno: se a ação é trocar, é a velocidade
   de quem ENTRA (é ele que golpeia); se é atacar/Ultimate, é a de quem já
   está em campo. */
function actorSpeed(state, key, action){
  const id = action && action.actorId ? action.actorId : state.battle.currentActorId;
  return id ? velStat(state,id) : 0;
}
function actorIdFor(state, key, action){ return action && action.actorId ? action.actorId : state.battle.currentActorId; }

/* Cada turno pertence a UM personagem. Não existe rodada simultânea e não existe substituição. */
function maybeResolveTurn(state){
  const b=state.battle;
  if(!b || !b.pending) return false;
  const key=b.pending.key, action=b.pending.action;
  if(!key || !action) return false;
  b.pending=null;
  executeAction(state,key,action);
  advanceCharacterTurn(state);
  return true;
}
function advanceCharacterTurn(state){
  const b=state.battle;
  if(!b || !b.turnQueue.length) return;
  let checked=0;
  do{
    b.turnIndex=(b.turnIndex+1)%b.turnQueue.length;
    b.currentActorId=b.turnQueue[b.turnIndex];
    checked++;
  }while(checked<=b.turnQueue.length && b.hp[b.currentActorId]<=0);
  const id=b.currentActorId;
  const key=teamOf(state,id);
  b.activeChar.p1 = key==='p1' ? id : b.activeChar.p1;
  b.activeChar.p2 = key==='p2' ? id : b.activeChar.p2;
}
function checkForcedSwitch(state){ return false; }

function maxLifeOf(state, id){
  const c = charById(id);
  return c.vida + (state.battle.maxLifeBonus[id]||0);
}
function teamOf(state,id){ return state.teams.p1.includes(id) ? "p1" : "p2"; }
/* Quem está EM COMBATE (3), separado do time completo (5).
   Os 2 de suporte não entram em campo, não podem ser trocados e não contam
   pra condição de vitória — daí todo o motor de batalha usar isto em vez de
   state.teams. Fallback pro time inteiro cobre partidas antigas gravadas
   antes desta mecânica existir. */
function combatIds(state, key){
  const l = state.lineup && state.lineup[key];
  return (l && l.combat && l.combat.length) ? l.combat : state.teams[key];
}
function supportIds(state, key){
  const l = state.lineup && state.lineup[key];
  return (l && l.support) ? l.support : [];
}
function allTeamIds(state,key){ return [...combatIds(state,key), ...supportIds(state,key)]; }
function aliveIds(state, key){ return allTeamIds(state,key).filter(id=>state.battle.hp[id]>0); }

/* ============ RENDER DA BATALHA ============ */
let lastActiveSeen = {p1:null, p2:null};

function hpClass(pct){ return pct>55 ? "hp-high" : pct>25 ? "hp-mid" : "hp-low"; }

/* ============ FORMAÇÃO 5x5 ============
   Substituiu hudFor()+stageFighter()+sideRail(): antes só os 2 lutadores
   ATIVOS apareciam grandes no palco, e o resto do time ficava numa lista
   lateral compacta. Agora os 5 de cada lado aparecem ao mesmo tempo, em
   campo: 3 de combate na frente (o ativo pode ser trocado por qualquer um
   vivo daqui), 2 de suporte atrás (carregam e disparam a habilidade especial
   quando cheios — combatIds()/supportIds() já existiam, só a apresentação
   visual que era uma coluna lateral). A barra de vida fica ACIMA do sprite.
   O sistema de FX (triggerBattleFx, playTransformation) continua achando
   cada lutador do jeito que sempre achou: por .stage-slot[data-fighter-id],
   então esse atributo e essa classe não podem sumir daqui. */
function formationChip(state, id, key, opts){
  const c = charById(id);
  const b = state.battle;
  const hp = Math.max(0, b.hp[id]);
  const maxHp = maxLifeOf(state,id);
  const pct = Math.max(0, Math.round((hp/maxHp)*100));
  const vivo = hp>0;
  const ativo = b.currentActorId===id;
  const transformed = !!((b.transformed && b.transformed[id]) || (b.activeForm && b.activeForm[id]));
  const isPlayer = opts.side==="player";
  const view = isPlayer ? "back" : "front";

  const carga = opts.isSupport ? ((b.supportCharge && b.supportCharge[id]) || 0) : null;
  const cheio = opts.isSupport && carga>=SUPPORT_MAX;
  const podeMirar = !!(opts.targetable && opts.targetable.has(id) && vivo);
  const podeClicar = podeMirar;
  const onclick = podeMirar ? `onclick="chooseTarget('${id}')"` : '';

  const entering = ativo && (lastActiveSeen[isPlayer?"me":"opp"] !== id);
  const boxCls = [
    vivo ? "" : "anim-ko",
    entering && vivo ? (isPlayer?"anim-enter-player":"anim-enter-enemy") : ""
  ].join(" ");

  const glow = ELEMENT_GLOW[c.element] || "#e0b559";
  const auraHTML = (transformed && vivo) ? `
    <div class="sprite-aura" style="--aura:${glow};"></div>
    <div class="aura-spark" style="--aura:${glow}; left:12%; bottom:8%; animation-delay:0s;"></div>
    <div class="aura-spark" style="--aura:${glow}; left:78%; bottom:14%; animation-delay:.35s;"></div>
    <div class="aura-spark" style="--aura:${glow}; left:46%; bottom:2%; animation-delay:.7s;"></div>` : "";

  // Barra de carga individual -- SEMPRE aparece (não só na traseira), abaixo
  // da barra de vida. Azul normal; vermelha + animação de fogo quando cheia
  // (5/5). É independente da carga de suporte (traseira), que é outro medidor.
  const cargaCombate = getCharge(state, id);
  const cargaCheia = cargaCombate >= CHARGE_MAX;
  const chargeCells = Array.from({length:CHARGE_MAX}, (_,i)=>`<span class="charge-cell ${cargaCombate >= i+1 ? 'on':''}"></span>`).join("");
  const chargeBarHTML = `<div class="fchip-power ${cargaCheia?'full':''}" aria-label="Carga ${Math.floor(cargaCombate)}/${CHARGE_MAX}">${chargeCells}</div>`;

  return `
    <div class="fchip ${vivo?'':'dead'} ${ativo?'active':''} ${podeClicar?'clicavel':''} ${cheio?'ready':''} ${podeMirar?'targetable':''}"
         title="${c.name} — ${hp}/${maxHp}${opts.isSupport?` · carga suporte ${carga}/${SUPPORT_MAX}`:` · carga ${cargaCombate}/${CHARGE_MAX}`}"
         ${onclick}>
      <div class="fchip-hp"><div class="fchip-hp-fill ${hpClass(pct)}" style="width:${vivo?pct:0}%"></div></div>
      ${chargeBarHTML}
      <div class="stage-slot" data-fighter-id="${id}">
        <div class="sprite-box ${boxCls}">
          ${auraHTML}
          ${fighterArt(c,{view, transformed, alive:vivo, side:opts.side, className:'sprite-chip'+(vivo?' anim-idle':'')})}
        </div>
      </div>
      ${opts.isSupport ? `<div class="fchip-charge"><div class="fchip-charge-fill" style="width:${(carga/SUPPORT_MAX)*100}%"></div></div>` : ''}
    </div>`;
}

/* Uma "coluna" de formação por lado. No jogador, a frente fica mais perto do
   centro do palco (direita da coluna dele); no inimigo, espelhado (a frente
   dele fica à esquerda da coluna dele) -- as duas frentes ficam voltadas
   uma pra outra, como um campo de batalha de verdade.
   `targetable` (Set de ids ou null): usado só no lado inimigo, quando o
   jogador está escolhendo o alvo de um ataque de alvo único com mais de uma
   opção elegível (ver chooseAttack/chooseTarget). */
function formationSide(state, key, side, mine, podeInteragir, forcado, targetable){
  const combate = combatIds(state, key);
  const suporte = supportIds(state, key);
  const opts = (isSupport)=>({isSupport, side, mine, podeInteragir, forcado, targetable});
  const frente = combate.map(id=>formationChip(state,id,key,opts(false))).join("");
  const tras = suporte.map(id=>formationChip(state,id,key,opts(true))).join("");
  // A coluna SEMPRE segue a regra espacial: a dianteira fica voltada para o
  // centro. Jogador: traseira | dianteira. Inimigo: dianteira | traseira.
  const colunas = side==="player"
    ? `<div class="fcol fcol-back" data-line="back">${tras}</div><div class="fcol fcol-front" data-line="front">${frente}</div>`
    : `<div class="fcol fcol-front" data-line="front">${frente}</div><div class="fcol fcol-back" data-line="back">${tras}</div>`;
  return `<div class="fside fside-${side}" data-side="${side}">${colunas}</div>`;
}

/* Dock de ataques: 4 pílulas empilhadas, presas na metade inferior da coluna
   direita do palco. Se o personagem tiver Ultimate do tipo meteoro (que gasta a
   rodada, como um ataque), ele entra como 5ª pílula destacada — a transformação
   NÃO entra aqui, porque é grátis e não é uma ação da rodada. */
function attackDock(state, attackerChar, actorId, myKey){
  const b=state.battle;
  if(!attackerChar) return `<div class="atk-dock"><div class="atk-waiting">Aguardando ${playerName(state,otherKey(myKey))} — o turno pertence a outro personagem.</div></div>`;
  const cargaAtual=getCharge(state,actorId);
  const pills=attackerChar.attacks.slice(0,4).map((a,i)=>{
    const cdLeft=(b.cooldowns[actorId]&&b.cooldowns[actorId][i])||0;
    const usedOnce=a.onceOnly && b.onceUsed[actorId] && b.onceUsed[actorId][i];
    const custo=Math.ceil(a.cost||0);
    const semCarga=cargaAtual<custo;
    const disabled=cdLeft>0||usedOnce||semCarga;
    const acc=a.precision===undefined?100:a.precision;
    const cells=Array.from({length:Math.min(5,Math.max(0,custo))},()=>`<span class="attack-cost-cell on"></span>`).join('');
    const desc=(a.description||describeEffect(a.effect)||'Executa o efeito descrito pela habilidade.')
      .replace(/\b\d+\s*(de\s*)?dano\b/gi,'')
      .replace(/~?\d+\s*dano/gi,'').trim();
    const visual=actionVisualClass(a,attackerChar.element);
    const info=a.transformsInto ? '' : `<span class="atk-pill-sub">POW ${a.power||0} · ACC ${acc}%</span>`;
    return `<button class="atk-pill ${visual}" ${disabled?'disabled':''} onclick="chooseAttack(${i})">
      <span class="atk-dot"></span><span class="atk-pill-main"><span class="atk-pill-name">${a.name}${a.onceOnly?' 🔒':''}</span>${info}</span>
      <span class="atk-cd"><span class="attack-cost-cells">${cells}</span></span>
      <span class="atk-tip">${desc||'Sem efeito adicional.'}</span>
    </button>`;
  }).join('');
  return `<div class="atk-dock">${pills}</div>`;
}

let PENDING_TARGET_ATK = null; // índice do ataque aguardando escolha de alvo (single com >1 opção)

/* Chamado ao clicar numa pílula de ataque. Se o ataque é de alvo único e tem
   mais de um alvo elegível (dianteira com vários vivos, por exemplo), entra
   em modo "escolha o alvo" em vez de disparar direto -- exatamente como
   pedido: o jogador não pode mirar a traseira sozinho enquanto a dianteira
   estiver protegida, e quando pode escolher, precisa realmente escolher. */
function chooseAttack(atkIndex){
  const state = LAST_STATE;
  if(!state) return;
  const myKey = "p"+MY_SLOT;
  const activeId = state.battle.currentActorId;
  const atk = liveChar(state, activeId).attacks[atkIndex];
  if(!atk) return;
  if(!atk.transformsInto && (!atk.targetType || atk.targetType==="single")){
    const elig = eligibleTargets(state, myKey, atk);
    if(elig.length > 1){
      PENDING_TARGET_ATK = atkIndex;
      render();
      return;
    }
  }
  submitAction({type:'attack', atkIndex});
}
function chooseTarget(targetId){
  const atkIndex = PENDING_TARGET_ATK;
  if(atkIndex===null) return;
  PENDING_TARGET_ATK = null;
  submitAction({type:'attack', atkIndex, targetId});
}
function cancelTargetChoice(){
  PENDING_TARGET_ATK = null;
  render();
}

function renderBattle(state){
  const myKey='p'+MY_SLOT, oppKey=otherKey(myKey), b=state.battle;
  const actorId=b.currentActorId;
  const actorKey=actorId?teamOf(state,actorId):null;
  const isMyTurn=actorKey===myKey && b.hp[actorId]>0;
  const actor=actorId?liveChar(state,actorId):null;
  let targetable=null;
  if(isMyTurn && PENDING_TARGET_ATK!==null && actor){
    const atk=actor.attacks[PENDING_TARGET_ATK];
    if(atk){ const elig=eligibleTargets(state,myKey,atk); if(elig.length>1) targetable=new Set(elig); else if(elig.length===1){PENDING_TARGET_ATK=null; submitAction({type:'attack',atkIndex:PENDING_TARGET_ATK,targetId:elig[0]});} else PENDING_TARGET_ATK=null; }
  }
  let bannerText;
  if(!actor) bannerText='Batalha iniciando...';
  else if(isMyTurn) bannerText=`Sua vez — ${actor.name} está escolhendo uma ação.`;
  else bannerText=`Aguardando ${playerName(state,actorKey)} — ${actor.name} está escolhendo uma ação...`;
  if(state.training) bannerText=`Treino — ${actor.name} está em turno.`;

  const dimStage=false;
  app.innerHTML=`
    <div class="battle-layout">
      <div class="battle-header"><div class="eyebrow">${state.training?'Modo treino':'Batalha 5x5'}</div><h1 style="margin-bottom:4px">Arena</h1><div class="turn-banner ${isMyTurn?'':'opp'}">${bannerText}${targetable?` <span class="back-link" onclick="cancelTargetChoice()">cancelar</span>`:''}</div></div>
      <div class="battle-main">
        <div class="battle-stage ${dimStage?'stage-dim':''}" id="battleStage">
          <div class="formation-area">
            ${formationSide(state,oppKey,'enemy',false,false,false,targetable)}
            ${formationSide(state,myKey,'player',true,false,false,null)}
          </div><div class="fx-layer" id="fxLayer"></div>
        </div>
        <div class="battle-bottom">${combatLog(state)}${attackDock(state,isMyTurn?actor:null,actorId,myKey)}</div>
      </div>
      ${initiativeColumn(state,myKey,oppKey)}
    </div>`;
  lastActiveSeen={me:b.activeChar[myKey],opp:b.activeChar[oppKey]};
  [...combatIds(state,myKey),...supportIds(state,myKey),...combatIds(state,oppKey),...supportIds(state,oppKey)].forEach(id=>preloadArt(charById(id)));
  triggerBattleFx(state);
}

/* Log de combate: agora é um painel próprio na faixa de baixo (40% da
   largura), não mais um overlay em cima do palco -- por isso mostra mais
   linhas (10) sem cortar. */
function combatLog(state){
  const linhas = (state.battle.log || []).slice(0, 10);
  const corpo = linhas.length
    ? linhas.map(l=>`<div class="log-line">${l}</div>`).join("")
    : `<div class="log-line" style="color:var(--text-dim);">Nada aconteceu ainda.</div>`;
  return `<div class="chat-panel"><div class="chat-panel-title">Combate</div>${corpo}</div>`;
}

/* ---------- coluna de iniciativa (ORDEM DOS ATAQUES) ----------
   Lista os 5 de cada time (dianteira + traseira), ordenados por velocidade
   -- quem tem mais velocidade tende a agir primeiro na rodada. É um preview
   de prioridade; o motor de batalha resolve por rodada simultânea (ver
   maybeResolveTurn), então isto não substitui a lógica de quem realmente
   agiu primeiro -- só ajuda o jogador a prever. */
function initiativeColumn(state,myKey,oppKey){
  const b=state.battle, queue=b.turnQueue||[];
  const vivos=queue.filter(id=>id && b.hp[id]>0);
  const slots=[];
  if(vivos.length){
    let idx=queue.indexOf(b.currentActorId);
    if(idx<0) idx=0;
    let scanned=0;
    while(slots.length<5 && scanned<queue.length*6){
      const id=queue[idx];
      if(id && b.hp[id]>0){
        const mine=teamOf(state,id)===myKey, c=charById(id);
        const repeated=slots.some(x=>x.id===id);
        slots.push({id,html:`<div class="init-slot ${slots.length===0?'is-next':''} ${repeated?'is-repeat':''}" title="${c.name} — velocidade ${velStat(state,id)}">
          ${fighterArt(c,{view:mine?'back':'front',side:mine?'player':'enemy',alive:true,className:'sprite-chip'})}
          <span class="init-name">${c.name}</span><span class="init-spd">⚡${velStat(state,id)}</span></div>`});
      }
      idx=(idx+1)%queue.length; scanned++;
    }
  }
  while(slots.length<5){ slots.push({id:null,html:`<div class="init-slot"><span class="init-name">—</span></div>`}); }
  return `<div class="initiative-col"><div class="initiative-title">Próximos turnos · 5</div>${slots.map(s=>s.html).join('')}</div>`;
}

/* ---------- camada de efeitos ---------- */
let lastFxNonce = null;
const CHARGE_MS = 1900;      // duração da fase de carga de ki
const TRANSFORM_MS = 3400;   // duração total (a faixa do título é a mais longa)
let animLock = 0;            // enquanto travado, o polling não redesenha

function boxCenter(stageRect, id){
  const el = app.querySelector(`.stage-slot[data-fighter-id="${id}"] .sprite-box`);
  if(!el) return null;
  const r = el.getBoundingClientRect();
  return {x: r.left - stageRect.left + r.width/2, y: r.top - stageRect.top + r.height/2, el};
}

function spawnHitFx(layer, pos, color, shape){
  const anchor = document.createElement("div");
  anchor.className = "fx-anchor";
  anchor.style.left = pos.x+"px";
  anchor.style.top = pos.y+"px";
  anchor.style.setProperty("--fx", color);

  const burst = document.createElement("div");
  burst.className = "fx-burst";
  anchor.appendChild(burst);

  if(shape==="slash"){
    const s = document.createElement("div");
    s.className = "fx-slash";
    anchor.appendChild(s);
  } else if(shape==="bolt"){
    for(let i=0;i<4;i++){
      const b = document.createElement("div");
      b.className = "fx-bolt";
      b.style.left = (-18+i*11)+"px";
      b.style.top = (-16+(i%2)*8)+"px";
      b.style.animationDelay = (i*0.05)+"s";
      anchor.appendChild(b);
    }
  } else {
    const n = shape==="shard" ? 7 : 9;
    for(let i=0;i<n;i++){
      const p = document.createElement("div");
      p.className = "fx-particle" + (shape==="shard"?" shard":"");
      const ang = (Math.PI*2*i)/n + Math.random()*0.4;
      const dist = 20+Math.random()*20;
      p.style.setProperty("--px", Math.cos(ang)*dist+"px");
      p.style.setProperty("--py", Math.sin(ang)*dist+"px");
      p.style.left="0px"; p.style.top="0px";
      p.style.animationDelay=(Math.random()*0.08)+"s";
      anchor.appendChild(p);
    }
  }
  layer.appendChild(anchor);
  setTimeout(()=>anchor.remove(), 900);
}

function spawnNumber(layer, pos, text, isHeal){
  const el = document.createElement("div");
  el.className = "fx-dmg" + (isHeal?" heal":"");
  el.textContent = text;
  el.style.left = pos.x+"px";
  el.style.top = (pos.y-14)+"px";
  layer.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

/* Animação de transformação em duas fases.
   Quando isso roda, o estado JÁ diz que o personagem está transformado, então a
   tela já desenhou a arte final. A animação portanto anda de trás pra frente:
   volta pra arte de carga, segura, e só então revela a arte que já estava lá.
   Como as 6 artes compartilham o mesmo canvas ancorado, trocar o src não desloca
   um pixel — a troca some dentro do clarão. */
function playTransformation(targetId, ultName){
  const stage = document.getElementById("battleStage");
  const layer = document.getElementById("fxLayer");
  const slot  = app.querySelector(`.stage-slot[data-fighter-id="${targetId}"]`);

  // A faixa do título aparece mesmo sem arte de carga — vale para qualquer
  // personagem com Ultimate de transformação, não só o Goku.
  if(ultName){
    const title = document.createElement("div");
    title.className = "ult-title";
    title.textContent = ultName;
    document.body.appendChild(title);
    setTimeout(()=>title.remove(), TRANSFORM_MS + 200);
  }
  if(!stage || !layer || !slot) return;

  const box = slot.querySelector(".sprite-box");
  const img = slot.querySelector(".sprite-img");
  const c   = charById(targetId);
  const view = slot.classList.contains("slot-player") ? "back" : "front";
  const charge = chargeBitmapFor(c, view);
  if(!charge || !img || !box) return;

  animLock = Date.now() + TRANSFORM_MS;

  const finalSrc = img.src;
  img.src = charge;
  box.classList.add("charging");
  stage.classList.add("stage-charging");

  const sr = stage.getBoundingClientRect();
  const r  = box.getBoundingClientRect();
  const glow = document.createElement("div");
  glow.className = "charge-glow";
  glow.style.setProperty("--gx", ((r.left-sr.left+r.width/2)/sr.width*100)+"%");
  glow.style.setProperty("--gy", ((r.top-sr.top+r.height/2)/sr.height*100)+"%");
  stage.appendChild(glow);

  const motes = setInterval(()=>{
    const m = document.createElement("div");
    m.className = "ki-mote";
    m.style.left = (r.left-sr.left + Math.random()*r.width)+"px";
    m.style.top  = (r.top-sr.top + r.height*(0.5+Math.random()*0.45))+"px";
    layer.appendChild(m);
    setTimeout(()=>m.remove(), 1100);
  }, 65);

  setTimeout(()=>{
    clearInterval(motes);
    glow.remove();
    stage.classList.remove("stage-charging");
    box.classList.remove("charging");
    img.src = finalSrc;
    const flash = document.createElement("div");
    flash.className = "stage-flash";
    flash.style.setProperty("--fx", "#ffffff");
    stage.appendChild(flash);
    stage.classList.add("stage-quake");
    setTimeout(()=>{ flash.remove(); stage.classList.remove("stage-quake"); }, 780);
  }, CHARGE_MS);
}

/* Troca a pose (base -> dash/block -> base) durante a animação -- só pra
   personagens com arte "espelhável" (usesPoseArt). Quem ainda não tem essas
   poses fica exatamente como sempre esteve: só a animação de CSS
   (avanço/recuo) roda em cima da arte única de sempre.
   A arte por pose é uma <div> com background-position (um sheet.png só),
   não uma <img> com src -- por isso troca a POSIÇÃO, não o arquivo. */
function swapPoseTemporarily(boxEl, charId, pose, ms){
  const c = charById(charId);
  if(!c || !usesPoseArt(c)) return;
  const el = boxEl.querySelector(".sprite-posesheet");
  if(!el) return;
  const original = el.style.backgroundPosition;
  el.style.backgroundPosition = posePosition(c, pose) + "% 0";
  setTimeout(()=>{ el.style.backgroundPosition = original; }, ms);
}

// Toca tudo que acabou de acontecer: avanço do atacante, impacto elemental no
// alvo, número flutuante e, no caso do Ultimate meteoro, clarão + tremor da arena.
/* Toca UM evento visual e devolve quanto tempo ele leva, pra fila saber quando
   disparar o próximo. */
function playFxEvent(ev, state){
  const stage = document.getElementById("battleStage");
  const layer = document.getElementById("fxLayer");
  if(!stage || !layer) return 0;
  const sRect = stage.getBoundingClientRect();

  if(ev.kind==="transform"){
    playTransformation(ev.targetId, ev.name);
    return TRANSFORM_MS;
  }

  if(ev.attackerId){
    const a = boxCenter(sRect, ev.attackerId);
    if(a){
      const isMine = teamOf(state, ev.attackerId) === ("p"+MY_SLOT);
      a.el.classList.add(isMine ? "anim-attack-player" : "anim-attack-enemy");
      setTimeout(()=>a.el.classList.remove("anim-attack-player","anim-attack-enemy"), 520);
      swapPoseTemporarily(a.el, ev.attackerId, "dash", 520);
    }
  }

  if(ev.meteor){
    const flash = document.createElement("div");
    flash.className = "stage-flash";
    flash.style.setProperty("--fx", ev.color || "#e0b559");
    stage.appendChild(flash);
    stage.classList.add("stage-quake");
    setTimeout(()=>{ flash.remove(); stage.classList.remove("stage-quake"); }, 750);
    for(let i=0;i<5;i++){
      const m = document.createElement("div");
      m.className = "meteor-streak";
      m.style.setProperty("--fx", ev.color || "#e0b559");
      m.style.left = (10+i*19)+"%";
      m.style.animationDelay = (i*0.07)+"s";
      layer.appendChild(m);
      setTimeout(()=>m.remove(), 900);
    }
  }

  (ev.effects||[]).forEach((e, i)=>{
    setTimeout(()=>{
      const pos = boxCenter(sRect, e.targetId);
      if(!pos) return;
      if(e.kind==="hit"){
        spawnHitFx(layer, pos, e.color, e.shape);
        pos.el.classList.add("anim-hit");
        setTimeout(()=>pos.el.classList.remove("anim-hit"), 440);
        swapPoseTemporarily(pos.el, e.targetId, "block", 440);
        if(e.value) spawnNumber(layer, pos, "-"+e.value, false);
      } else if(e.kind==="heal"){
        spawnHitFx(layer, pos, "#5fd07a", "dot");
        if(e.value) spawnNumber(layer, pos, "+"+e.value, true);
      } else if(e.kind==="shield"){
        spawnHitFx(layer, pos, "#8fc0ff", "dot");
      } else if(e.kind==="stun"){
        spawnHitFx(layer, pos, "#e078a8", "bolt");
      }
    }, ev.attackerId ? 190 + i*40 : i*40);
  });
  return ev.meteor ? 1100 : 900;
}

/* FILA DE EFEITOS.
   Uma rodada agora resolve VÁRIAS coisas de uma vez (duas transformações e dois
   ataques, no limite). Antes cada uma sobrescrevia `lastFx` e só a última
   aparecia na tela. Agora a rodada empilha os eventos na ordem em que
   aconteceram e a fila toca um de cada vez, respeitando a duração de cada um. */
function triggerBattleFx(state){
  const fx = state.battle && state.battle.lastFx;
  if(!fx || fx.nonce===lastFxNonce) return;
  lastFxNonce = fx.nonce;
  const fila = fx.queue || [];
  if(!fila.length) return;

  // Trava o polling pelo tempo total da fila, pra um redesenho no meio não
  // cortar a sequência.
  const total = fila.reduce((t,ev)=> t + (ev.kind==="transform" ? TRANSFORM_MS : (ev.meteor?1100:900)), 0);
  animLock = Date.now() + total;

  let atraso = 0;
  fila.forEach(ev=>{
    setTimeout(()=>{ playFxEvent(ev, state); }, atraso);
    atraso += (ev.kind==="transform" ? TRANSFORM_MS : (ev.meteor?1100:900));
  });
}

/* ---------- stick figure (fallback dos 134 sem pixel art) ---------- */
function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i))>>>0; }
  return h;
}
const SKIN_TONES = ["#f4c9a0","#e8b184","#d99a6c","#c17f4f","#a5673c","#8a4f2c"];
const HAIR_COLORS = ["#2b2320","#4a2f1c","#6b3a1e","#8a5a2b","#c99a3f","#3a2f4a","#7a2b34","#2f4a3a","#c9c9c9","#1a1a1a"];

function nextFxNonce(b){ return (b.lastFx ? b.lastFx.nonce : 0) + 1; }

/* Empilha um evento visual na fila da rodada em vez de sobrescrever o anterior.
   `turnFx` é zerado no início de cada resolução de turno. */
function pushFx(b, ev){
  if(!b._turnFx) b._turnFx = [];
  b._turnFx.push(ev);
}
function flushFx(b){
  const fila = b._turnFx || [];
  delete b._turnFx;
  if(fila.length) b.lastFx = {nonce: nextFxNonce(b), queue: fila};
}

/* Envia a ação do personagem que está no turno. Só o dono daquele personagem
   pode enviar a ação. Depois da resolução, a iniciativa avança imediatamente
   para o próximo personagem vivo — não existe espera pelo outro jogador. */
async function submitAction(action){
  const state=await loadRoom(ROOM_CODE); if(!state || state.phase!=='battle') return;
  const myKey='p'+MY_SLOT, b=state.battle;
  const actorId=b.currentActorId;
  if(!actorId || teamOf(state,actorId)!==myKey || b.pending) return;
  if(action.type!=='attack') return;
  action.actorId=actorId;
  const atk=liveChar(state,actorId).attacks[action.atkIndex];
  if(!atk) return;
  const custo=atk.cost||0;
  if(getCharge(state,actorId)<custo) return;
  b.pending={key:myKey,action};
  // Resolve imediatamente: o turno pertence a este personagem, não ao jogador.
  if(maybeResolveTurn(state)) await postAction(state); else await commitAndDraw(state);
}

async function doForcedSwitch(){ return; }

async function postAction(state){
  if(state.training){ refreshDummy(state); await commitAndDraw(state); return; }
  const p1Alive=aliveIds(state,'p1').length>0, p2Alive=aliveIds(state,'p2').length>0;
  if(!p1Alive || !p2Alive){ state.phase='battleover'; state.winner=p1Alive?'p1':'p2'; }
  await commitAndDraw(state);
}

/* APLICADOR DE EFEITOS
   Percorre a lista de efeitos do ataque. Cada efeito tem alvo próprio, então o
   mesmo golpe pode buffar quem usa e debuffar quem apanha.
   A rolagem de `chance` acontece AQUI, uma vez só, na máquina de quem age — o
   resultado vai gravado no estado, então os dois jogadores veem o mesmo. */
function alvosDoEfeito(state, ef, attackerId, targetId){
  const key = teamOf(state, attackerId);
  switch(ef.target){
    case "enemy":  return targetId ? [targetId] : [];
    case "allies": return allTeamIds(state,key).filter(id=>id!==attackerId && state.battle.hp[id]>0);
    case "team":   return allTeamIds(state,key).filter(id=>state.battle.hp[id]>0);
    default:       return [attackerId];   // "self"
  }
}

function applyEffects(state, attackerId, targetId, atk, fxEffects){
  const b = state.battle;
  const c = charById(attackerId);
  (atk.effects || []).forEach(ef=>{
    if(ef.chance!==undefined && Math.random()*100 >= ef.chance){
      if(ef.kind==="stun" && targetId) b.log.unshift(`${charById(targetId).name} resistiu ao atordoamento.`);
      return;
    }
    alvosDoEfeito(state, ef, attackerId, targetId).forEach(alvo=>{
      const t = charById(alvo);
      if(ef.kind==="stat"){
        if(ef.pct!==undefined){
          addMod(state, alvo, ef.stat, ef.pct, ef.turns || 3);
          const nome = {atk:"ataque", def:"defesa", vel:"velocidade", eva:"evasão", acc:"precisão", all:"todos os atributos"}[ef.stat] || ef.stat;
          b.log.unshift(`${t.name}: ${ef.pct>0?'+':''}${ef.pct}% de ${nome} por ${ef.turns||3} rodadas.`);
        } else if(ef.flat!==undefined){
          // formato antigo: defesa plana até ser atingido
          const k = atk.dmgType==="physical"?"fis":"mag";
          if(!b.tempDef[alvo]) b.tempDef[alvo] = {fis:0, mag:0};
          b.tempDef[alvo][k] = ef.flat;
          b.log.unshift(ef.flat<0
            ? `${t.name} fica vulnerável (${ef.flat} de defesa até ser atingido).`
            : `${t.name} reforça a defesa em +${ef.flat} até ser atingido.`);
        }
      } else if(ef.kind==="heal"){
        const cap = maxLifeOf(state, alvo);
        const cura = ef.pctHp!==undefined ? Math.round(cap*ef.pctHp/100) : ef.flat;
        const antes = b.hp[alvo];
        b.hp[alvo] = Math.min(cap, b.hp[alvo] + cura);
        b.log.unshift(`${t.name} recupera ${b.hp[alvo]-antes} de vida.`);
        fxEffects.push({targetId:alvo, kind:"heal", value:b.hp[alvo]-antes});
      } else if(ef.kind==="healPctAtk"){
        // Cura como % do ATAQUE ATUAL de quem USA o efeito (não do alvo) --
        // recalculado agora, então reflete transformação/buffs em vigor.
        const atual = Math.max(atkStat(state,attackerId,"physical"), atkStat(state,attackerId,"magic"));
        const cura = Math.round(atual * ef.pct/100);
        const cap = maxLifeOf(state, alvo);
        const antes = b.hp[alvo];
        b.hp[alvo] = Math.min(cap, b.hp[alvo] + cura);
        b.log.unshift(`${t.name} recupera ${b.hp[alvo]-antes} de vida (${ef.pct}% do ataque).`);
        fxEffects.push({targetId:alvo, kind:"heal", value:b.hp[alvo]-antes});
      } else if(ef.kind==="nextDodge"){
        if(!b.nextDodge) b.nextDodge = {};
        b.nextDodge[alvo] = (b.nextDodge[alvo]||0) + ef.pct;
        b.log.unshift(`${t.name} ganha +${ef.pct}% de chance de desviar do próximo ataque.`);
      } else if(ef.kind==="shield"){
        const v = ef.pctHp!==undefined ? Math.round(maxLifeOf(state,alvo)*ef.pctHp/100) : ef.flat;
        b.tempDef[alvo] = {fis:v, mag:v};
        b.log.unshift(`${t.name} ganha escudo de ${v} até ser atingido.`);
        fxEffects.push({targetId:alvo, kind:"shield", color:"#8fc0ff"});
      } else if(ef.kind==="stun"){
        if(!b.stunImmune) b.stunImmune = {};
        if(b.stunImmune[alvo] && b.stunImmune[alvo].turnsLeft>0){
          b.log.unshift(`${t.name} está imune a atordoamento e resistiu!`);
        } else {
          b.stunned[alvo] = true;
          b.stunImmune[alvo] = {turnsLeft:3};
          b.log.unshift(`${t.name} ficou atordoado!`);
          fxEffects.push({targetId:alvo, kind:"stun"});
        }
      } else if(ef.kind==="stunImmune"){
        if(!b.stunImmune) b.stunImmune = {};
        b.stunImmune[alvo] = {turnsLeft: ef.turns || 2};
        b.log.unshift(`${t.name} fica imune a atordoamento por ${ef.turns||2} rodadas.`);
      } else if(ef.kind==="dot"){
        b.dot[alvo] = {value: ef.flat, turnsLeft: ef.turns || 2,
          source: atk.dmgType==="physical"?"Sangramento":(c.element==="Fogo"?"Queimadura":c.element==="Venenoso"?"Veneno":"Efeito contínuo")};
        b.log.unshift(`${t.name} sofre ${b.dot[alvo].source.toLowerCase()} (${ef.flat} por turno)!`);
      } else if(ef.kind==="cleanse"){
        // Tira só o que é ruim: modificadores negativos, atordoamento e dano contínuo.
        if(b.mods && b.mods[alvo]) b.mods[alvo] = b.mods[alvo].filter(m=>m.pct>0);
        if(b.dot) delete b.dot[alvo];
        b.stunned[alvo] = false;
        b.log.unshift(`${t.name} se livra dos efeitos negativos.`);
      } else if(ef.kind==="dispel"){
        if(b.mods && b.mods[alvo]) b.mods[alvo] = b.mods[alvo].filter(m=>m.pct<0);
        if(b.tempDef && b.tempDef[alvo]) delete b.tempDef[alvo];
        b.log.unshift(`${t.name} perde seus efeitos positivos.`);
      } else if(ef.kind==="revive1"){
        if(!b.survive1) b.survive1 = {};
        b.survive1[alvo] = {turnsLeft: ef.turns || 2};
        b.log.unshift(`${t.name} vai resistir a um golpe fatal.`);
      } else if(ef.kind==="taunt"){
        if(!b.taunt) b.taunt = {};
        b.taunt[alvo] = {turnsLeft: ef.turns || 1, by: attackerId};
        b.log.unshift(`${t.name} foi provocado.`);
      } else if(ef.kind==="confuse"){
        if(!b.confused) b.confused = {};
        b.confused[alvo] = {turnsLeft: ef.turns || 1};
        b.log.unshift(`${t.name} está confuso e pode se atacar!`);
      }
    });
  });
}

function applyAction(state, attackerId, atkIdx, targets){
  const alvos = Array.isArray(targets) ? targets : (targets ? [targets] : []);
  const c = liveChar(state, attackerId);
  const atk = c.attacks[atkIdx];
  const b = state.battle;
  if(!b.tempDef) b.tempDef = {};
  const fxEffects = [];
  const fxColor = ELEMENT_GLOW[c.element] || "#e0b559";
  const fxShape = fxShapeFor(c.element, atk.dmgType);
  for(let i=0;i<4;i++){ if(b.cooldowns[attackerId][i]>0) b.cooldowns[attackerId][i]--; }

  const custo = atk.cost || 0;
  const cargaOk = getCharge(state, attackerId) >= custo;
  if(b.cooldowns[attackerId][atkIdx]>0 || (atk.onceOnly && b.onceUsed[attackerId][atkIdx]) || !cargaOk){
    b.log.unshift(!cargaOk
      ? `${c.name} tentou usar ${atk.name}, mas não tem carga suficiente (precisa de ${custo}).`
      : `${c.name} tentou usar ${atk.name}, mas ainda não está pronto.`);
  } else {
    if(custo>0) addCharge(state, attackerId, -custo);

    // ---- TRANSFORMAÇÃO: não causa dano, não mira ninguém, troca a forma ----
    if(atk.transformsInto){
      applyFormTransform(state, attackerId, atk.transformsInto);
      if(atk.cooldown>0) b.cooldowns[attackerId][atkIdx]=atk.cooldown;
      if(atk.onceOnly) b.onceUsed[attackerId][atkIdx]=true;
      addCharge(state, attackerId, CHARGE_STEP);
      pushFx(b, {attackerId, effects: [], kind:"transform_v2"});
      tickSelfRecoil(state, attackerId);
      tickTransformDuration(state, attackerId);
      return;
    }

    // Alguns golpes só podem ser usados abaixo de certa vida (ex.: "Raiva Oculta").
    let podeUsar = true;
    if(atk.onlyBelowHp!==undefined){
      const frac = b.hp[attackerId] / maxLifeOf(state, attackerId);
      if(frac >= atk.onlyBelowHp){
        podeUsar = false;
        b.log.unshift(`${c.name} tentou ${atk.name}, mas só funciona abaixo de ${Math.round(atk.onlyBelowHp*100)}% de vida.`);
      }
    }

    // ---- um alvo por vez: cada um rola esquiva/dano/efeito de forma independente ----
    alvos.forEach(targetId=>{
      if(!targetId) return;
      addCharge(state, targetId, CHARGE_STEP); // "receber um ataque" também carrega, acerte ou erre

      let errou = false;
      if(podeUsar && (atk.power>0 || (atk.effects && atk.effects.length))){
        const risco = chanceErro(state, attackerId, targetId, atk);
        if(risco > 0 && Math.random()*100 < risco){
          errou = true;
          const tgt = charById(targetId);
          const esq = Math.round(chanceEsquiva(state, attackerId, targetId));
          b.log.unshift(`${c.name} usou ${atk.name} — ${tgt.name} desviou! (${Math.round(risco)}% de chance de erro${esq>0?`, ${esq}% por velocidade`:''})`);
          fxEffects.push({targetId, kind:"miss"});
        }
        // "Próximo ataque" consumido aqui -- resolveu (acertou ou errou), então some.
        if(b.nextDodge && b.nextDodge[targetId]) delete b.nextDodge[targetId];
      }

      // --- DANO (com crítico, multi-golpe e penetração de defesa) ---
      if(!errou && atk.power>0 && podeUsar){
        const tgt = charById(targetId);
        const golpes = Math.max(1, atk.hits || 1);
        const chanceCrit = (atk.crit || 0);
        let total = 0, houveCrit = false;
        for(let g=0; g<golpes; g++){
          if(b.hp[targetId] <= 0) break;
          const crit = chanceCrit>0 && Math.random()*100 < chanceCrit;
          if(crit) houveCrit = true;
          const dmg = rolaDano(state, attackerId, targetId, atk, 0, crit);
          const wasAlive = b.hp[targetId]>0;
          b.hp[targetId] = Math.max(0, b.hp[targetId]-dmg);
          // Resiste a um golpe fatal, se estiver com o efeito ativo.
          if(b.hp[targetId]<=0 && b.survive1 && b.survive1[targetId]){
            b.hp[targetId] = 1;
            delete b.survive1[targetId];
            b.log.unshift(`${tgt.name} resistiu ao golpe fatal e ficou com 1 de vida!`);
          }
          total += dmg;
          checkDeathPenalty(state, targetId, wasAlive);
          checkGrowOnHit(state, targetId, wasAlive);
          checkExplodeOnDeath(state, targetId, wasAlive);
          fxEffects.push({targetId, kind:"hit", color:fxColor, shape:fxShape, value:dmg});
        }
        b.log.unshift(`${c.name} usou ${atk.name} em ${tgt.name}: ${total} de dano`
          + (golpes>1?` (${golpes} golpes)`:'') + (houveCrit?' — CRÍTICO!':'') + '.');
        // Defesa temporária do alvo é consumida no instante em que ele apanha.
        if(b.tempDef[targetId]){ delete b.tempDef[targetId]; }
        if(atk.recoilPct){
          const rec = Math.max(1, Math.round(total * atk.recoilPct));
          b.hp[attackerId] = Math.max(1, b.hp[attackerId] - rec);
          b.log.unshift(`${c.name} sofre ${rec} de recuo pelo próprio golpe.`);
        }
        if(b.hp[targetId]<=0) b.log.unshift(`${tgt.name} foi derrotado!`);
      }

      // --- EFEITOS (por alvo -- alguns efeitos, tipo cura em si mesmo, não têm targetId de inimigo) ---
      if(!errou && podeUsar) applyEffects(state, attackerId, targetId, atk, fxEffects);
    });

    // Ataques sem alvo nenhum (ex: cura em si mesmo com effects target:"self")
    // ainda precisam rodar os efeitos uma vez.
    if(alvos.length===0 && podeUsar) applyEffects(state, attackerId, null, atk, fxEffects);

    if(atk.cooldown>0) b.cooldowns[attackerId][atkIdx]=atk.cooldown;
    if(atk.onceOnly) b.onceUsed[attackerId][atkIdx]=true;
    addCharge(state, attackerId, CHARGE_STEP); // atacar sempre carrega, mesmo cost=0
  }
  pushFx(b, {attackerId, effects: fxEffects});
  b.stunned[attackerId]=false;
  tickStunImmunity(state, attackerId);
  tickSelfRecoil(state, attackerId);

  // Dano contínuo (queimadura/veneno) tickando uma vez por turno global.
  Object.keys(b.dot).forEach(id=>{
    if(b.hp[id]<=0){ delete b.dot[id]; return; }
    const d = b.dot[id];
    const dTgt = charById(id);
    const wasAlive = b.hp[id]>0;
    b.hp[id] = Math.max(0, b.hp[id]-d.value);
    b.log.unshift(`${dTgt.name} perde ${d.value} de vida por ${d.source.toLowerCase()}.`);
    checkDeathPenalty(state, id, wasAlive);
    checkGrowOnHit(state, id, wasAlive);
    checkExplodeOnDeath(state, id, wasAlive);
    if(b.hp[id]<=0) b.log.unshift(`${dTgt.name} foi derrotado pelo ${d.source.toLowerCase()}!`);
    d.turnsLeft -= 1;
    if(d.turnsLeft<=0) delete b.dot[id];
  });

  tickTransformDuration(state, attackerId);
}

/* A transformação é a 5ª pílula: uma AÇÃO da rodada como qualquer outra, e não
   um bônus grátis. Escolhê-la gasta a rodada — você transforma em vez de
   atacar. Resolve na FASE 1 do turno (applyTransformation, em part7), sempre
   antes dos ataques e na ordem de velocidade. */

/* Aciona um suporte com a carga cheia. A habilidade em si ainda não existe em
   nenhum personagem — quando existir, entra aqui. Até lá o clique gasta a carga
   e registra no log, pra o ciclo ficar visível e testável de ponta a ponta. */
async function useSupport(id){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  const b = state.battle;
  if(!supportIds(state,myKey).includes(id)) return;
  if((b.supportCharge[id]||0) < SUPPORT_MAX) return;
  const c = charById(id);
  b.supportCharge[id] = 0;
  if(c.support && c.support.name){
    b.log.unshift(`${c.name} usa o suporte: ${c.support.name}.`);
  } else {
    b.log.unshift(`${c.name} entrou como suporte — mas ainda não tem habilidade definida. A carga foi consumida.`);
  }
  await commitAndDraw(state);
}

function renderBattleOver(state){
  const winner = state.winner;
  app.innerHTML = `
    <div class="eyebrow">Fim de jogo</div>
    <h1>${playerName(state,winner)} venceu a batalha!</h1>
    <div class="card">
      <div class="log">${state.battle.log.slice(0,20).map(l=>`<div>${l}</div>`).join("")}</div>
    </div>
    <div class="card">
      <h3>Revanche na mesma sala</h3>
      <p class="hint">Ninguém precisa sair nem digitar código de novo — vocês continuam na sala <strong>${state.code}</strong>.</p>
      <div class="row" style="gap:8px; margin-top:10px;">
        <button class="btn primary" onclick="rematch('${state.mode||"auction"}')">Repetir ${(state.mode||"auction")==="draft"?"Sorteio":"Leilão"}</button>
        <button class="btn" onclick="rematch('${(state.mode||"auction")==="draft"?"auction":"draft"}')">Trocar para ${(state.mode||"auction")==="draft"?"Leilão":"Sorteio"}</button>
      </div>
      <div class="center" style="margin-top:12px;"><button class="btn" onclick="leaveRoom()">Sair da sala</button></div>
    </div>
  `;
}

/* Reinicia a partida PRESERVANDO sala, código e jogadores.
   Monta um estado novo do zero e recoloca só o que deve sobreviver — mais
   seguro que zerar campo a campo, porque um campo de batalha esquecido
   (cooldown, dot, transformação) vazaria para a partida seguinte. */
async function rematch(mode){
  const atual = await loadRoom(ROOM_CODE);
  if(!atual) return;
  const novo = newRoomState(atual.code);
  novo.rev = atual.rev;                 // mantém a contagem pro polling do outro acordar
  novo.players = atual.players;
  novo.difficulty = atual.difficulty;
  novo.mode = mode;
  novo.phase = "lobby";
  novo.log = [`Nova partida na mesma sala — modo ${mode==="draft"?"Sorteio":"Leilão"}.`];
  await commitAndDraw(novo);
}

function renderDone(state){
  app.innerHTML = `
    <div class="eyebrow">Times prontos</div>
    <h1>Equipes finais</h1>
    <div class="players-grid">
      ${[1,2].map(slot=>{
        const key="p"+slot;
        const team = state.teams[key].map(id=>charById(id));
        return `<div class="player-panel">
          <h3>Jogador ${slot} <span class="money">R$${state.budget[key]} restante</span></h3>
          ${team.map(c=>`
            <div class="mini-card" style="margin-top:8px;">
              <div class="mn">${c.name} <span class="badge rank-${c.rankKey}">${c.rank}</span></div>
              <div class="ma">${c.anime} · Vida ${c.vida}</div>
            </div>`).join("")}
        </div>`;
      }).join("")}
    </div>
    <p class="hint center">Times completos! Usem essas fichas pra jogar a batalha (turno a turno, respeitando cooldowns, tipos de dano e habilidades de uso único).</p>
  `;
}

render();
</script>
