<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena de Leilão — Anime Battle Draft</title>
<style>
  :root{
    --bg: #0d0f14;
    --panel: #161922;
    --panel2: #1e222e;
    --line: #2a2f3d;
    --gold: #e0b559;
    --gold-dim: #8a6f36;
    --crimson: #d1495b;
    --crimson-dim: #6b2530;
    --teal: #4fb3a9;
    --text: #eceef2;
    --text-dim: #9aa0af;
    --weak: #7a8194;
    --medium: #4fb3a9;
    --strong: #d1495b;
    --physical: #e0b559;
    --magic: #7f77dd;
    --radius: 10px;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html, body{width:100%; height:100%; margin:0; overflow:hidden;}
  body{
    display:block;
    background:#050609;
    color: var(--text);
  }

  /* =========================================================================
     GAME FRAME -- ocupa a viewport inteira sempre. (Antes tinha max-width/
     max-height fixos pra "caber numa área da tela"; isso foi revertido a
     pedido -- agora é fullscreen de verdade, sem caixa nenhuma ao redor.) */
  #gameFrame{
    position:fixed; inset:0;
    width:auto; height:auto; min-width:0; min-height:0;
    background:
      radial-gradient(ellipse 700px 400px at 20% -5%, rgba(224,181,89,.10) 0%, transparent 60%),
      radial-gradient(ellipse 700px 400px at 85% 0%, rgba(209,73,91,.08) 0%, transparent 60%),
      radial-gradient(circle at 50% 0%, #1a1e29 0%, var(--bg) 60%);
    overflow:hidden; /* o frame não rola -- quem rola é o .wrap por dentro (e só quando faz sentido) */
  }
  #gameFrame .wrap{
    height:100%;
    overflow-y:auto;
    padding:24px 16px 60px;
  }

  #fsToggle{
    position:absolute; top:10px; right:10px; z-index:80;
    width:38px; height:38px; border-radius:8px;
    background:rgba(0,0,0,.35); border:1px solid var(--line); color:#fff;
    font-size:18px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #fsToggle:hover{ background:rgba(0,0,0,.55); }

  /* =========================================================================
     TELA INICIAL (start) -- fundo com a arte, título ANIMEVERSE contornado
     e o botão Jogar na mesma linguagem visual (contorno branco). */
  #gameFrame.menu-mode{
    background:
      linear-gradient(180deg, rgba(5,6,10,.20), rgba(5,6,10,.55) 65%, rgba(5,6,10,.82)),
      url('assets/backgrounds/menu_bg.jpg') center/cover no-repeat;
  }
  #gameFrame.menu-mode .wrap{
    height:100%; padding:0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .menu-hero{ text-align:center; }
  .outline-text{
    font-weight:900;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#14161f;                 /* preenchimento opaco */
    -webkit-text-stroke: 2px #fff;
    text-stroke: 2px #fff;
  }
  .game-title{
    font-size: clamp(40px, 9vw, 92px);
    margin:0 0 36px;
  }
  .play-btn{
    font-family:inherit;
    font-size: clamp(20px, 3.2vw, 30px);
    padding: 16px 60px;
    background: rgba(255,255,255,.5);   /* meio 50% opaco, como pedido */
    border: 3px solid #fff;
    border-radius: 12px;
    cursor:pointer;
    transition: background .15s, transform .1s;
  }
  .play-btn:hover{ background: rgba(255,255,255,.65); transform:translateY(-2px); }

  /* Largura confortável de leitura pras telas de formulário/menu (draft,
     leilão, Anidex...). A tela de BATALHA tem sua própria regra logo abaixo
     (#gameFrame.battle-mode .wrap) que ANULA isso e usa a viewport inteira --
     é lá que o espaço desperdiçado das laterais estava sendo causado. */
  .wrap{max-width: 920px; margin:0 auto;}
  h1,h2,h3{font-weight:700; letter-spacing:.3px; margin:0 0 6px;}
  h1{font-size:26px;}
  h2{font-size:19px;}
  h3{font-size:15px;}
  .eyebrow{
    text-transform:uppercase; font-size:11px; letter-spacing:2px; color: var(--gold);
    font-weight:700; margin-bottom:4px;
  }
  .sub{color:var(--text-dim); font-size:14px; margin-bottom:20px;}
  .card{
    background: linear-gradient(180deg, var(--panel), #12141c);
    border:1px solid var(--line);
    border-top:2px solid var(--gold-dim);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom:16px;
  }
  .btn{
    background: linear-gradient(180deg, #2a2f3d, #1e222e);
    border:1px solid var(--line);
    color: var(--text);
    padding: 11px 18px;
    border-radius: 8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition: border-color .15s, transform .1s, box-shadow .15s;
  }
  .btn:hover{border-color: var(--gold-dim);}
  .btn:active{transform: scale(.97);}
  .btn.primary{background: linear-gradient(180deg, #e0b559, #c79a3f); color:#1a1509; border:none; box-shadow:0 2px 10px rgba(224,181,89,.25);}
  .btn.primary:hover{box-shadow:0 3px 16px rgba(224,181,89,.4); transform:translateY(-1px);}
  .btn.danger{background: linear-gradient(180deg, #d1495b, #a83447); color:#fff; border:none;}
  .diff-btn{flex:1;}
  .diff-btn.active{background:linear-gradient(180deg,var(--teal),#0f6e56); color:#fff; border:none;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  input[type=text], input[type=number]{
    background: var(--panel2);
    border:1px solid var(--line);
    color: var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    width:100%;
  }
  label{font-size:12px; color:var(--text-dim); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:1px;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row > *{flex:1; min-width:140px;}
  .center{text-align:center;}
  .logo-badge{display:flex; justify-content:center; margin-bottom:10px; filter:drop-shadow(0 0 18px rgba(224,181,89,.35));}
  .code-display{
    font-size:38px; font-weight:800; letter-spacing:8px; color:var(--gold);
    text-align:center; padding:14px 0; font-family: monospace;
  }
  .badge{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px;
    font-weight:700; text-transform:uppercase; letter-spacing:.5px;
  }
  .badge.weak{background:rgba(122,129,148,.18); color:var(--weak);}
  .badge.medium{background:rgba(79,179,169,.18); color:var(--medium);}
  .badge.strong{background:rgba(209,73,91,.18); color:var(--strong);}
  .badge.physical{background:rgba(224,181,89,.18); color:var(--physical);}
  .badge.magic{background:rgba(127,119,221,.18); color:#a29bea;}
  .badge.hybrid{background:rgba(224,181,89,.12); color:#c9b98a;}
  .badge.once{background:rgba(224,181,89,.12); color:var(--gold); border:1px solid var(--gold-dim);}

  /* ---- Rank oficial: D < C < B < A < S < Z ----
     Z é o topo: único com brilho, pra não se confundir com S numa
     olhada rápida no celular. */
  .badge.rank-D{background:rgba(122,129,148,.18); color:#b7bcc9; border:1px solid #5b6273;}
  .badge.rank-C{background:rgba(79,140,224,.18); color:#8fc0ff; border:1px solid #3f6fb0;}
  .badge.rank-B{background:rgba(47,143,122,.20); color:#7fe0c9; border:1px solid #2f8f7a;}
  .badge.rank-A{background:rgba(155,81,224,.22); color:#cfa6ff; border:1px solid #9b51e0;}
  .badge.rank-S{background:rgba(224,181,89,.2); color:#ffd97a; border:1px solid var(--gold);}
  .badge.rank-Z{
    background:linear-gradient(120deg, rgba(214,48,49,.34), rgba(255,110,80,.28));
    color:#ffb3ad; border:1px solid #e0332f; box-shadow:0 0 10px rgba(224,51,47,.5);
  }

  /* --- Anidex: grupos por anime --- */
  .anime-group{margin-bottom:14px;}
  .anime-head{
    position:sticky; top:0; z-index:2;
    background:linear-gradient(180deg,#161922,rgba(22,25,34,.92));
    padding:8px 4px 7px; margin-bottom:6px;
    font-size:12px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--gold); border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .anime-count{
    color:var(--text-dim); font-weight:700; letter-spacing:0;
    background:rgba(255,255,255,.06); padding:1px 8px; border-radius:20px; font-size:11px;
  }

  /* --- gráfico de radar --- */
  .radar-wrap{display:flex; justify-content:center; margin:8px 0 4px;}
  .radar{width:100%; max-width:300px; height:auto; overflow:visible;}

  .char-hero{
    text-align:center; padding: 22px 0 10px;
  }
  .char-hero .name{font-size:26px; font-weight:800; margin-bottom:4px;}
  .char-hero .anime{color:var(--text-dim); font-size:13px; margin-bottom:10px;}
  .stat-row{display:flex; justify-content:center; gap:22px; margin:14px 0 4px; flex-wrap:wrap;}
  .stat{text-align:center;}
  .stat .val{font-size:22px; font-weight:800;}
  .stat .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px;}
  .attacks{display:grid; grid-template-columns:1fr; gap:8px; margin-top:14px;}
  .attack{
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .attack .an{font-weight:700; font-size:13.5px;}
  .attack .ad{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .players-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:600px){.players-grid{grid-template-columns:1fr;}}
  .player-panel{
    background:var(--panel2); border:1px solid var(--line); border-radius: var(--radius); padding:14px;
  }
  .player-panel.leader{border-color: var(--gold-dim); box-shadow: 0 0 0 1px var(--gold-dim) inset;}
  .player-panel h3{display:flex; justify-content:space-between; align-items:center;}
  .money{color:var(--gold); font-weight:800;}
  .team-list{list-style:none; padding:0; margin:10px 0 0; font-size:13px;}
  .team-list li{padding:5px 0; border-top:1px solid var(--line); display:flex; justify-content:space-between;}
  .team-list li:first-child{border-top:none;}
  .team-list .slot-empty{color:var(--text-dim); font-style:italic;}
  .bid-controls{display:flex; gap:8px; margin-top:12px;}
  .bid-controls input{flex:1;}
  .log{
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    max-height:140px; overflow-y:auto; font-size:12.5px; color:var(--text-dim); margin-top:14px;
  }
  .log div{padding:3px 0; border-bottom:1px dashed var(--line);}
  .log div:last-child{border-bottom:none;}
  .pill-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .pill-tabs button{
    flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--text-dim);
    padding:9px; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer;
  }
  .pill-tabs button.active{background:var(--gold); color:#1a1509; border-color:var(--gold);}
  .hint{font-size:12px; color:var(--text-dim); margin-top:6px;}
  .divider{height:1px; background:var(--line); margin:16px 0;}
  .roster-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  @media(max-width:600px){.roster-grid{grid-template-columns:1fr;}}
  .mini-card{
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px;
  }
  .mini-card .mn{font-weight:700; font-size:13.5px;}
  .mini-card .ma{font-size:11px; color:var(--text-dim); margin-bottom:6px;}
  select{
    background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:8px; border-radius:8px; width:100%; font-size:13px;
  }
  .status-line{font-size:12.5px; color:var(--text-dim); text-align:center; margin-top:8px;}
  .flash{animation: flashIn .4s ease;}
  @keyframes flashIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .coin-stage{display:flex; flex-direction:column; align-items:center; padding:30px 0;}
  .coin{
    width:90px; height:90px; border-radius:50%;
    background: linear-gradient(180deg,var(--gold),#a9822f);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#1a1509; font-size:13px;
    border:3px solid #7a601f;
    perspective:600px;
  }
  .coin.flipping{animation: coinFlip 1.4s ease-in-out;}
  @keyframes coinFlip{
    0%{transform:rotateY(0deg);}
    100%{transform:rotateY(1800deg);}
  }
  .turn-banner{
    text-align:center; padding:10px; border-radius:8px; margin-bottom:14px;
    background:rgba(224,181,89,.1); border:1px solid var(--gold-dim); font-weight:700; font-size:14px;
  }
  .turn-banner.opp{background:rgba(209,73,91,.08); border-color:var(--crimson-dim);}

  /* =========================================================================
     TELA DE BATALHA -- grid fullscreen de verdade (era isto que estava
     preso num container estreito: .battle-stage tinha altura FIXA em px, e
     tudo -- log, ataques -- vivia empilhado por cima dela mesma). Agora é
     um grid: área principal (arena + rodapé) + coluna de iniciativa à
     direita (~15%, entre 110px e 220px).
     ========================================================================= */
  #gameFrame.battle-mode .wrap{
    max-width:none; width:100%; height:100%; margin:0; padding:0;
    overflow:hidden; display:block;
  }
  .battle-layout{
    display:grid; width:100%; height:100%; min-width:0; min-height:0;
    grid-template-columns:minmax(0,1fr) clamp(128px,12vw,190px);
    grid-template-rows:auto minmax(0,1fr);
    gap:6px; padding:8px;
  }
  .battle-header{ grid-column:1 / 3; min-width:0; }
  .battle-main{
    grid-column:1; grid-row:2; min-width:0; min-height:0;
    display:grid; grid-template-rows:minmax(0,1fr) minmax(76px,clamp(76px,15vh,150px)); gap:6px;
  }
  .battle-bottom{
    display:grid; grid-template-columns:minmax(220px,34%) minmax(0,66%); gap:6px; min-width:0; min-height:0;
  }
  @media(max-width:720px){ .battle-bottom{grid-template-columns:1fr;} }

  /* ---- coluna de iniciativa (ORDEM DOS ATAQUES) ----
     Mostra os 2 times (dianteira + traseira) ordenados por velocidade --
     quem tem mais velocidade tende a agir primeiro na rodada. É um preview
     de ordem, não uma fila de "várias ações por rodada" (o motor de batalha
     continua sendo por rodadas simultâneas, como já era). */
  .initiative-col{
    grid-column:2; grid-row:2; min-width:0; min-height:0;
    background:var(--panel2); border:1px solid var(--line); border-radius:12px;
    padding:8px 6px; display:flex; flex-direction:column; gap:6px;
    overflow-y:auto;
  }
  .initiative-title{
    font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim);
    text-align:center; margin-bottom:2px; flex:0 0 auto;
  }
  .init-slot{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:5px 2px; border-radius:8px; border:1px solid transparent;
  }
  .init-slot.is-next{ border-color:var(--gold); background:rgba(224,181,89,.12); }
  .init-slot .sprite-chip{ height:34px; }
  .init-slot .stick.sprite-chip{ height:28px; }
  .init-name{ font-size:8.5px; color:var(--text-dim); text-align:center; line-height:1.2; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .init-spd{ font-size:8px; color:var(--gold); }
  .init-slot.dead{ opacity:.3; }

  /* =========================================================================
     ARENA DE BATALHA — formação 5x5. Cada lado mostra os 5 lutadores ao
     mesmo tempo: 3 na coluna da FRENTE (mais perto do centro, viram o ativo,
     clicáveis pra trocar) + 2 na coluna de TRÁS (carregam uma barra e usam
     a habilidade de suporte quando cheia). Nada de cartas de personagem —
     as ações de ataque ficam no painel de baixo (.atk-dock).
     ========================================================================= */
  .battle-stage{
    position:relative; min-height:0; border-radius:16px; overflow:hidden;
    border:1px solid var(--line);
    background:
      radial-gradient(ellipse 340px 160px at 78% 20%, rgba(209,73,91,.14), transparent 70%),
      radial-gradient(ellipse 380px 190px at 22% 82%, rgba(79,179,169,.13), transparent 70%),
      linear-gradient(180deg, #1a1f2c 0%, #12161f 48%, #090b11 100%);
    display:flex; flex-direction:column;
  }
  .battle-stage::after{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:3;
    background:radial-gradient(ellipse 105% 88% at 50% 45%, transparent 55%, rgba(0,0,0,.5) 100%);
  }

  /* ---- formação ---- */
  .formation-area{
    flex:1 1 auto; position:relative; z-index:2; min-height:0;
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    align-items:center; gap:0; padding:12px 2.5vw 4px;
  }
  .fside{ min-width:0; display:grid; align-items:center; gap:clamp(6px,1vw,18px); }
  .fside-player{grid-template-columns:minmax(38px,.7fr) minmax(90px,1fr);}
  .fside-enemy{grid-template-columns:minmax(90px,1fr) minmax(38px,.7fr);}
  .fcol{ display:flex; flex-direction:column; gap:clamp(10px,2vh,20px); align-items:center; justify-content:center; }
  .fcol-back{ opacity:.92; }

  .fchip{ position:relative; display:flex; flex-direction:column; align-items:center; width:60px; }
  .fchip.clicavel, .fchip.ready{ cursor:pointer; }
  .fchip.dead .sprite-chip{ filter:grayscale(1) brightness(.5); }
  .fchip-hp{
    width:50px; height:6px; background:#05060a; border-radius:4px; overflow:hidden;
    border:1px solid rgba(0,0,0,.6); margin-bottom:3px;
  }
  .fchip-hp-fill{ height:100%; transition:width .3s; }
  .fchip-hp-fill.hp-high{background:linear-gradient(90deg,#4fb3a9,#7fd8cf);}
  .fchip-hp-fill.hp-mid{background:linear-gradient(90deg,#e0b559,#f0d38a);}
  .fchip-hp-fill.hp-low{background:linear-gradient(90deg,#d1495b,#f07a89);}

  /* Barra de CARGA (ataque/dano) -- sempre abaixo da barra de vida, sempre
     menor/mais fina que ela. Azul enquanto carrega; vira vermelha + ganha
     uma animação de "fogo" (gradiente deslizando + leve pulso) ao chegar
     em 5/5 -- tudo em CSS puro, sem imagem nenhuma. */
  .fchip-power{
    width:44px; height:4px; background:#05060a; border-radius:3px; overflow:hidden;
    margin:2px 0 3px; border:1px solid rgba(0,0,0,.6);
  }
  .fchip-power-fill{
    height:100%; background:linear-gradient(90deg,#2f6fd6,#6fb3ff); transition:width .3s ease;
  }
  .fchip-power.full{ border-color:#ff5a3c; box-shadow:0 0 7px rgba(255,90,60,.85); }
  .fchip-power.full .fchip-power-fill{
    background:linear-gradient(90deg,#ff3b1f,#ffb23c,#ff3b1f);
    background-size:200% 100%;
    animation: powerFireSlide .8s linear infinite, powerFirePulse 1.1s ease-in-out infinite;
  }
  @keyframes powerFireSlide{ 0%{background-position:0% 0;} 100%{background-position:200% 0;} }
  @keyframes powerFirePulse{ 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.35);} }

  .sprite-chip{ height:50px; width:auto; }
  .stick.sprite-chip{ height:42px; }
  .fchip.active .sprite-box{ filter:drop-shadow(0 0 8px rgba(224,181,89,.85)); }
  .fchip.active .fchip-hp{ border-color:var(--gold); }
  .fchip.targetable{ cursor:pointer; }
  .fchip.targetable .sprite-box{
    filter:drop-shadow(0 0 9px rgba(224,51,47,.9));
    animation: fchipReady 1s ease-in-out infinite;
  }
  .fchip.targetable .fchip-hp{ border-color:#e0332f; box-shadow:0 0 6px rgba(224,51,47,.7); }
  .fchip-charge{
    width:50px; height:4px; background:#05060a; border-radius:3px; overflow:hidden;
    margin-top:3px; border:1px solid rgba(0,0,0,.6);
  }
  .fchip-charge-fill{ height:100%; background:linear-gradient(90deg,#7f77dd,#b39dff); }
  .fchip.ready .fchip-charge{ box-shadow:0 0 6px rgba(163,95,224,.8); border-color:#a35fe0; }
  .fchip.ready{ animation: fchipReady 1.4s ease-in-out infinite; border-radius:8px; }
  @keyframes fchipReady{ 0%,100%{filter:none;} 50%{filter:drop-shadow(0 0 8px rgba(163,95,224,.7));} }
  .fchip.clicavel:hover .sprite-chip, .fchip.ready:hover .sprite-chip{ filter:brightness(1.25); }
  @media(min-width:601px){
    .fchip{ width:74px; }
    .fchip-hp, .fchip-charge{ width:60px; }
    .fchip-power{ width:54px; }
    .sprite-chip{ height:62px; }
    .stick.sprite-chip{ height:52px; }
    .fcol{ gap:20px; }
  }
  /* .stage-slot/.sprite-box continuam existindo (usados pelo sistema de FX,
     que acha o lutador certo via data-fighter-id independente de onde ele
     está desenhado) -- só deixaram de ser posicionados em absoluto, porque
     agora fazem parte do fluxo normal dentro do .fchip. */
  .stage-slot{position:relative; display:flex; flex-direction:column; align-items:center;}
  .sprite-box{position:relative; display:block;}
  .sprite-img{
    display:block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    -ms-interpolation-mode: nearest-neighbor;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.55));
  }
  /* Arte final tem anti-aliasing e é exibida um pouco MENOR que o original.
     Nearest-neighbor numa redução joga pixels fora e serrilha tudo — então a
     arte em bitmap escala suave, e só o gerador procedural fica pixelado. */
  .sprite-bitmap{ image-rendering: auto; }
  /* Personagens com arte "espelhável" (uma pose só, vira o outro lado com
     CSS): cada personagem declara pra que lado a arte ORIGINAL olha
     (sprite.facing em characters.py — "right" por padrão, ou "left" pra
     quem já vem olhando pra esquerda, como o Naruto). O motor decide sozinho
     de que lado (jogador ou inimigo) aplicar .mirror-x pra fechar a
     convenção "time do jogador olha pra direita, inimigo olha pra
     esquerda" -- sem precisar de uma segunda arte desenhada ao contrário. */
  .sprite-direction{display:block; width:100%; transform-origin:50% 100%;}
  .sprite-direction.mirror-x{transform:scaleX(-1);}
  /* O espelhamento fica no wrapper e a animação no sprite interno. Assim
     scaleX(-1) nunca é sobrescrito pelo transform das animações de idle/ataque. */
  .mirror-x{ transform:scaleX(-1); }
  /* --- animações de sprite --- */
  @keyframes idleBreath{
    0%,100%{transform:translateY(0) scaleY(1);}
    50%{transform:translateY(-1.5px) scaleY(1.02);}
  }
  .anim-idle{animation: idleBreath 2.6s ease-in-out infinite; transform-origin:50% 100%;}
  @keyframes enterFromBack{ from{opacity:0; transform:translate(38px,-14px) scale(.7);} to{opacity:1; transform:none;} }
  @keyframes enterFromFront{ from{opacity:0; transform:translate(-38px,16px) scale(.7);} to{opacity:1; transform:none;} }
  .anim-enter-enemy{animation: enterFromBack .42s ease-out;}
  .anim-enter-player{animation: enterFromFront .42s ease-out;}
  /* o jogador avança PRA CIMA (rumo ao inimigo), o inimigo avança PRA BAIXO */
  @keyframes lungeUp{
    0%{transform:none;} 35%{transform:translate(26px,-40px) scale(1.06);}
    55%{transform:translate(26px,-40px) scale(1.06);} 100%{transform:none;}
  }
  @keyframes lungeDown{
    0%{transform:none;} 35%{transform:translate(-26px,40px) scale(1.06);}
    55%{transform:translate(-26px,40px) scale(1.06);} 100%{transform:none;}
  }
  .anim-attack-player{animation: lungeUp .5s ease-in-out;}
  .anim-attack-enemy{animation: lungeDown .5s ease-in-out;}
  @keyframes hitRecoil{
    0%,100%{transform:translateX(0);}
    15%{transform:translateX(-6px);} 35%{transform:translateX(5px);}
    55%{transform:translateX(-4px);} 75%{transform:translateX(3px);}
  }
  @keyframes hitFlash{ 0%,100%{filter:none;} 30%{filter:brightness(4) saturate(0);} 60%{filter:none;} }
  .anim-hit{animation: hitRecoil .42s ease-in-out, hitFlash .42s steps(2,end);}
  @keyframes koFall{
    0%{transform:none; opacity:1;}
    30%{transform:translateY(-4px) rotate(-6deg); opacity:1;}
    100%{transform:translateY(26px) rotate(-78deg); opacity:0;}
  }
  .anim-ko{animation: koFall .75s ease-in forwards; transform-origin:50% 100%;}
  @media(prefers-reduced-motion: reduce){
    .anim-idle,.anim-enter-enemy,.anim-enter-player,.anim-attack-player,
    .anim-attack-enemy,.anim-hit,.anim-ko{animation:none !important;}
  }

  /* --- aura de transformação (Ultimate) --- */
  .sprite-aura{
    position:absolute; inset:-16% -22%; border-radius:50%; z-index:-1; pointer-events:none;
    background:radial-gradient(ellipse at center, var(--aura) 0%, transparent 68%);
    opacity:.55; animation: auraPulse 1.5s ease-in-out infinite;
  }
  @keyframes auraPulse{ 0%,100%{opacity:.42; transform:scale(1);} 50%{opacity:.7; transform:scale(1.07);} }
  .aura-spark{
    position:absolute; width:2px; height:9px; border-radius:2px; background:var(--aura);
    z-index:3; pointer-events:none; animation: sparkRise 1.1s linear infinite;
  }
  @keyframes sparkRise{ 0%{opacity:0; transform:translateY(6px) scaleY(.5);} 35%{opacity:1;} 100%{opacity:0; transform:translateY(-26px) scaleY(1.3);} }

  /* =======================================================================
     TRANSFORMAÇÃO (Ultimate)
     Duas fases: carrega ki (tremor + aura azul + motes subindo), depois estoura
     num clarão e vira a forma transformada. A arte de carga já traz a aura azul
     pintada, então a aura dourada de CSS fica escondida durante essa fase —
     senão as duas se sobrepõem e viram uma sopa de cor.
     ======================================================================= */
  .stage-charging{ animation: chargeQuake .16s linear infinite; }
  @keyframes chargeQuake{
    0%,100%{transform:translate(0,0);} 25%{transform:translate(-1.5px,1px);}
    50%{transform:translate(1.5px,-1px);} 75%{transform:translate(-1px,-1.5px);}
  }
  .charge-glow{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background: radial-gradient(ellipse 55% 50% at var(--gx) var(--gy), rgba(90,190,255,.42), transparent 72%);
    animation: chargePulse .42s ease-in-out infinite alternate;
  }
  @keyframes chargePulse{ from{opacity:.45;} to{opacity:1;} }
  .ki-mote{
    position:absolute; width:4px; height:11px; border-radius:2px; pointer-events:none;
    background:linear-gradient(180deg,#d6f2ff,#3aa6ff); box-shadow:0 0 9px #58c0ff;
    animation: kiRise 1s ease-in forwards;
  }
  @keyframes kiRise{
    0%{opacity:0; transform:translateY(0) scaleY(.6);}
    20%{opacity:1;}
    100%{opacity:0; transform:translateY(-95px) scaleY(1.6);}
  }
  .sprite-box.charging .sprite-aura, .sprite-box.charging .aura-spark{ display:none; }

  /* Faixa do título. O deslize é rápido nas pontas e lento no centro — daí a
     curva (.1,.8,.9,.2), que sobe depressa, chapa no meio e dispara de novo.
     Deslocamento e opacidade são DUAS animações separadas de propósito: cada
     uma precisa da sua própria curva de tempo. */
  .ult-title{
    position:fixed; left:0; right:0; top:36%; z-index:9999; pointer-events:none;
    text-align:center; white-space:nowrap; font-style:italic;
    font-size:clamp(30px, 10vw, 74px); font-weight:900; letter-spacing:3px;
    color:#fff6c4;
    text-shadow:0 0 8px #ffd54a, 0 0 26px #ff9d2e, 0 4px 0 #7a4a00, 0 8px 20px rgba(0,0,0,.75);
    animation: ultSweep 3.4s cubic-bezier(.1,.8,.9,.2) forwards,
               ultFade  3.4s linear forwards;
  }
  @keyframes ultSweep{ from{transform:translateX(-125vw);} to{transform:translateX(125vw);} }
  @keyframes ultFade{ 0%{opacity:0;} 9%{opacity:1;} 88%{opacity:1;} 100%{opacity:0;} }
  @media(prefers-reduced-motion: reduce){
    .stage-charging{animation:none !important;}
    .ult-title{animation: ultFade 3.4s linear forwards !important; transform:none !important;}
  }

  /* --- escolha de modo na tela inicial --- */
  .mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  @media(max-width:600px){ .mode-grid{grid-template-columns:1fr;} }
  .mode-card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line); border-top:2px solid var(--line);
    border-radius:var(--radius); padding:14px; cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .mode-card:hover{border-color:var(--gold-dim);}
  .mode-card:active{transform:scale(.985);}
  .mode-card.sel{border-color:var(--gold); border-top-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset;}
  .mode-ico{font-size:26px; line-height:1;}
  .mode-name{font-weight:800; font-size:16px; margin:6px 0 4px;}
  .mode-desc{font-size:12px; color:var(--text-dim); line-height:1.45;}

  /* --- menu principal (Jogar -> login -> menu) --- */
  .menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  @media(max-width:600px){ .menu-grid{grid-template-columns:1fr;} }
  .menu-card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line); border-top:2px solid var(--line);
    border-radius:var(--radius); padding:18px 14px; cursor:pointer;
    transition:border-color .15s, transform .1s; text-align:center;
  }
  .menu-card:hover{border-color:var(--gold-dim); transform:translateY(-1px);}
  .menu-card:active{transform:scale(.985);}
  .menu-card .mode-ico{font-size:32px;}
  .menu-card.disabled{opacity:.45; cursor:not-allowed;}
  .menu-card.disabled:hover{border-color:var(--line); transform:none;}
  .menu-card .soon-badge{
    display:inline-block; font-size:10px; letter-spacing:1px; text-transform:uppercase;
    color:var(--text-dim); border:1px solid var(--line); border-radius:20px;
    padding:2px 8px; margin-top:6px;
  }
  .back-link{
    display:inline-block; font-size:12px; color:var(--text-dim); cursor:pointer;
    margin-bottom:10px; text-decoration:underline;
  }
  .back-link:hover{color:var(--text);}

  /* --- lista de amigos --- */
  .friend-list{margin:10px 0;}
  .friend-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; border:1px solid var(--line); border-radius:8px;
    margin-bottom:6px; background:var(--panel2);
  }
  .friend-row .fname{font-weight:600; font-size:14px;}
  .friend-empty{font-size:12px; color:var(--text-dim); padding:6px 0;}
  .acc-error{color:var(--crimson); font-size:12px; margin-top:8px; min-height:14px;}

  /* --- CARTAS DO SORTEIO: carrossel horizontal, estilo Mercado Noturno -----
     Estrutura em 2 níveis: .draft-row é o container que rola; .draft-track é a
     tira de cartas. O track usa width:max-content + margin auto, então quando
     as 5 cabem ele CENTRALIZA sozinho, e quando não cabem ele rola (e o JS
     centraliza a carta do meio). `justify-content:center` sozinho não serve —
     com overflow ele corta o início da lista e deixa a 1ª carta inalcançável. */
  .draft-row{
    overflow-x:auto; scroll-snap-type:x mandatory;
    scrollbar-width:none; -ms-overflow-style:none; padding:8px 0 10px;
  }
  .draft-row::-webkit-scrollbar{display:none;}
  .draft-track{display:flex; gap:16px; width:max-content; margin:0 auto; padding:0 12px;}

  .draft-card{
    position:relative; flex:0 0 auto; width:144px; scroll-snap-align:center;
    border:1px solid var(--line); border-radius:14px;
    padding:10px 8px 12px; cursor:pointer; overflow:hidden;
    transition:transform .15s, box-shadow .15s;
  }
  .draft-card:active{transform:scale(.97);}
  @media(min-width:601px){
    .draft-card{width:160px; padding:12px 10px 14px;}
    .draft-track{gap:22px;}
  }

  .draft-art{display:flex; justify-content:center; align-items:flex-end; height:70px;}
  .draft-art .sprite-img, .draft-art .stick{height:70px; width:auto;}
  .draft-radar-mini{width:100%; opacity:.95; margin-top:2px;}
  .draft-radar-mini .radar{width:100%; height:auto;}
  .draft-anime{
    font-size:9px; text-transform:uppercase; letter-spacing:.5px; color:rgba(255,255,255,.72);
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    position:relative; z-index:4;
  }
  .draft-name{font-weight:800; font-size:12.5px; margin-top:3px; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .draft-meta{margin-top:4px; display:flex; gap:4px; flex-wrap:wrap; justify-content:center;}
  .draft-class{font-size:9.5px; color:var(--text-dim); margin-top:3px; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .draft-reveal-body{position:relative; z-index:4;}

  /* A carta INTEIRA é da cor da raridade, não só a borda de cima. O gradiente
     vai da cor cheia no topo até quase o fundo do painel embaixo, pra o texto
     continuar legível. */
  .rank-card-D{border-color:#5b6273; background:linear-gradient(170deg, #4a5162 0%, #2b303c 45%, #1a1e26 100%);}
  .rank-card-C{border-color:#3f6fb0; background:linear-gradient(170deg, #2f5f9e 0%, #23405f 45%, #16202e 100%);}
  .rank-card-B{border-color:#2f8f7a; background:linear-gradient(170deg, #2f8f7a 0%, #1f5548 45%, #16221e 100%);}
  .rank-card-A{border-color:#9b51e0; background:linear-gradient(170deg, #7b3cc0 0%, #4a2670 45%, #221534 100%);}
  .rank-card-S{border-color:#e0b559; background:linear-gradient(170deg, #c9962f 0%, #6d5220 45%, #2a2113 100%);}
  .rank-card-Z{border-color:#e0332f; background:linear-gradient(170deg, #cf2b28 0%, #6e1a19 45%, #2a100f 100%);
                      box-shadow:0 0 16px rgba(224,51,47,.28);}
  .draft-card:hover{ box-shadow:0 0 18px rgba(255,255,255,.14); }

  /* ---- SEQUÊNCIA DE REVELAÇÃO ----
     1. carta preta com brilho BRANCO ao redor
     2. nome do anime aparece
     3. o brilho branco vira a cor da raridade
     4. a cor preenche a carta DAS BORDAS AO CENTRO
     5. o resto (arte, radar, nome, badges) aparece
     O truque do passo 4: a cor final já está no fundo da carta o tempo todo;
     o que existe é uma tampa preta (::before) por cima, que encolhe do
     tamanho cheio até zero. Encolhendo em direção ao centro, ela descobre a
     cor começando pelas bordas. */
  /* Sem pointer-events:none aqui. A classe .revealing não é removida por
     nenhum evento garantido, então bloquear o clique por CSS deixava a carta
     permanentemente inclicável se a classe sobrasse. O bloqueio durante a
     revelação passou a ser por TEMPO, dentro de pickDraft — se algo falhar,
     ele se cura sozinho quando o relógio passa. */
  .draft-card.revealing{ cursor:default; }
  .draft-card.revealing::before{
    content:""; position:absolute; inset:0; z-index:3; border-radius:inherit;
    background:#0d0f14;
    animation: coverShrink .85s cubic-bezier(.55,.06,.3,.95) 1.85s forwards;
  }
  @keyframes coverShrink{
    from{ transform:scale(1); opacity:1; }
    to  { transform:scale(0); opacity:.85; }
  }
  .draft-card.revealing{
    animation: glowWhiteToRank 2.7s ease-out both;
  }
  /* O brilho começa branco e neutro (não entrega a raridade) e só no fim vira
     a cor do rank, junto com o preenchimento. */
  @keyframes glowWhiteToRank{
    0%  { box-shadow:0 0 0 0 rgba(255,255,255,0); }
    18% { box-shadow:0 0 16px 2px rgba(255,255,255,.55); }
    45% { box-shadow:0 0 22px 3px rgba(255,255,255,.85); }
    70% { box-shadow:0 0 24px 3px rgba(255,255,255,.6); }
    100%{ box-shadow:0 0 26px 4px var(--wash-color); }
  }
  .draft-card.revealing .draft-anime{ opacity:0; animation: revealFade .5s ease forwards 1.25s; }
  .draft-card.revealing .draft-reveal-body{ opacity:0; animation: revealFade .5s ease forwards 2.55s; }
  @keyframes revealFade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  @media(prefers-reduced-motion: reduce){
    .draft-card.revealing, .draft-card.revealing::before{ animation:none !important; }
    .draft-card.revealing::before{ display:none; }
    .draft-card.revealing .draft-anime, .draft-card.revealing .draft-reveal-body{ opacity:1; animation:none !important; }
  }

  /* --- SEU TIME: quadrados, não cartas ----
     Só a arte do personagem, contornada com a cor da raridade. Nome só no
     tooltip (title), pra fileira ficar compacta e caber sem rolar a tela. */
  .team-slots{display:flex; gap:8px; justify-content:center; margin-top:6px;}
  .team-slot{
    position:relative; width:56px; height:56px; border-radius:10px;
    border:2px dashed var(--line); background:rgba(255,255,255,.02);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  @media(min-width:601px){ .team-slot{width:68px; height:68px;} }
  .team-slot.filled{border-style:solid; background:rgba(0,0,0,.28);}
  .team-slot .sprite-img, .team-slot .stick{height:50px; width:auto;}
  @media(min-width:601px){ .team-slot .sprite-img, .team-slot .stick{height:60px;} }
  .team-slot-num{font-size:15px; font-weight:800; color:#3a4152;}
  .slot-rank-D{border-color:#5b6273;}
  .slot-rank-C{border-color:#3f6fb0; box-shadow:0 0 10px rgba(79,140,224,.3);}
  .slot-rank-B{border-color:#2f8f7a; box-shadow:0 0 10px rgba(47,143,122,.3);}
  .slot-rank-A{border-color:#9b51e0; box-shadow:0 0 10px rgba(155,81,224,.35);}
  .slot-rank-S{border-color:#e0b559; box-shadow:0 0 12px rgba(224,181,89,.4);}
  .slot-rank-Z{border-color:#e0332f; box-shadow:0 0 14px rgba(224,51,47,.45);}

  /* --- FORMAÇÃO (pré-batalha): dois blocos lado a lado --- */
  /* --- FASE DE CENÁRIO: seleção com hover sincronizado --- */
  .scenario-preview{
    background:var(--panel2); border:1px solid var(--line); border-radius:12px;
    padding:16px; margin-bottom:12px; min-height:64px; text-align:center;
  }
  .sc-preview-name{font-size:18px; font-weight:800; color:var(--gold);}
  .scenario-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
    gap:8px; margin-bottom:6px;
  }
  .scenario-card{
    position:relative; background:var(--panel2); border:2px solid var(--line); border-radius:10px;
    padding:16px 10px; cursor:pointer; color:var(--text); font-family:inherit;
    transition:border-color .15s, transform .1s, box-shadow .15s;
    display:flex; flex-direction:column; align-items:center; gap:6px; min-height:70px;
  }
  .scenario-card:hover:not(:disabled){transform:translateY(-1px);}
  .scenario-card:disabled{cursor:default;}
  .scenario-card.is-random{border-style:dashed;}
  .sc-name{font-size:13px; font-weight:700; text-align:center;}
  /* Meu hover = contorno AZUL (teal); hover do adversário = contorno VERMELHO.
     Os dois podem estar ativos ao mesmo tempo -- não são mutuamente exclusivos. */
  .scenario-card.hover-me{border-color:var(--teal); box-shadow:0 0 0 1px var(--teal), 0 0 12px rgba(79,179,169,.4);}
  .scenario-card.hover-opp{border-color:var(--crimson); box-shadow:0 0 0 1px var(--crimson), 0 0 12px rgba(209,73,91,.4);}
  .scenario-card.hover-me.hover-opp{
    box-shadow:0 0 0 1px var(--teal), 0 0 0 3px var(--crimson), 0 0 14px rgba(209,73,91,.4);
  }
  .scenario-card.picked-me{border-color:var(--teal); background:rgba(79,179,169,.12);}
  .scenario-card.picked-opp{border-color:var(--crimson);}
  .sc-tag{
    font-size:10px; font-weight:800; padding:2px 8px; border-radius:20px; white-space:nowrap;
  }
  .sc-tag-me{background:rgba(79,179,169,.22); color:#7fd8cf; border:1px solid var(--teal);}
  .sc-tag-opp{background:rgba(209,73,91,.22); color:#ff8a9a; border:1px solid var(--crimson);}

  .lineup-blocks{display:flex; gap:10px; align-items:flex-start;}
  .lineup-block{
    flex:1; min-width:0; background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line); border-radius:var(--radius); padding:10px 8px 12px;
  }
  /* nowrap: com wrap, o 3º slot de combate caía pra segunda linha e desalinhava
     os dois blocos. Os slots encolhem em vez de quebrar. */
  .lu-row{display:flex; gap:6px; justify-content:center; flex-wrap:nowrap; margin-top:6px;}
  .lu-row.pool-row{flex-wrap:wrap;}
  .lu-slot{
    position:relative; flex:0 1 auto; width:48px; height:48px; border-radius:10px;
    border:2px dashed var(--line); background:rgba(255,255,255,.02);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .lu-slot.filled{border-style:solid; background:rgba(0,0,0,.3); cursor:pointer;}
  .lu-slot.pool{border-style:solid;}
  .lu-slot .sprite-img, .lu-slot .stick{height:42px; width:auto;}
  .lu-slot-num{font-size:14px; font-weight:800; color:#3a4152;}
  .lu-pos{
    position:absolute; top:2px; left:3px; font-size:9px; font-weight:800;
    background:var(--gold); color:#1a1509; border-radius:20px; padding:0 5px;
  }
  .lu-pos.sup{background:var(--teal); color:#04231d;}
  .lu-arrows{display:flex; gap:8px; justify-content:center; margin-top:6px;}
  .lu-arrows .btn{padding:2px 12px; font-size:11px; line-height:1.4;}
  @media(min-width:601px){ .lu-slot{width:64px; height:64px;} .lu-slot .sprite-img, .lu-slot .stick{height:56px;} .lu-row{gap:8px;} }

  /* ===== PRÉVIA VISUAL DA FORMAÇÃO ===== */
  .lineup-preview{
    position:relative; width:100%; min-height:clamp(360px,62vh,680px);
    border:1px solid var(--line); border-radius:18px; overflow:hidden;
    background:
      radial-gradient(ellipse 55% 45% at 50% 42%, rgba(224,181,89,.08), transparent 70%),
      linear-gradient(180deg,#171b26 0%,#10141d 58%,#0a0d13 100%);
    box-shadow:inset 0 0 60px rgba(0,0,0,.28);
  }
  .lineup-preview::before{
    content:""; position:absolute; left:8%; right:8%; top:50%; height:1px;
    background:linear-gradient(90deg,transparent,rgba(224,181,89,.24),transparent);
  }
  .lineup-preview::after{
    content:""; position:absolute; inset:12% 8%; border:1px solid rgba(255,255,255,.035);
    border-radius:50%; pointer-events:none;
  }
  .lineup-camera{
    position:absolute; inset:0; display:grid; grid-template-columns:minmax(120px,.72fr) minmax(170px,1fr);
    align-items:center; justify-content:center; gap:clamp(20px,6vw,90px);
    padding:clamp(26px,5vh,54px) clamp(22px,8vw,150px);
  }
  .lineup-line{
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(10px,2vh,22px); min-height:0; height:100%;
  }
  .lineup-line-label{
    position:absolute; left:50%; top:0; transform:translateX(-50%); font-size:10px; font-weight:800;
    letter-spacing:2px; text-transform:uppercase; color:rgba(236,238,242,.35);
    pointer-events:none; white-space:nowrap;
  }
  .lineup-fighter{
    position:relative; width:clamp(105px,11vw,170px); height:clamp(145px,23vh,245px);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    cursor:grab; user-select:none; touch-action:none;
    transition:transform .16s ease, filter .16s ease, opacity .16s ease;
    z-index:2;
  }
  .lineup-fighter:hover{transform:translateY(-4px) scale(1.03); filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));}
  .lineup-fighter:active{cursor:grabbing;}
  .lineup-fighter.dragging{opacity:.42; transform:scale(.96);}
  .lineup-fighter.drag-over{filter:drop-shadow(0 0 14px rgba(79,179,169,.9));}
  .lineup-fighter .lineup-sprite{height:clamp(105px,17vh,185px); width:auto; max-width:100%;}
  .lineup-fighter .sprite-direction{height:auto; display:block;}
  .lineup-fighter .lineup-hp{
    width:clamp(72px,7vw,110px); height:5px; border-radius:5px; background:#05060a;
    border:1px solid rgba(0,0,0,.6); margin-bottom:5px; opacity:.75;
  }
  .lineup-fighter .lineup-pos{
    position:absolute; top:4px; left:50%; transform:translateX(-50%);
    font-size:9px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
    color:var(--gold); white-space:nowrap;
  }
  .lineup-fighter .lineup-name{
    position:absolute; bottom:0; transform:translateY(115%); max-width:100%;
    padding:3px 8px; border:1px solid rgba(255,255,255,.08); border-radius:999px;
    background:rgba(5,6,10,.72); font-size:10px; font-weight:700; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .lineup-instruction{
    margin:10px auto 0; text-align:center; color:var(--text-dim); font-size:12px;
  }
  .lineup-status{min-height:20px;}
  @media(max-height:700px){
    .lineup-preview{min-height:330px;}
    .lineup-fighter{height:130px;}
    .lineup-fighter .lineup-sprite{height:95px;}
  }

  /* --- SUPORTE em batalha: quadrado + barrinha de carga --- */
  .support-strip{margin-top:8px;}
  .support-row{display:flex; gap:8px;}
  .support-slot{
    position:relative; width:56px; padding:3px 3px 4px; border-radius:10px;
    border:2px solid var(--line); background:rgba(0,0,0,.28);
    display:flex; flex-direction:column; align-items:center; opacity:.75;
  }
  .support-slot .sprite-img, .support-slot .stick{height:38px; width:auto;}
  .support-bar{width:100%; height:5px; background:#05060a; border-radius:3px; overflow:hidden; margin-top:3px;}
  .support-bar-fill{height:100%; background:linear-gradient(90deg,#2f8f7a,var(--teal)); transition:width .4s ease;}
  /* Carga cheia: acende e passa a aceitar clique. */
  .support-slot.ready{
    opacity:1; cursor:pointer; border-color:var(--teal);
    box-shadow:0 0 12px rgba(79,179,169,.55);
    animation: supportReady 1.3s ease-in-out infinite;
  }
  .support-slot.ready .support-bar-fill{background:linear-gradient(90deg,var(--teal),#8ff0e2);}
  @keyframes supportReady{ 0%,100%{box-shadow:0 0 8px rgba(79,179,169,.4);} 50%{box-shadow:0 0 18px rgba(79,179,169,.85);} }

  .golden-banner{
    text-align:center; padding:10px; border-radius:10px; margin-bottom:12px; font-weight:800; font-size:13px;
    background:linear-gradient(120deg, rgba(224,181,89,.22), rgba(224,51,47,.18));
    border:1px solid var(--gold); color:#ffe9b0;
    animation: goldenPulse 1.6s ease-in-out infinite;
  }
  @keyframes goldenPulse{ 0%,100%{opacity:.85;} 50%{opacity:1;} }

  /* --- efeitos elementais e de impacto --- */
  .fx-layer{position:absolute; inset:0; pointer-events:none; z-index:5; overflow:hidden;}
  .fx-anchor{position:absolute; width:0; height:0;}
  .fx-burst{
    position:absolute; left:-34px; top:-34px; width:68px; height:68px; border-radius:50%;
    background:radial-gradient(circle, var(--fx) 0%, transparent 62%);
    animation: burstPop .55s ease-out forwards; opacity:0;
  }
  @keyframes burstPop{ 0%{opacity:0; transform:scale(.3);} 30%{opacity:.85; transform:scale(1);} 100%{opacity:0; transform:scale(1.5);} }
  .fx-particle{
    position:absolute; width:4px; height:4px; border-radius:50%; background:var(--fx);
    animation: particleFly .6s ease-out forwards; box-shadow:0 0 5px var(--fx);
  }
  @keyframes particleFly{ 0%{opacity:1; transform:translate(0,0) scale(1);} 100%{opacity:0; transform:translate(var(--px),var(--py)) scale(.2);} }
  /* gelo e metal viram cacos angulares em vez de bolinhas */
  .fx-particle.shard{border-radius:0; width:3px; height:8px;}
  /* elétrico: risco reto em vez de partícula */
  .fx-bolt{
    position:absolute; width:2px; height:30px; background:var(--fx); box-shadow:0 0 6px var(--fx);
    animation: boltFlick .34s steps(3,end) forwards;
  }
  @keyframes boltFlick{ 0%{opacity:1;} 100%{opacity:0;} }
  .fx-slash{
    position:absolute; left:-26px; top:-3px; width:52px; height:5px; border-radius:4px;
    background:linear-gradient(90deg, transparent, var(--fx), transparent);
    animation: slashSweep .35s ease-out forwards;
  }
  @keyframes slashSweep{ 0%{opacity:0; transform:scaleX(.2) rotate(-24deg);} 40%{opacity:1;} 100%{opacity:0; transform:scaleX(1.3) rotate(-24deg);} }
  .fx-dmg{
    position:absolute; font-weight:800; font-size:19px; color:#fff; z-index:6;
    text-shadow:0 2px 0 #6b1420, 0 0 10px rgba(0,0,0,.8); pointer-events:none;
    animation: dmgFloat .95s ease-out forwards;
  }
  .fx-dmg.heal{color:#8fe0a0; text-shadow:0 2px 0 #14401f;}
  @keyframes dmgFloat{ 0%{opacity:0; transform:translate(-50%,4px) scale(.6);} 20%{opacity:1; transform:translate(-50%,-8px) scale(1.15);} 100%{opacity:0; transform:translate(-50%,-38px) scale(1);} }
  /* meteoro: clarão de tela inteira + tremor da arena */
  .stage-flash{position:absolute; inset:0; background:var(--fx); opacity:0; z-index:7; pointer-events:none; animation: stageFlash .7s ease-out forwards;}
  @keyframes stageFlash{ 0%{opacity:0;} 18%{opacity:.72;} 100%{opacity:0;} }
  @keyframes stageQuake{
    0%,100%{transform:translate(0,0);}
    10%{transform:translate(-5px,3px);} 25%{transform:translate(5px,-3px);}
    40%{transform:translate(-4px,-2px);} 55%{transform:translate(4px,3px);}
    70%{transform:translate(-3px,1px);} 85%{transform:translate(3px,-1px);}
  }
  .stage-quake{animation: stageQuake .6s ease-in-out;}
  .meteor-streak{
    position:absolute; top:-40px; width:5px; height:56px; border-radius:4px;
    background:linear-gradient(180deg, transparent, var(--fx));
    box-shadow:0 0 14px var(--fx); animation: meteorDrop .55s ease-in forwards;
  }
  @keyframes meteorDrop{ 0%{opacity:0; transform:translateY(0) rotate(14deg);} 20%{opacity:1;} 100%{opacity:0; transform:translateY(340px) rotate(14deg);} }

  /* O palco escurece quando seu lutador cai, mas a formação continua acesa
     pra você escolher o substituto. */
  .stage-dim{ filter:brightness(.5) saturate(.7); pointer-events:none; }
  .fchip.clicavel{ animation: pickPulse 1.2s ease-in-out infinite; }
  @keyframes pickPulse{
    0%,100%{ box-shadow:0 0 0 1px rgba(224,181,89,.3); }
    50%{ box-shadow:0 0 0 1.5px rgba(224,181,89,.9), 0 0 12px rgba(224,181,89,.5); }
  }

  /* Painel de chat/log: agora é uma célula própria do grid (40% da faixa de
     baixo), não mais um retângulo flutuando por cima do palco -- por isso
     mostra bem mais linha do que antes. */
  .chat-panel{
    background:var(--panel2); border:1px solid var(--line); border-radius:12px;
    padding:8px 10px; min-width:0; min-height:0; overflow-y:auto;
    font-size:11px; line-height:1.5; color:var(--text-dim);
  }
  .chat-panel-title{
    font-size:9.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim);
    margin-bottom:4px; position:sticky; top:0; background:var(--panel2);
  }
  .chat-panel div.log-line{ white-space:normal; overflow-wrap:anywhere; margin-bottom:2px; }
  .chat-panel div.log-line:first-child{ color:var(--text); }

  .stick{display:block; margin:0 auto;}

  /* --- ATAQUES: painel próprio (60% da faixa de baixo) ----
     Os 4 (ou 5, com transformação) botões ficam lado a lado e SÓ quebram
     pra 2 linhas se não couberem -- nunca scroll horizontal. */
  .atk-dock{
    background:var(--panel2); border:1px solid var(--line); border-radius:12px;
    display:flex; flex-direction:row; flex-wrap:wrap; align-content:flex-start;
    gap:8px; padding:8px; min-width:0; overflow-y:auto;
  }

  .atk-pill{
    position:relative; display:flex; align-items:center; gap:8px;
    flex:1 1 clamp(120px, 22%, 220px); min-width:0; text-align:left; cursor:pointer; color:var(--text);
    padding:8px 10px; border-radius:999px;              /* pílula contínua */
    border:1px solid rgba(255,255,255,.10);
    background:linear-gradient(180deg, rgba(38,43,58,.95), rgba(22,26,36,.95));
    box-shadow:0 4px 14px rgba(0,0,0,.4);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:transform .1s, box-shadow .15s, border-color .15s;
  }
  .atk-pill:active:not(:disabled){transform:scale(.97);}
  /* Bolinha do tipo: azul = físico, roxo = mágico. É o que dá a cor à pílula. */
  .atk-dot{flex:0 0 auto; width:9px; height:9px; border-radius:50%; background:var(--weak);}
  .atk-pill.type-physical{border-color:rgba(79,140,255,.5);}
  .atk-pill.type-physical .atk-dot{background:#4f8cff; box-shadow:0 0 8px rgba(79,140,255,.8);}
  .atk-pill.type-physical:hover:not(:disabled){box-shadow:0 4px 18px rgba(79,140,255,.35); border-color:#4f8cff;}
  .atk-pill.type-magic{border-color:rgba(163,95,224,.5);}
  .atk-pill.type-magic .atk-dot{background:#a35fe0; box-shadow:0 0 8px rgba(163,95,224,.8);}
  .atk-pill.type-magic:hover:not(:disabled){box-shadow:0 4px 18px rgba(163,95,224,.35); border-color:#a35fe0;}
  /* Em recarga: cinza e apagado, sem cor de tipo. */
  .atk-pill:disabled{
    cursor:not-allowed; opacity:.5; border-color:rgba(255,255,255,.07);
    background:linear-gradient(180deg, rgba(30,33,42,.9), rgba(18,20,27,.9));
  }
  .atk-pill:disabled .atk-dot{background:#4a4f5c; box-shadow:none;}

  .atk-pill-main{flex:1; min-width:0; overflow:hidden;}
  /* display:block é obrigatório: em <span> inline o text-overflow não aplica e
     o nome do ataque vaza pra fora da pílula em vez de virar reticências. */
  .atk-pill-name{display:block; font-weight:700; font-size:11.5px; line-height:1.2;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .atk-pill-sub{display:block; font-size:9.5px; color:var(--text-dim); margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .atk-cd{
    flex:0 0 auto; font-variant-numeric:tabular-nums; font-weight:800; font-size:10.5px;
    background:rgba(255,255,255,.08); padding:2px 7px; border-radius:999px; color:var(--text-dim);
  }
  .atk-pill.type-physical:not(:disabled) .atk-cd{color:#8fb8ff; background:rgba(79,140,255,.16);}
  .atk-pill.type-magic:not(:disabled) .atk-cd{color:#cfa0f5; background:rgba(163,95,224,.16);}

  /* Tooltip abre pra CIMA -- o dock agora é uma barra horizontal embaixo do
     palco, então não há mais espaço à esquerda/direita da pílula. */
  .atk-tip{
    display:none; position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%);
    width:180px; z-index:9;
    background:#0c0e14; border:1px solid var(--line); border-radius:10px; padding:8px 10px;
    font-size:10.5px; color:var(--text-dim); box-shadow:0 8px 22px rgba(0,0,0,.65);
  }
  .atk-tip b{color:var(--text); font-weight:700;}
  .atk-pill:hover:not(:disabled) .atk-tip{display:block;}
  @media(max-width:600px){ .atk-tip{width:150px;} }

  /* Aviso de "aguardando o outro jogador" ocupa o lugar das pílulas. */
  .atk-waiting{
    margin:auto; text-align:center; font-size:11px; color:var(--text-dim);
    background:rgba(14,17,24,.85); border:1px dashed var(--line); border-radius:12px; padding:10px 16px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }

  .order-list{display:flex; flex-direction:column; gap:8px;}
  .order-item{
    display:flex; align-items:center; gap:10px; background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line); border-radius:10px; padding:8px 10px; cursor:grab;
  }
  .order-item:active{cursor:grabbing;}
  .order-pos{
    width:26px; height:26px; flex:0 0 auto; border-radius:50%; background:var(--gold); color:#1a1509;
    font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;
  }
  .order-item .sprite-img{width:28px;}
  .order-info{flex:1; min-width:0;}
  .order-name{font-weight:700; font-size:13.5px;}
  .order-sub{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .order-arrows{display:flex; flex-direction:column; gap:3px;}
  .order-arrows .btn{padding:2px 10px; font-size:12px; line-height:1;}

  .index-list{display:flex; flex-direction:column; gap:8px; max-height:560px; overflow-y:auto; margin-top:4px;}
  .index-row{
    display:flex; align-items:center; gap:10px; background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line); border-radius:10px; padding:8px 10px; cursor:pointer; transition:border-color .15s;
  }
  .index-row:hover{border-color:var(--gold-dim);}
  .index-row .sprite-img{width:30px;}
  .index-info{flex:1; min-width:0;}
  .index-name{font-weight:700; font-size:13.5px;}
  .index-sub{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .badge.spr{background:rgba(178,92,255,.16); color:#d9b3ff; border:1px solid #7d3fc0;}

  /* --- visor frente/costas do índice --- */
  .sprite-viewer{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    background:radial-gradient(ellipse 220px 90px at 50% 82%, rgba(224,181,89,.13), transparent 70%),

    border:1px solid var(--line); border-radius:12px; padding:18px 12px 14px; margin-top:12px;
  }

  .view-toggle button{

    text-transform:uppercase; letter-spacing:1px; padding:6px 16px; border-radius:20px; cursor:pointer;
  }
  .view-toggle button.active{background:var(--gold); color:#1a1509;}

  .badge.element-Fogo{background:rgba(224,90,45,.18); color:#ff9d6b;}
  .badge.element-Gelo{background:rgba(111,179,217,.18); color:#a6d9f2;}

<style id="final-refactor-css">
/* FINAL UI REFACTOR */
html,body{width:100%;height:100%;margin:0;overflow:hidden}
#gameFrame .wrap{max-width:none;width:100%;height:100%;padding:18px 24px 18px;overflow:auto}
#gameFrame:not(.battle-mode) .wrap{max-width:none}

/* Menus use the whole screen; internal scrolling only for genuinely long lists. */
.menu-grid{max-width:none;width:100%;}
.friends-fullscreen{width:100%;min-height:calc(100vh - 120px);}
.friend-list{max-height:55vh;overflow-y:auto}

/* Battle: no page scroll, use every pixel. */
#gameFrame.battle-mode .wrap{padding:0;overflow:hidden}
.battle-layout{grid-template-columns:minmax(0,1fr) clamp(150px,13vw,220px);grid-template-rows:auto minmax(0,1fr);gap:8px;padding:10px;height:100%;}
.battle-header{min-height:0}
.battle-main{grid-template-rows:minmax(0,1fr) minmax(92px,clamp(92px,17vh,170px));gap:8px}
.battle-stage{min-height:0}
.formation-area{padding:10px 3vw 6px;gap:clamp(24px,6vw,110px);}
.fside{gap:clamp(8px,1.4vw,26px)}
.fside-player{grid-template-columns:minmax(50px,.72fr) minmax(100px,1fr)}
.fside-enemy{grid-template-columns:minmax(100px,1fr) minmax(50px,.72fr)}
.fcol{gap:clamp(8px,1.7vh,18px)}
.fchip{width:82px}
.fchip-hp{width:72px;height:7px}
.fchip-power{width:72px;height:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:transparent;border:0;overflow:visible}
.fchip-power-fill{display:none}
.fchip-power .charge-cell{display:block;height:10px;border:1px solid rgba(111,179,255,.55);background:rgba(20,40,75,.75);border-radius:2px;box-shadow:inset 0 0 3px rgba(0,0,0,.6)}
.fchip-power .charge-cell.on{background:linear-gradient(180deg,#79baff,#2f6fd6);border-color:#9dceff;box-shadow:0 0 5px rgba(79,150,255,.55)}
.fchip-power.full .charge-cell.on{background:linear-gradient(180deg,#ffb23c,#ff3b1f);border-color:#ffca73;animation:powerCellPulse .8s ease-in-out infinite alternate}
@keyframes powerCellPulse{to{filter:brightness(1.35)}}
.sprite-chip{height:72px}.stick.sprite-chip{height:60px}

/* Attack cards */
.atk-dock{display:grid!important;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:8px;overflow:visible!important;align-content:stretch}
.atk-pill{position:relative!important;width:100%!important;min-height:58px;border-radius:10px!important;padding:10px 12px!important;display:grid!important;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:9px;border:1px solid var(--line)!important;background:linear-gradient(180deg,#202532,#171a24)!important;text-align:left!important}
.atk-pill:hover:not(:disabled){transform:translateY(-1px);border-color:var(--gold)!important}
.atk-pill-main{display:flex;flex-direction:column;gap:3px}
.atk-pill-name{font-size:14px;font-weight:800}
.atk-pill-sub{font-size:11px;color:var(--text-dim)}
.atk-cd{display:flex;gap:3px;align-items:center;justify-content:flex-end;max-width:88px;flex-wrap:wrap}
.attack-cost-cell{width:9px;height:9px;border-radius:2px;border:1px solid rgba(111,179,255,.55);background:#14284b}
.attack-cost-cell.on{background:#4f96ff;border-color:#9dceff}
.atk-dot{width:8px;height:8px;border-radius:2px;background:var(--gold)}
.atk-tip{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%) translateY(4px);width:min(360px,42vw);padding:12px 14px;border:1px solid rgba(224,181,89,.6);border-radius:10px;background:rgba(12,15,22,.97);box-shadow:0 12px 30px rgba(0,0,0,.45);color:var(--text);font-size:12px;line-height:1.45;text-align:left;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s,transform .16s;z-index:50}
.atk-pill:hover .atk-tip{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.atk-waiting{grid-column:1/-1;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;border:1px dashed var(--line);border-radius:10px;background:rgba(255,255,255,.025);text-align:center;padding:12px}

/* Initiative queue = 4 next characters only */
.initiative-col{padding:10px 8px;overflow:hidden}
.initiative-title{font-size:11px;margin-bottom:3px}
.init-slot{animation:queueIn .34s ease both;min-height:74px}
.init-slot.is-next{border-color:var(--gold);background:rgba(224,181,89,.14);box-shadow:0 0 14px rgba(224,181,89,.12)}
.init-slot .sprite-chip{height:48px}.init-slot .stick.sprite-chip{height:40px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.17.1/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.17.1/firebase-firestore-compat.min.js"></script>
