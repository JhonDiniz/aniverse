<!-- Dados dos personagens: gerado por build_characters.py a partir de
     characters.py. Precisa carregar ANTES do script principal, porque ele
     declara RAW/CHAR_KIT/APPEARANCE/CLASS_TYPE/FOURTH_ATTACK/CHAR_FORMS/
     RANK_OVERRIDE/ART/ANIMES que o script principal só lê. -->
<script src="characters.generated.js"></script>
<script>
/* ====== COLE AQUI AS CREDENCIAIS DO SEU PROJETO FIREBASE (passo 3 do tutorial) ====== */
const firebaseConfig = {
  apiKey: "AIzaSyBkJzke1GEbdfQ93vQGqIJPkwd7szgjfqc",
  authDomain: "leilaobattle.firebaseapp.com",
  projectId: "leilaobattle",
  storageBucket: "leilaobattle.firebasestorage.app",
  messagingSenderId: "731759011050",
  appId: "1:731759011050:web:a48502d1f44facd7eea393"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
/* ===================================================================================== */

/* ============ CHARACTER DATABASE ============
   Todo o elenco (ANIMES, RAW, CHAR_KIT, APPEARANCE, CLASS_TYPE,
   FOURTH_ATTACK, CHAR_FORMS) agora vem de characters.generated.js,
   carregado antes deste <script> -- veja characters.py e build_characters.py
   na raiz do projeto. Não declare essas consts aqui, elas já existem
   quando este script começa a rodar.
   ============================================ */

/* =========================================================================
   MOTOR DE SPRITES — pixel art procedural
   =========================================================================
   ESPECIFICAÇÃO VISUAL (vale para os 135 personagens quando forem migrados):

     Resolução base ........ 48 x 64 px lógicos
     Proporção ............. cabeça ~17px de 64 => ~1:3.7 (sprite de luta 2D)
     Pose .................. guarda de combate: pernas afastadas e flexionadas,
                             punhos erguidos. Nunca posição de sentido.
     Contorno .............. 1px, #140f14, aplicado automaticamente
     Luz ................... vinda de cima-esquerda
     Sombreamento .......... rampa de 4 tons por região, gerada automaticamente:
                             realce na borda superior-esquerda, base no miolo,
                             sombra e sombra forte descendo até a borda
                             inferior-direita. Sem gradiente, sem anti-aliasing.
     Escala na arena ....... nearest-neighbor (image-rendering: pixelated)
     Paleta ................ 6 a 9 cores nomeadas por personagem. As variantes
                             de sombra/realce NÃO são escolhidas à mão: derivam
                             da cor base, então trocar a paleta troca o
                             personagem inteiro sem redesenhar um pixel.
     FRENTE ................ rosto visível, usada pelo ADVERSÁRIO em batalha,
                             pelo índice e pelas telas de time.
     COSTAS ................ sem rosto, cabelo visto por trás, emblema/nó das
                             costas visíveis. Usada pelo lutador DO JOGADOR.
                             Nunca é o sprite de frente espelhado.

   Por que procedural e não uma imagem por personagem: 135 personagens x 2
   vistas x 2 poses seriam 540 arquivos. Aqui cada personagem é ~15 linhas de
   dados, o arquivo continua único, e nada é baixado da rede.
   ========================================================================= */

const SPR_W = 48, SPR_H = 64;
const SPR_OUTLINE = "#140f14";

function shadeColor(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&0xff)+amt, b=(n&0xff)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

class PixGrid{
  constructor(w,h){ this.w=w; this.h=h; this.d=new Array(w*h).fill(null); this.tone=new Array(w*h).fill(0); }
  i(x,y){ return y*this.w+x; }
  inb(x,y){ return x>=0 && y>=0 && x<this.w && y<this.h; }
  get(x,y){ return this.inb(x,y) ? this.d[this.i(x,y)] : null; }
  set(x,y,slot){ if(this.inb(x,y)) this.d[this.i(x,y)] = slot; }
  // pinta só onde já existe alguma coisa — serve pra dobra de roupa e sombra
  paintOver(x,y,slot){ if(this.inb(x,y) && this.d[this.i(x,y)]) this.d[this.i(x,y)] = slot; }
  rect(x,y,w,h,slot){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++) this.set(i,j,slot); }
  rectOver(x,y,w,h,slot){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++) this.paintOver(i,j,slot); }
  ellipse(cx,cy,rx,ry,slot){
    for(let j=Math.floor(cy-ry); j<=Math.ceil(cy+ry); j++)
      for(let i=Math.floor(cx-rx); i<=Math.ceil(cx+rx); i++){
        const dx=(i-cx)/rx, dy=(j-cy)/ry;
        if(dx*dx+dy*dy <= 1.02) this.set(i,j,slot);
      }
  }
  limb(x0,y0,x1,y1,w0,w1,slot){
    const steps = Math.max(Math.abs(x1-x0), Math.abs(y1-y0), 1)*2;
    for(let s=0; s<=steps; s++){
      const t=s/steps;
      const cx=x0+(x1-x0)*t, cy=y0+(y1-y0)*t, w=w0+(w1-w0)*t, half=w/2;
      for(let i=Math.round(cx-half); i<=Math.round(cx+half); i++)
        for(let j=Math.round(cy-half*0.55); j<=Math.round(cy+half*0.55); j++)
          this.set(i,j,slot);
    }
  }
  spike(bx,by,tx,ty,halfW,slot){
    const steps = Math.max(Math.abs(tx-bx), Math.abs(ty-by), 1)*2;
    for(let s=0; s<=steps; s++){
      const t=s/steps;
      const cx=bx+(tx-bx)*t, cy=by+(ty-by)*t, hw=halfW*(1-t*t)+0.4;
      for(let i=Math.round(cx-hw); i<=Math.round(cx+hw); i++)
        for(let j=Math.round(cy-hw*0.5); j<=Math.round(cy+hw*0.5); j++)
          this.set(i,j,slot);
    }
  }
}

/* Rampa de 4 tons gerada automaticamente:
     tone 3 = realce  (borda superior-esquerda, onde a luz bate)
     tone 0 = base
     tone 1 = sombra  (uma casa pra dentro da borda escura)
     tone 2 = sombra forte (borda inferior-direita)
   Isso é o que separa "boneco chapado" de "sprite com volume": um único tom
   escuro no contorno deixa tudo plano; a rampa dá curvatura ao braço e ao peito. */
// Regiões pequenas e chapadas por natureza NÃO entram na rampa: um olho de
// 5x3 px recebendo realce + sombra vira uma bolha cinza em vez de um olho.
// O mesmo vale para dobras e traços, que já SÃO a sombra.
const FLAT_SLOTS = new Set(["eye","eyeWhite","mouth","emblemInk","skinShade","topShade","bootsole"]);

function autoShade(g){
  const out = g.tone;
  const rim = new Array(g.w*g.h).fill(0); // 1 = borda escura, 2 = borda clara
  for(let y=0;y<g.h;y++) for(let x=0;x<g.w;x++){
    const s = g.get(x,y); if(!s || FLAT_SLOTS.has(s)) continue;
    const dark  = g.get(x+1,y)!==s || g.get(x,y+1)!==s;
    const light = g.get(x-1,y)!==s || g.get(x,y-1)!==s;
    if(dark){ rim[g.i(x,y)]=1; out[g.i(x,y)]=2; }
    else if(light){ rim[g.i(x,y)]=2; out[g.i(x,y)]=3; }
  }
  for(let y=0;y<g.h;y++) for(let x=0;x<g.w;x++){
    const s = g.get(x,y); if(!s || FLAT_SLOTS.has(s) || rim[g.i(x,y)]) continue;
    if(rim[g.i(x+1,y)]===1 || rim[g.i(x,y+1)]===1) out[g.i(x,y)]=1;
  }
}

function autoOutline(g){
  const add = [];
  for(let y=0;y<g.h;y++) for(let x=0;x<g.w;x++){
    if(g.get(x,y)) continue;
    if(g.get(x-1,y)||g.get(x+1,y)||g.get(x,y-1)||g.get(x,y+1)) add.push([x,y]);
  }
  add.forEach(([x,y])=> g.set(x,y,"__outline"));
}

/* ---------- corpo em pose de luta ---------- */
// Postura parada de combate, não posição de sentido: pernas afastadas e
// flexionadas, punhos erguidos na altura do peito. Um sprite de braços colados
// no corpo lê como "personagem esperando", não como "personagem lutando".
const BODY = {
  cx:24,
  headCy:19, headRx:6, headRy:7,
  browY:17, eyeY:19, mouthY:24,
  neckTop:25, neckBot:29,
  shoulderY:29, shoulderHW:9,
  waistY:42, waistHW:6,
  sashTop:41, sashBot:45,
  hipY:45, ankleY:57,
  bootTop:55, bootBot:62
};

function drawBody(g, r, view, pose){
  const B = BODY, cx = B.cx;
  const atk = pose==="attack";

  // --- pernas afastadas, com joelho ---
  const kneeY = 51, footOut = 8;
  g.limb(cx-3, B.hipY, cx-6, kneeY, 8, 7, "bottom");
  g.limb(cx-6, kneeY, cx-footOut, B.ankleY, 7, 6, "bottom");
  g.limb(cx+3, B.hipY, cx+6, kneeY, 8, 7, "bottom");
  g.limb(cx+6, kneeY, cx+footOut, B.ankleY, 7, 6, "bottom");

  // --- botas ---
  const bootH = B.bootBot-B.bootTop+1;
  g.rect(cx-footOut-4, B.bootTop, 8, bootH, "boots");
  g.rect(cx+footOut-3, B.bootTop, 8, bootH, "boots");
  g.rect(cx-footOut-4, B.bootTop, 8, 2, "bootcuff");   // cano claro
  g.rect(cx+footOut-3, B.bootTop, 8, 2, "bootcuff");
  g.rect(cx-footOut-4, B.bootBot, 8, 1, "bootsole");
  g.rect(cx+footOut-3, B.bootBot, 8, 1, "bootsole");

  // --- torso: trapézio ombro -> cintura ---
  for(let y=B.shoulderY; y<=B.waistY; y++){
    const t=(y-B.shoulderY)/(B.waistY-B.shoulderY);
    const hw = Math.round(B.shoulderHW + (B.waistHW-B.shoulderHW)*t);
    g.rect(cx-hw, y, hw*2+1, 1, "top");
  }
  // faixa na cintura + nó lateral
  g.rect(cx-B.waistHW-1, B.sashTop, (B.waistHW+1)*2+1, B.sashBot-B.sashTop+1, "sash");
  if(view==="front"){
    g.rect(cx-B.waistHW-2, B.sashTop+1, 3, 3, "sash");
    g.rect(cx-B.waistHW-2, B.sashBot+1, 2, 3, "sash");
  } else {
    g.rect(cx+B.waistHW-1, B.sashTop+1, 3, 3, "sash");
    g.rect(cx+B.waistHW, B.sashBot+1, 2, 3, "sash");
  }

  // --- braços: ombro -> cotovelo -> punho ---
  const fist = (fx,fy)=>{
    g.rect(fx, fy, 5, 5, "skin");
    g.rect(fx, fy+5, 5, 3, "band");        // munhequeira
    g.rect(fx+1, fy+2, 3, 1, "skinShade"); // linha dos nós dos dedos
  };
  let L, R;
  if(atk && view==="front"){        // soco descendo rumo ao jogador
    L = [[cx-7,31],[cx-14,38],[cx-17,45]];
    R = [[cx+7,31],[cx+12,34],[cx+13,37]];
  } else if(atk){                   // de costas: soco subindo rumo ao inimigo
    L = [[cx-7,31],[cx-12,34],[cx-13,37]];
    R = [[cx+7,31],[cx+14,25],[cx+17,18]];
  } else {                          // guarda
    L = [[cx-7,31],[cx-13,36],[cx-14,40]];
    R = [[cx+7,31],[cx+13,36],[cx+14,40]];
  }
  [[L,-1],[R,1]].forEach(([P,dir])=>{
    g.limb(P[0][0],P[0][1], P[1][0],P[1][1], 8, 6, "sleeve");
    g.limb(P[1][0],P[1][1], P[2][0],P[2][1], 6, 5, "skin");
    fist(P[2][0] + (dir<0 ? -4 : -1), P[2][1]-2);
  });

  // --- pescoço e cabeça ---
  g.rect(cx-3, B.neckTop, 7, B.neckBot-B.neckTop, "skin");
  g.rect(cx-3, B.neckTop, 7, 2, "skinShade"); // sombra do queixo no pescoço
  g.ellipse(cx, B.headCy, B.headRx, B.headRy, view==="back" ? "hair" : "skin");
}

function drawFace(g){
  const B = BODY, cx = B.cx;
  // Olhos com esclera clara e pupila escura: dois quadrados pretos leem como
  // "olho fechado". A esclera é o que dá o olhar de anime nesta escala.
  g.rect(cx-6, B.browY, 5, 1, "hair");
  g.rect(cx+2, B.browY, 5, 1, "hair");
  g.rect(cx-6, B.eyeY, 5, 3, "eyeWhite");
  g.rect(cx+2, B.eyeY, 5, 3, "eyeWhite");
  g.rect(cx-4, B.eyeY, 3, 3, "eye");
  g.rect(cx+2, B.eyeY, 3, 3, "eye");
  g.rect(cx-1, B.eyeY+3, 2, 1, "skinShade"); // nariz
  g.rect(cx-2, B.mouthY+1, 4, 1, "mouth");   // 2px abaixo do nariz, senão vira bigode
}

/* ---------- cabelo ----------
   O cabelo é a assinatura de um personagem de anime e não sai de fórmula: cada
   espinho aqui é um dado (base, ponta, espessura). Trocar o personagem é trocar
   essa lista, não reescrever o gerador. */
const HAIR = {
  goku(g, view){
    const B = BODY, cx = B.cx;
    // Touca COLADA no crânio. Uma touca folgada + espinhos gordos vira afro:
    // o que faz cabelo de anime ler como espetado é o espaço vazio ENTRE as
    // mechas, não a quantidade de mechas.
    const capBottom = view==="back" ? B.headCy+B.headRy : B.browY-1;
    for(let y=B.headCy-B.headRy-1; y<=capBottom; y++){
      const dy=(y-B.headCy)/(B.headRy+1);
      const hw = Math.round((B.headRx+1)*Math.sqrt(Math.max(0,1-dy*dy)));
      if(hw>0) g.rect(cx-hw, y, hw*2+1, 1, "hair");
    }
    // 9 mechas, cada uma um dado [baseX, baseY, pontaX, pontaY, espessura].
    // Trocar de personagem = trocar esta lista.
    const S = [
      [cx-1,  13, cx-3,  0,  2.6],  // mecha central alta
      [cx-5,  13, cx-9,  1,  2.3],
      [cx+4,  13, cx+7,  0,  2.3],
      [cx-7,  14, cx-14, 4,  2.1],
      [cx+7,  14, cx+13, 3,  2.1],
      [cx-8,  16, cx-18, 9,  1.9],
      [cx+8,  16, cx+17, 8,  1.9],
      [cx+1,  13, cx+2,  3,  1.9],
      [cx-3,  13, cx-4,  4,  1.7],
      [cx+6,  15, cx+10, 8,  1.7]
    ];
    S.forEach(k=> g.spike(k[0],k[1],k[2],k[3],k[4],"hair"));
    // costeletas curtas, até a altura do olho
    g.rect(cx-8, B.browY-1, 2, 5, "hair");
    g.rect(cx+7, B.browY-1, 2, 5, "hair");
    if(view==="back"){
      // Nuca curta: descendo demais, o cabelo engolia o emblema das costas —
      // que é justamente o que torna a vista traseira reconhecível.
      g.rect(cx-6, B.headCy+5, 13, 3, "hair");
      g.spike(cx-3, B.headCy+7, cx-5, B.headCy+11, 2.2, "hair");
      g.spike(cx+3, B.headCy+7, cx+5, B.headCy+11, 2.2, "hair");
      g.spike(cx,   B.headCy+7, cx,   B.headCy+10, 2.2, "hair");
    }
  }
};

/* ---------- traje ---------- */
const OUTFIT = {
  gi(g, view){
    const B = BODY, cx = B.cx;
    if(view==="front"){
      // gola em V da camisa de baixo + as duas lapelas cruzadas do gi
      g.rect(cx-4, B.shoulderY,   9, 2, "under");
      g.rect(cx-3, B.shoulderY+2, 7, 2, "under");
      g.rect(cx-1, B.shoulderY+4, 3, 2, "under");
      g.rectOver(cx-7, B.shoulderY+1, 2, 8, "topShade");
      g.rectOver(cx+6, B.shoulderY+1, 2, 8, "topShade");
      // dobras verticais do gi
      g.rectOver(cx-3, B.shoulderY+7, 1, 5, "topShade");
      g.rectOver(cx+3, B.shoulderY+7, 1, 5, "topShade");
    } else {
      const ey = B.shoulderY+7;
      g.ellipse(cx, ey, 4.4, 4.4, "emblem");
      g.rect(cx-2, ey-2, 5, 1, "emblemInk");
      g.rect(cx,   ey-1, 1, 1, "emblemInk");
      g.rect(cx-2, ey,   5, 1, "emblemInk");
      g.rect(cx,   ey+1, 1, 1, "emblemInk");
      g.rect(cx-2, ey+2, 5, 1, "emblemInk");
      g.rectOver(cx-7, B.shoulderY+1, 2, 9, "topShade");
      g.rectOver(cx+6, B.shoulderY+1, 2, 9, "topShade");
    }
  }
};
/* =========================================================================
   ARTE EXTERNA
   =========================================================================
   As artes agora moram em arquivos, não embutidas. O jogo deixou de ser um
   arquivo único — foi uma troca deliberada: com transformação para vários
   personagens, embutir tudo faria o HTML passar de vários MB e travar o
   primeiro carregamento no celular. Em arquivos, o navegador baixa só o que
   entra em campo e cacheia o resto.

   Estrutura esperada, ao lado do HTML:

     arena-de-leilao.html
     assets/sprites/<slug>/front.png
                          back.png
                          charge-front.png    (opcional)
                          charge-back.png     (opcional)
                          ssj-front.png       (opcional)
                          ssj-back.png        (opcional)

   Acrescentar personagem com arte = soltar a pasta em assets/sprites/ e
   preencher o campo `sprite={"slug":..., "states":[...]}` no Character,
   dentro de characters.py. O build_characters.py gera a entrada em ART
   sozinho -- não edite ART diretamente, ele é gerado.

   TODAS as artes precisam sair do prepare_sprite.py, que normaliza o canvas
   para 210x245 com a sola dos pés e o centro do corpo ancorados no mesmo ponto.
   É isso que faz a troca de imagem não deslocar nada durante a transformação.
   Arte solta, no recorte que veio, faz o personagem pular de tamanho.
   ========================================================================= */
const ASSET_BASE = "assets/sprites/";
// Contrato com o prepare_sprite.py: CANVAS_W ficou largo de propósito (380,
// não 210) porque a pose de dash é bem mais larga que alta -- um canvas
// retrato forçaria ela a encolher pra caber. Mudar isto exige reprocessar
// TODA arte por pose que existir (rodar prepare_sprite.py de novo pra cada
// personagem que usa base/dash/block).
const SPRITE_CANVAS = {w:380, h:245};

const STATE_FILE = {
  front:"front.png", back:"back.png",
  chargeFront:"charge-front.png", chargeBack:"charge-back.png",
  ssjFront:"ssj-front.png", ssjBack:"ssj-back.png"
  // Poses espelháveis (base/dash/block/transform1-3) NÃO têm arquivo próprio
  // -- todas vivem juntas em UM sheet.png por personagem (ver poseSheetURL
  // e posePosition logo abaixo). Isso existe pra não precisar de 3+ PNGs
  // por personagem, só 1.
};
// Quem usa esse conjunto de poses (em vez do front/back antigo do Son Goku).
function usesPoseArt(c){ const a = ART[c.name]; return !!(a && a.states.indexOf("base") >= 0); }

// ART também vem de characters.generated.js (gerado a partir do campo
// sprite de cada Character em characters.py). Não declare ART aqui.

/* ---------- arte por pose: UM sheet.png, várias poses lado a lado ----------
   Em vez de base.png + dash.png + block.png (3 arquivos), todas as poses de
   um personagem espelhável moram num único assets/sprites/<slug>/sheet.png,
   uma do lado da outra, na MESMA ordem de `states`. O jogo mostra só o
   "quadro" certo usando background-position em porcentagem -- o truque
   clássico de sprite sheet responsivo:
     background-size: (nº de poses)*100% 100%   -- a imagem toda cabe N vezes
     background-position-x: índice/(N-1) * 100% -- desliza até o quadro certo
   Isso funciona em qualquer altura de tela (celular/desktop) sem precisar
   calcular pixel nenhum na mão. */
function poseSheetURL(c){
  const a = ART[c.name];
  if(!a) return null;
  return ASSET_BASE + a.slug + "/sheet.png";
}
function posePosition(c, pose){
  const a = ART[c.name];
  if(!a) return 0;
  const n = a.states.length;
  const idx = a.states.indexOf(pose);
  if(idx < 0 || n <= 1) return 0;
  return (idx/(n-1))*100;
}

function artURL(c, state){
  const a = ART[c.name];
  if(!a || a.states.indexOf(state) < 0) return null;
  const file = STATE_FILE[state];
  if(!file) return null; // pose espelhável -- não tem arquivo próprio, ver poseSheetURL()
  return ASSET_BASE + a.slug + "/" + file;
}
function bitmapFor(c, view, transformed){
  // Personagens de pose única (base/dash/block) NUNCA passam por aqui --
  // fighterArt() trata esse caso antes mesmo de chamar bitmapFor. Isto aqui
  // só resolve o sistema antigo (frente/costas + Super Saiyajin).
  const side = (view==="back" ? "Back" : "Front");
  if(transformed){
    const t = artURL(c, "ssj"+side);
    if(t) return t;
  }
  return artURL(c, side.toLowerCase());
}
function chargeBitmapFor(c, view){
  return artURL(c, "charge" + (view==="back" ? "Back" : "Front"));
}
function hasArt(c){ return !!ART[c.name]; }

/* Pré-carga: sem isso, o quadro de carga de ki só começa a baixar no instante
   em que o Ultimate é acionado, e a primeira fase da animação aparece em branco.
   Só pré-carrega quem está em campo — 135 personagens de uma vez seria pior que
   o arquivo embutido que estamos justamente removendo. */
const preloaded = {};
function preloadArt(c){
  const a = ART[c.name];
  if(!a || preloaded[c.name]) return;
  preloaded[c.name] = true;
  if(usesPoseArt(c)){
    // Um sheet.png só, não um arquivo por estado.
    const im = new Image();
    im.onerror = () => console.warn(`Sprite sheet de ${c.name} não carregou (${poseSheetURL(c)}) -- ele vai aparecer com o fundo cinza do CSS até o arquivo existir.`);
    im.src = poseSheetURL(c);
    return;
  }
  a.states.forEach(st=>{ const im = new Image(); im.src = artURL(c, st); });
}

/* Se um arquivo faltar ou falhar, o personagem cai no stick figure em vez de
   virar um ícone de imagem quebrada. Vale para quem ainda não tem arte pronta. */
function artFailed(img, charId){
  const c = charById(charId);
  if(!c || !img.parentNode) return;
  const wrap = document.createElement("span");
  wrap.innerHTML = stickFigureSVG(c, true, false);
  img.parentNode.replaceChild(wrap.firstChild, img);
}

/* ---------- registro de sprites ----------
   Só quem estiver aqui usa pixel art. Todo o resto cai automaticamente no
   stick figure antigo, então o jogo nunca fica meio quebrado durante a migração. */
const SPRITES = {
  "Son Goku": {
    hair: "goku",
    outfit: "gi",
    palette: {
      skin:"#f2c49a", skinShade:"#d1966b", hair:"#1e181c",
      eye:"#2b2328", eyeWhite:"#f6f2ec", mouth:"#8a4a42",
      top:"#ea7d1e", topShade:"#bf5f10", sleeve:"#cf6a12", bottom:"#e37a22",
      sash:"#2f4f9e", under:"#2f4f9e",
      boots:"#2f4f9e", bootcuff:"#e8e3d8", bootsole:"#1b2f61",
      band:"#efeae0", emblem:"#efeae0", emblemInk:"#2a2320"
    },
    // Super Saiyajin: só o cabelo muda de slot na paleta. Nenhuma matriz é redesenhada.
    transformPalette: { hair:"#f6d84e" },
    auraColor: "#ffe27a"
  }
};

const spriteCache = {};

// Gera (e cacheia) o dataURL de um sprite. view: "front" | "back".
// pose: "idle" | "attack". transformed: aplica a paleta alternativa.
function spriteURL(c, view, pose, transformed){
  const def = SPRITES[c.name];
  if(!def) return null;
  const key = c.name+"|"+view+"|"+pose+"|"+(transformed?"t":"n");
  if(spriteCache[key]) return spriteCache[key];

  const g = new PixGrid(SPR_W, SPR_H);
  drawBody(g, def, view, pose);
  if(HAIR[def.hair]) HAIR[def.hair](g, view);
  if(view==="front") drawFace(g, def);
  if(OUTFIT[def.outfit]) OUTFIT[def.outfit](g, view);
  autoShade(g);
  autoOutline(g);

  const pal = Object.assign({}, def.palette, transformed ? (def.transformPalette||{}) : {});
  const cv = document.createElement("canvas");
  cv.width = SPR_W; cv.height = SPR_H;
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(SPR_W, SPR_H);
  for(let i=0;i<g.d.length;i++){
    const slot = g.d[i];
    if(!slot) continue;
    let hex;
    if(slot==="__outline") hex = SPR_OUTLINE;
    else {
      const base = pal[slot] || "#ff00ff"; // magenta = slot faltando na paleta
      const tone = g.tone[i];
      hex = tone===1 ? shadeColor(base,-22)
          : tone===2 ? shadeColor(base,-46)
          : tone===3 ? shadeColor(base, 24)
          : base;
    }
    const n = parseInt(hex.slice(1),16);
    img.data[i*4]   = (n>>16)&0xff;
    img.data[i*4+1] = (n>>8)&0xff;
    img.data[i*4+2] = n&0xff;
    img.data[i*4+3] = 255;
  }
  ctx.putImageData(img,0,0);
  const url = cv.toDataURL("image/png");
  spriteCache[key] = url;
  return url;
}

function hasSprite(c){ return hasArt(c) || !!SPRITES[c.name]; }

// Ponto único de renderização de um lutador. Usa pixel art quando existe e
// stick figure quando não — quem chama não precisa saber qual dos dois veio.
function fighterArt(c, opts){
  const o = opts || {};
  const view = o.view || "front";
  const pose = o.pose || "idle";           // usado só pelo gerador procedural (idle/attack)
  const artPose = o.artPose || "base";      // usado só pela arte em bitmap por pose (base/dash/block)
  const cls  = o.className || "";
  // Personagem "espelhável" (Naruto e futuros): a MESMA arte serve pros dois
  // lados do campo. A convenção da arena é fixa -- time do jogador olha pra
  // DIREITA, inimigo olha pra ESQUERDA -- mas cada asset pode ter sido
  // desenhado olhando pra qualquer lado (sprite.facing em characters.py).
  // Por isso o espelhamento é calculado, não fixo num lado: só espelha o
  // lado onde a direção da arte NÃO bate com a convenção desse lado.
  const facing = (usesPoseArt(c) && ART[c.name].facing) || "right";
  const precisaEspelhar = o.side==="player" ? facing==="left" : facing==="right";
  const mirrorCls = (usesPoseArt(c) && precisaEspelhar) ? " mirror-x" : "";

  // Arte por pose = UM sheet.png com todas as poses lado a lado (ver comentário
  // em poseSheetURL). É uma <div> com background-position, não uma <img> --
  // por isso esse caso vem ANTES de bitmapFor() e é resolvido por completo aqui.
  if(usesPoseArt(c)){
    const a = ART[c.name];
    const sheet = poseSheetURL(c);
    const pct = posePosition(c, artPose);
    const ratio = `${SPRITE_CANVAS.w} / ${SPRITE_CANVAS.h}`;
    return `<div class="sprite-direction${mirrorCls}">
      <div class="sprite-img sprite-bitmap sprite-posesheet ${cls}"
        data-fighter-name="${c.name}"
        style="background-image:url('${sheet}'); background-size:${a.states.length*100}% 100%;
               background-position:${pct}% 0; aspect-ratio:${ratio};"
        title="${c.name}"></div>
    </div>`;
  }

  // Ordem de preferência (sistema antigo, frente/costas): arte final > gerador procedural > stick figure.
  const bmp = bitmapFor(c, view, o.transformed);
  if(bmp){
    return `<div class="sprite-direction${mirrorCls}">
      <img class="sprite-img sprite-bitmap ${cls}" src="${bmp}" alt="${c.name}"
        draggable="false" onerror="artFailed(this,'${c.id}')">
    </div>`;
  }
  const url = spriteURL(c, view, pose, o.transformed);
  if(url){
    return `<img class="sprite-img ${cls}" src="${url}" alt="${c.name}" draggable="false">`;
  }
  // A classe de tamanho precisa chegar no stick figure também — sem isso quem
  // não tem arte renderiza no tamanho fixo do SVG e some no palco.
  return stickFigureSVG(c, o.alive!==false, o.transformed, cls);
}

/* ============ MONTAGEM DOS PERSONAGENS ============ */
const CHARACTERS = [];
let cid=1;
Object.keys(RAW).forEach(anime=>{
  RAW[anime].forEach((row,idx)=>{
    const [name, level, type] = row;

    };

/* ---- RARIDADE ----
   Os quatro tiers antigos (S/A/B/C) agora são Mítico / Lendário / Raro / Comum.
   Os limiares de percentil e o cálculo do score continuam exatamente os mesmos:
   a mudança é só de nome e de cor. `rankKey` é a versão sem acento usada em
   classe CSS; `rank` é o rótulo que aparece na tela. */
// Cinco tiers. Os cortes de Mítico (15%) e Lendário (40%) foram MANTIDOS de
// propósito: são eles que decidem quem recebe Ultimate, e mexer neles mudaria
// o elenco de personagens transformáveis. O Épico nasceu de dividir o antigo
// Raro, que sozinho cobria metade do elenco e não distinguia nada.
/* RARIDADE — atribuída DIRETO por uma lista externa, não mais calculada por
   percentil interno de score. O motivo: o usuário forneceu um ranking próprio
   (142 personagens, já com tier definido) e pediu pra seguir ele.
   Sem cálculo aqui, sem score, sem "quase empate mudou o tier" — é o que está
   no mapa, ponto final. Se um personagem NOVO for adicionado sem entrar nesse
   mapa, cai em "D" por padrão (ver fallback abaixo) em vez de quebrar. */
const RANK_LABELS = {D:"D", C:"C", B:"B", A:"A", S:"S", Z:"Z"};
const RANK_ORDER  = ["D","C","B","A","S","Z"]; // crescente
// ---- SISTEMA DE CARGA (genérico, qualquer personagem/ataque pode usar) ----
// 0 a 5, sobe de 0.75 em 0.75 sempre que o personagem ataca OU é atingido.
// Ataques podem ter um `cost` (0-5): só usáveis com carga >= cost, e o uso
// debita esse valor da carga. cost=0 é sempre utilizável.
const CHARGE_MAX = 5;
const SUPPORT_MAX = 5;  // carga máxima do suporte (mesma escala do CHARGE_MAX) -- estava faltando, causava ReferenceError ao renderizar a batalha
const CHARGE_STEP = 0.75;
function addCharge(state, id, amount){
  const b = state.battle;
  if(!b.charge) b.charge = {};
  const atual = b.charge[id] || 0;
  b.charge[id] = Math.max(0, Math.min(CHARGE_MAX, atual + amount));
}
function getCharge(state, id){
  return (state.battle.charge && state.battle.charge[id]) || 0;
}

// RANK_OVERRIDE também vem de characters.generated.js (gerado a partir
// do campo rank de cada Character em characters.py). Não declare aqui.

(function rankCharacters(){
  CHARACTERS.forEach(c=>{
    const key = RANK_OVERRIDE[c.name] || "D";
    c.rankKey = key;
    c.rank = RANK_LABELS[key];
  });
})();

/* ============ STATE ============ */
let ROOM_CODE = null;
let MY_SLOT = null;
let pollTimer = null;
let LAST_STATE = null;
let LAST_REV = -1;

function genCode(){
  const letters="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s="";
  for(let i=0;i<5;i++) s+=letters[Math.floor(Math.random()*letters.length)];
  return s;
}

const TEAM_SIZE = 5;         // vale para os dois modos
const AUCTION_POOL_SIZE = 15;// quantos personagens entram no pool do leilão
const DRAFT_OPTIONS = 5;     // quantos personagens aparecem por rodada no sorteio
const DRAFT_REROLLS = 3;     // rerolls por jogador, no sorteio

function newRoomState(code){
  const shuffled=[...CHARACTERS].sort(()=>Math.random()-0.5);
  const pool = shuffled.slice(0,AUCTION_POOL_SIZE).map(c=>c.id);
  return {
    code,
    rev: 0,
    mode: "auction",              // "auction" (leilão) | "draft" (sorteio)
    draftOptions: {p1:[], p2:[]}, // as 5 cartas na mão de cada um, no sorteio
    difficulty: "easy",
    players:{p1:null, p2:null},
    budget: {p1:20, p2:20},
    teams: {p1:[], p2:[]},
    pool,
    poolIndex:0,
    phase:"lobby",
    currentBid:{amount:0, by:null},
    turnToAct:null,
    passedThisChar:{p1:false, p2:false},
    coinResult:null,
    log:[]
  };
}

/* ============ SALA DE TREINO ============
   O treino do Anidex roda numa sala FALSA, só na memória — nada vai pro
   Firestore. Interceptando aqui em vez de espalhar `if(treino)` pelo motor,
   todo o resto do jogo (submitAction, maybeResolveTurn, renderBattle) funciona
   sem saber que está num treino. */
const TRAINING_CODE = "__treino";
let TRAINING_STATE = null;
const clone = o => JSON.parse(JSON.stringify(o));

async function loadRoom(code){
  if(code === TRAINING_CODE) return TRAINING_STATE ? clone(TRAINING_STATE) : null;
  try{
    const doc = await db.collection("rooms").doc(code).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ console.error("Erro ao carregar sala:", e); return null; }
}
async function saveRoom(state){
  if(state.code === TRAINING_CODE){
    state.rev = (state.rev||0)+1;
    TRAINING_STATE = clone(state);
    return;
  }
  try{
    state.rev = (state.rev||0)+1;
    await db.collection("rooms").doc(state.code).set(state);
  }catch(e){ console.error("Erro ao salvar sala:", e); }
}
async function commitAndDraw(state){
  await saveRoom(state);
  LAST_STATE = state;
  LAST_REV = state.rev;
  draw(state);
}

function charById(id){
  if(id === "dummy") return DUMMY;   // boneco de treino, fora de CHARACTERS
  return CHARACTERS.find(c=>c.id===id);
}

/* ============ NOME SALVO ============
   Guardado no navegador, então sobrevive a recarregar a página. Fica no
   aparelho — não vai pro Firestore e não sai daqui.
   Tudo em try/catch porque navegação privada e alguns navegadores embutidos
   bloqueiam o armazenamento: se falhar, o jogo continua pedindo o nome a cada
   vez em vez de quebrar. */
const SESSION_KEY = "animeverse_session_v3";
const LEGACY_NAME_KEY = "arena_nome";
// O login agora é responsabilidade do Firebase Authentication. O localStorage
// guarda apenas o nome para a interface; a identidade real vem de auth.currentUser.
try{ localStorage.removeItem(LEGACY_NAME_KEY); }catch(e){}
let firebaseAuthReady = false;
let currentAuthUser = null;

function savedName(){
  try{ return localStorage.getItem(SESSION_KEY) || ""; }catch(e){ return ""; }
}
function saveName(n){
  try{ localStorage.setItem(SESSION_KEY, n); }catch(e){}
}
function forgetName(){
  try{ localStorage.removeItem(SESSION_KEY); localStorage.removeItem(LEGACY_NAME_KEY); }catch(e){}
  appStage = "start";
  FRIENDS_CACHE = null;
  ROOM_CODE = null; MY_SLOT = null; LAST_STATE = null; LAST_REV = -1;
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  render();
}

/* ============ CONTA — Firebase Authentication ============ */
let appStage = "start";
let accError=""; let authMode="login";
function goJogar(){
  appStage = (firebaseAuthReady && currentAuthUser) ? 'menu' : 'login';
  authMode='login';
  render();
}

async function logout(){
  try { await firebase.auth().signOut(); }
  catch(e){ console.error('Erro ao sair:', e); }
}
function accountKey(nome){return nome.trim().toLowerCase()}
function authEmail(nome){ return `${accountKey(nome)}@animeverse.app`; }

async function confirmAccount(){
  const nameEl=document.getElementById('accName'), passEl=document.getElementById('accPass'), pass2El=document.getElementById('accPass2');
  const raw=(nameEl?.value||'').trim(), pass=passEl?.value||'', pass2=pass2El?.value||'';
  if(!raw||!pass){accError='Preencha nome e senha.';renderLogin();return}
  const key=accountKey(raw);
  if(!/^[a-z0-9_]{3,18}$/.test(key)){accError='Use de 3 a 18 letras, números ou _.';renderLogin();return}
  if(pass.length<6){accError='A senha deve ter pelo menos 6 caracteres.';renderLogin();return}
  if(authMode==='register' && pass!==pass2){accError='As senhas não coincidem.';renderLogin();return}
  if(!firebaseAuthReady){accError='O sistema de autenticação ainda está carregando. Tente novamente.';renderLogin();return}

  try {
    const email = authEmail(raw);
    let credential;
    if(authMode==='register') {
      credential = await firebase.auth().createUserWithEmailAndPassword(email, pass);
      const uid = credential.user.uid;
      await db.collection('players').doc(uid).set({
        username: raw,
        usernameKey: key,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        friends: []
      });
      // Índice público mínimo para permitir procurar amigos por nome sem expor
      // o documento privado do jogador.
      await db.collection('usernames').doc(key).set({username: raw, uid});
      saveName(raw);
    } else {
      credential = await firebase.auth().signInWithEmailAndPassword(email, pass);
      const uid = credential.user.uid;
      const ref = db.collection('players').doc(uid);
      const doc = await ref.get();
      if(!doc.exists){
        await ref.set({username: raw, usernameKey: key, friends: [], createdAt: firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      }
      saveName(doc.exists ? (doc.data().username || raw) : raw);
    }
    currentAuthUser = credential.user;
    accError=''; appStage='menu'; render();
  } catch(e) {
    console.error('Firebase Auth error:', e);
    const code=e?.code||'';
    const messages={
      'auth/email-already-in-use':'Esse nome de usuário já está cadastrado. Entre na conta.',
      'auth/invalid-credential':'Nome ou senha incorretos.',
      'auth/user-not-found':'Conta não encontrada. Crie uma conta primeiro.',
      'auth/wrong-password':'Nome ou senha incorretos.',
      'auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
      'auth/invalid-email':'Nome de usuário inválido.',
      'auth/network-request-failed':'Falha de conexão com o Firebase. Verifique sua internet e tente novamente.',
      'auth/operation-not-allowed':'O login por email/senha ainda não está ativado no Firebase. Vá em Authentication → Sign-in method → Email/Password e ative.',
      'auth/too-many-requests':'Muitas tentativas seguidas. Espere um pouco e tente de novo.',
      'permission-denied':'O Firestore recusou o acesso à conta. Confira se as Rules foram publicadas no Console.'
    };
    accError=messages[code] || `Erro de autenticação (${code||'desconhecido'}). Veja o console para detalhes.`;
    renderLogin();
  }
}
function setAuthMode(mode){authMode=mode;accError='';renderLogin()}

// Mantém a sessão do Firebase após recarregar a página e sincroniza o nome da conta.
try {
  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.error);
  firebase.auth().onAuthStateChanged(async user=>{
    currentAuthUser = user;
    firebaseAuthReady = true;
    if(user){
      try{
        const doc=await db.collection('players').doc(user.uid).get();
        if(doc.exists && doc.data().username) saveName(doc.data().username);
      }catch(e){ console.warn('Não foi possível carregar o perfil:', e); }
    } else {
      try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
      if(ROOM_CODE){ ROOM_CODE=null; MY_SLOT=null; }
    }
    if(appStage!=='start' || !user) render();
  });
} catch(e) {
  console.error('Firebase Authentication não inicializou:',e);
  firebaseAuthReady=false;
}

async function myPlayerDoc(){
  const user = firebase.auth().currentUser;
  const nome = savedName();
  if(!user) return null;
  const ref = db.collection("players").doc(user.uid);
  const doc = await ref.get();
  return {ref, data: doc.exists ? doc.data() : {username:nome, friends:[]}};
}

async function addFriend(){
  const el = document.getElementById("friendName");
  const raw = (el && el.value || "").trim();
  if(!raw){ if(el) el.focus(); return; }
  const key = accountKey(raw);
  const meKey = accountKey(savedName());
  if(key === meKey){ accError = "Esse é você :)"; renderHome(); return; }
  if(!firebase.auth().currentUser){ accError = "Sua sessão caiu. Saia e entre de novo."; renderHome(); return; }
  try{
    // usernameKey -> UID é público; o perfil completo continua protegido.
    const friendIndex = await db.collection("usernames").doc(key).get();
    if(!friendIndex.exists){ accError = "Não achei ninguém com esse nome."; renderHome(); return; }
    const friendInfo = friendIndex.data();
    const {ref, data} = await myPlayerDoc();
    if(!ref) return;
    const friends = data.friends || [];
    if(friends.some(f=>f.uid===friendInfo.uid)){ accError = "Vocês já são amigos."; renderHome(); return; }
    friends.push({uid:friendInfo.uid, username:friendInfo.username});
    await ref.set({friends}, {merge:true});
    FRIENDS_CACHE = friends;
    accError = "";
    renderHome();
  }catch(e){
    console.error("Erro ao adicionar amigo:", e);
    accError = e?.code==='permission-denied' ? "O Firebase recusou o acesso. Confira as Rules de players/usernames." : "Não deu pra adicionar agora. Tenta de novo.";
    renderHome();
  }
}

/* ============ RENDER ============ */
const app = document.getElementById("app");

function render(){
  const frame = document.getElementById("gameFrame");
  if(frame) frame.classList.toggle("menu-mode", !ROOM_CODE && !showingIndex && appStage==="start");
  if(frame && !ROOM_CODE) frame.classList.remove("battle-mode"); // saiu da sala -- nunca fica "grudado" no layout de batalha

  if(showingIndex){ renderCharIndex(); return; }
  if(ROOM_CODE){ /* dentro de uma partida -- appStage não importa mais */ }
  else if(appStage==="start"){ renderStart(); return; }
  else if(!firebaseAuthReady || !currentAuthUser){ renderLogin(); return; }
  else if(appStage==="historia"){ renderHistoria(); return; }
  else if(appStage==="amigos"){ renderHome(); return; }
  else if(appStage==="config"){ renderConfig(); return; }
  else if(appStage==="menu"){ renderMainMenu(); return; }
  if(!ROOM_CODE){ renderMainMenu(); return; }
  return loadRoom(ROOM_CODE).then(state=>{
    if(!state){ renderHome(); return; }
    LAST_STATE = state;
    LAST_REV = state.rev||0;
    draw(state);
  });
}

// Só redesenha se a revisão da sala AVANÇOU. Um fetch de polling que começou
// antes do seu clique pode terminar depois dele, trazendo uma revisão mais
// velha do que a que você já gravou; o "<=" descarta essa resposta atrasada
// em vez de deixar ela sobrescrever a tela mais nova.
function poll(){
  if(!ROOM_CODE) return;
  // Segura o redesenho enquanto uma animação longa está no ar. Não mexe em
  // LAST_REV: assim que a trava cair, o próximo poll traz e desenha o estado.
  if(Date.now() < animLock) return;
  return loadRoom(ROOM_CODE).then(async state=>{
    if(!state) return;
    const rev = state.rev||0;
    if(rev<=LAST_REV) return;
    // Rede de segurança: se por uma corrida rara os dois enviaram a ação quase
    // juntos e nenhum dos dois viu a do outro a tempo de resolver, o turno fica
    // com as duas ações pendentes e sem ninguém pra puxar a resolução. O
    // próximo poll de QUALQUER um dos dois destrava isso sozinho.
    if(state.phase==="battle" && state.battle && maybeResolveTurn(state)){
      checkForcedSwitch(state);
      const p1Alive = aliveIds(state,"p1").length>0, p2Alive = aliveIds(state,"p2").length>0;
      if(!p1Alive || !p2Alive){ state.phase="battleover"; state.winner = p1Alive?"p1":"p2"; }
      await saveRoom(state);
    }
    LAST_STATE = state;
    LAST_REV = state.rev||rev;
    draw(state);
  });
}

function draw(state){
  const frame = document.getElementById("gameFrame");
  if(frame) frame.classList.toggle("battle-mode", state.phase==="battle");
  if(state.phase==="lobby") renderLobby(state);
  else if(state.phase==="auction") renderAuction(state);
  else if(state.phase==="draft") renderDraft(state);
  else if(state.phase==="scenario") renderScenario(state);
  else if(state.phase==="order") renderOrder(state);
  else if(state.phase==="coinflip") renderCoinflip(state);
  else if(state.phase==="battle") renderBattle(state);
  else if(state.phase==="battleover") renderBattleOver(state);
  else if(state.phase==="done") renderDone(state);
}

  const porAnime=ANIMES.map(anime=>({anime,chars:filtrados.filter(c=>c.anime===anime).sort((a,b)=>RANK_ORDER.indexOf(a.rankKey)-RANK_ORDER.indexOf(b.rankKey))})).filter(g=>g.chars.length);
  app.innerHTML=`<div class="eyebrow">Anidex</div><h1>Anidex</h1><p class="sub">${CHARACTERS.length} lutadores de ${ANIMES.length} animes.</p>
    <div class="card"><input type="text" id="indexSearch" placeholder="Buscar por nome ou anime..." value="${indexSearchTerm.replace(/"/g,'&quot;')}" oninput="updateIndexSearch(this.value)"></div>
    <div class="index-list">${porAnime.map(g=>`<div class="anime-group">
      <button class="anime-toggle" onclick="toggleAnime('${g.anime.replace(/'/g,"\\'")}')"><span>${g.anime}</span><span>${expandedAnimes[g.anime]?'▲':'▼'} · ${g.chars.length}</span></button>
      ${expandedAnimes[g.anime]?`<div class="anime-characters">${g.chars.map(c=>`<div class="index-card" onclick="selectIndexChar('${c.id}')">${fighterArt(c,{view:'front',className:'sprite-chip'})}<div class="index-card-name">${c.name}</div><span class="badge rank-${c.rankKey} index-card-rank">${c.rank}</span></div>`).join('')}</div>`:''}
    </div>`).join('')||'<p class="hint center">Nenhum personagem encontrado.</p>'}</div>
    <div class="center" style="margin-top:16px"><button class="btn" onclick="closeCharIndex()">← Voltar ao menu</button></div>`;
}

/* GRÁFICO DE RADAR (hexágono, 6 atributos).
   Cada eixo é normalizado pelo SEU próprio intervalo — vida vai de 100 a 300 e
   velocidade de 10 a 200, então usar uma escala única achataria uns e estouraria
   outros. Assim "cheio" significa sempre "no topo daquele atributo". */
/* GRÁFICO DE RADAR (pentágono, 5 atributos -- não tem mais Ataque Físico e
   Ataque Mágico separados, é só "Ataque" desde a consolidação de status).
   Cada eixo é normalizado pelo SEU próprio intervalo (os mesmos limites
   oficiais de STAT_LIMITS no build_characters.py), pra "cheio" significar
   sempre "no topo daquele atributo específico". */
const RADAR_AXES = [
  {key:"vida",   label:"VIDA",    min:50, max:300},
  {key:"atk",    label:"ATAQUE",  min:40, max:200},
  {key:"vel",    label:"VELOCIDADE", min:50, max:150},
  {key:"defMag", label:"DEF. MÁGICA", min:40, max:200},
  {key:"defFis", label:"DEF. FÍSICA", min:40, max:200}
];
function radarChart(c, compact){
  const CX=compact?78:130, CY=compact?75:125, R=compact?50:82, n=RADAR_AXES.length;
  const ponto=(i,frac)=>{const ang=(Math.PI*2*i)/n-Math.PI/2;return [CX+Math.cos(ang)*R*frac,CY+Math.sin(ang)*R*frac];};
  const teias=[0.25,0.5,0.75,1].map(f=>`<polygon points="${RADAR_AXES.map((_,i)=>ponto(i,f).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${f===1?'#3a4152':'#2a2f3d'}" stroke-width="1"/>`).join("");
  const eixos=compact?"":RADAR_AXES.map((_,i)=>{const [x,y]=ponto(i,1);return `<line x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#2a2f3d" stroke-width="1"/>`;}).join("");
  const fracs=RADAR_AXES.map(a=>Math.max(0.04,Math.min(1,((c[a.key]||0)-a.min)/(a.max-a.min))));
  const forma=fracs.map((f,i)=>ponto(i,f).map(v=>v.toFixed(1)).join(",")).join(" ");
  const bolinhas=compact?"":fracs.map((f,i)=>{const [x,y]=ponto(i,f);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--gold)"/>`;}).join("");
  const rotulos=compact?"":RADAR_AXES.map((a,i)=>{const [x,y]=ponto(i,1.27);return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="700" fill="#9aa0af">${a.label}</text>`;}).join("");
  const vb=compact?"0 0 156 150":"0 0 260 250";
  return `<svg class="radar ${compact?'radar-mini':''}" viewBox="${vb}" role="img" aria-label="Atributos de ${c.name}">${teias}${eixos}<polygon points="${forma}" fill="rgba(224,181,89,.24)" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/>${bolinhas}${rotulos}</svg>`;
}

function statBars(c){
  const defs=[['vida','Vida',50,300],['atk','Ataque',40,200],['defFis','Defesa Física',40,200],['defMag','Defesa Mágica',40,200],['vel','Velocidade',50,150]];
  return `<div class="stat-bars">${defs.map(([key,label,min,max])=>{const pct=Math.max(0,Math.min(100,((c[key]||0)-min)/(max-min)*100));return `<div class="stat-bar-row"><div class="stat-bar-label">${label}</div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%"></div></div></div>`;}).join('')}</div>`;
}

function actionVisualClass(a, ownerElement='Normal'){
  if(a.transformsInto) return 'attack-transformation';
  const type=a.dmgType==='physical'?'attack-physical':'attack-magic';
  const el='attack-element-'+String(a.element||ownerElement||'Normal').replace(/\s+/g,'-');
  return `${type} ${el}`;
}

function renderCharDetail(c){
  const spr=hasSprite(c);
  const viewer=`<div class="sprite-viewer">${spr?fighterArt(c,{view:'front'}):stickFigureSVG(c,true)}</div>`;
  const attackCards=c.attacks.slice(0,4).map(a=>{
    const cost=Math.min(5,Math.max(0,Math.ceil(a.cost||0)));
    const cells=Array.from({length:cost},()=>`<span class="attack-cost-cell on"></span>`).join('');
    const acc=a.precision===undefined?100:a.precision;
    const desc=(a.description||describeEffect(a.effect)||'Sem efeito adicional.');
    const cls=actionVisualClass(a,c.element);
    const meta=a.transformsInto ? `<div class="attack-stats">Carga <span class="attack-cost-cells">${cells}</span></div>` : `<div class="attack-stats">POW ${a.power||0} · ACC ${acc}% · <span class="attack-cost-cells">${cells}</span></div>`;
    return `<div class="attack ${cls}"><div class="attack-title">${a.name}</div>${meta}<div class="atk-tip" style="position:relative;left:auto;bottom:auto;transform:none;opacity:1;visibility:visible;width:auto;margin-top:8px">${desc}</div></div>`;
  }).join('');
  app.innerHTML=`<div class="eyebrow">Anidex</div><div class="row" style="justify-content:space-between;align-items:center"><h1>${c.name}</h1><span class="badge rank-${c.rankKey}">${c.rank}</span></div>
    <div class="char-detail">
      <div class="char-detail-left">${viewer}${statBars(c)}</div>
      <div class="char-detail-right">
        <div class="char-meta"><div class="row" style="align-items:center"><div><div class="anime">${c.anime}</div><div class="hint">Classe: <strong>${c.class}</strong></div></div><span class="badge element-${c.element}">${ELEMENT_ICON[c.element]||''} ${c.element}</span></div></div>
        <div class="attacks">${attackCards}</div>
        <div class="radar-wrap">${radarChart(c)}</div>
      </div>
    </div>
    <div class="row" style="gap:8px;margin-top:14px"><button class="btn primary" onclick="startTraining('${c.id}')">⚔️ Testar em treino</button><button class="btn" onclick="backToIndexList()">← Lista</button><button class="btn" onclick="closeCharIndex()">Fechar</button></div>`;
}

let selectedDifficulty = "easy";
function setDifficulty(mode){
  selectedDifficulty = mode;
  const easyBtn = document.getElementById("diffEasyBtn");
  const hardBtn = document.getElementById("diffHardBtn");
  const hint = document.getElementById("diffHint");
  if(easyBtn) easyBtn.classList.toggle("active", mode==="easy");
  if(hardBtn) hardBtn.classList.toggle("active", mode==="hard");
  if(hint) hint.textContent = mode==="easy"
    ? "Fácil: mostra o rank (D a Z) de cada personagem durante o leilão."
    : "Difícil: a raridade fica escondida — vocês julgam só pelo nome, classe e elemento.";
}

function playerName(state,key){
  // Blindado contra chave inválida: um nome errado numa faixa é um detalhe,
  // mas uma exceção aqui derruba o render inteiro e trava a tela.
  if(key!=="p1" && key!=="p2") return "Jogador";
  return (state.players[key] && state.players[key].name) || ("Jogador "+key.slice(1));
}
function otherKey(key){ return key==="p1"?"p2":"p1"; }

function leaveRoom(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  ROOM_CODE = null; MY_SLOT = null; LAST_STATE = null; LAST_REV = -1;
  render();
}

async function createRoom(){
  const name = savedName() || "Jogador 1";
  const code = genCode();
  const state = newRoomState(code);
  state.mode = selectedMode;
  state.difficulty = selectedDifficulty;
  state.players.p1 = {name};
  await saveRoom(state);
  ROOM_CODE = code; MY_SLOT = 1;
  startPolling();
}

async function joinRoom(){
  const name = savedName() || "Jogador 2";
  const el = document.getElementById("joinCode");
  const code = (el && el.value || "").trim().toUpperCase();
  if(!code){ return; }
  const state = await loadRoom(code);
  if(!state){ alert("Sala não encontrada. Confira o código."); return; }
  if(!state.players.p1){
    state.players.p1 = {name};
    await saveRoom(state);
    ROOM_CODE = code; MY_SLOT = 1;
  } else if(!state.players.p2){
    state.players.p2 = {name};
    await saveRoom(state);
    ROOM_CODE = code; MY_SLOT = 2;
  } else {
    // Sala cheia: provavelmente é o próprio jogador voltando depois de recarregar
    // a página. Reassume o slot cujo nome bate, em vez de virar um terceiro.
    ROOM_CODE = code;
    MY_SLOT = (state.players.p1.name === name) ? 1 : 2;
  }
  startPolling();
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  render();
  pollTimer = setInterval(poll, 2000);
}

async function goToCoinflip(){
  const state = await loadRoom(ROOM_CODE);
  state.phase = "coinflip";
  await commitAndDraw(state);
}

async function startAuction(){
  if(MY_SLOT!==1) return;
  const state = await loadRoom(ROOM_CODE);
  if(state.phase!=="coinflip") return;
  state.phase = "auction";
  setupCharacterTurn(state);
  state.log.unshift("Leilão iniciado — orçamento de R$20 cada, abertura de lance alternando por personagem.");
  await commitAndDraw(state);
}

function setupCharacterTurn(state){
  let opener = openerFor(state, state.poolIndex);
  if(state.teams[opener].length>=5) opener = otherKey(opener);
  state.turnToAct = opener;
  state.currentBid = {amount:0, by:null};
  state.passedThisChar = {p1:false, p2:false};
}

function openerFor(state, idx){
  return idx%2===0 ? state.coinResult : otherKey(state.coinResult);
}

function renderAuction(state){
  if(state.poolIndex >= state.pool.length || (state.teams.p1.length>=5 && state.teams.p2.length>=5)){
    finishAuction(state);
    return;
  }
  const currentId = state.pool[state.poolIndex];
  const c = charById(currentId);
  if(!c){ advanceCharacter(state); return; }

  const myKey = "p"+MY_SLOT;
  const oppKey = otherKey(myKey);
  const myTurn = state.turnToAct===myKey;
  const isOpening = state.currentBid.amount===0;
  const myBudget = state.budget[myKey];

  let controlsHTML = "";
  if(isOpening){
    controlsHTML = myTurn
      ? `<h3 style="margin-bottom:10px;">É a sua vez de abrir o lance</h3>
         <div class="bid-controls">
           <input type="number" id="bidAmt" placeholder="Valor do lance (R$)">

           <button class="btn danger" onclick="openDesist()">Passar</button>

         <p class="hint">Seu saldo: R$ ${myBudget} · Vagas restantes: ${5-state.teams[myKey].length}</p>`

  } else {
    const leaderName = playerName(state, state.currentBid.by);
    controlsHTML = myTurn
      ? `<h3 style="margin-bottom:10px;">Lance atual: <span class="money">R$ ${state.currentBid.amount}</span> (liderando: ${leaderName})</h3>
         <div class="bid-controls">
           <input type="number" id="bidAmt" placeholder="Novo valor (R$)">
           <button class="btn primary" onclick="raiseBid()">Aumentar lance</button>
           <button class="btn danger" onclick="respondDesist()">Passar</button>
         </div>
         <p class="hint">Seu saldo: R$ ${myBudget} · Vagas restantes: ${5-state.teams[myKey].length}</p>`
      : `<h3 style="margin-bottom:6px;">Lance atual: <span class="money">R$ ${state.currentBid.amount}</span> — você está liderando! Aguardando resposta de ${playerName(state,oppKey)}...</h3>`;
  }

  app.innerHTML = `
    <div class="eyebrow">Leilão — ${state.poolIndex+1} / ${state.pool.length}</div>
    <h1>Disputa em andamento</h1>
    <div class="card">
      <div class="char-hero">
        <span class="badge ${c.type}">${c.type==='physical'?'Físico':c.type==='magic'?'Mágico':'Híbrido'}</span>
        ${state.difficulty==="easy" ? `<span class="badge rank-${c.rankKey}">${c.rank}</span>` : ''}
        <div class="name" style="margin-top:8px;">${c.name}</div>
        <div class="anime">${c.anime}</div>
        <div class="hint" style="margin-top:4px;">${c.class} · <span class="badge element-${c.element}">${ELEMENT_ICON[c.element]||''} ${c.element}</span></div>
        <div style="margin-top:14px; display:flex; justify-content:center;">${fighterArt(c,{view:"front", className:"sprite-enemy"})}</div>
      </div>
    </div>

    <div class="card">
      ${controlsHTML}
    </div>

    <div class="players-grid">
      ${renderPlayerPanel(state,1)}
      ${renderPlayerPanel(state,2)}
    </div>

    <div class="log">
      ${state.log.slice(0,10).map(l=>`<div>${l}</div>`).join("")}
    </div>
  `;
}

/* describeEffect entende os dois formatos: o antigo (um objeto {type,value},
   pros personagens legados) e o novo (lista de objetos {kind,...}, usado por
   tudo que vem de characters.py agora). Um ataque pode ter vários efeitos
   na lista nova -- por isso sempre devolve um array e junta com vírgula. */
function targetLabel(t){
  if(t==="self") return "em si mesmo";
  if(t==="allies") return "nos aliados";
  if(t==="team") return "no time todo";
  return "no alvo";
}
function describeOneEffect(e){
  if(!e) return "";
  // formato antigo
  if(e.type==="shield") return "+"+e.value+" de defesa até ser atingido";
  if(e.type==="heal") return "cura "+e.value+" de vida";
  if(e.type==="debuff") return "-"+e.value+" na defesa do alvo até ser atingido";
  if(e.type==="stun") return "atordoa por 1 turno";
  if(e.type==="dot") return e.value+" de dano contínuo por 2 turnos";

  // formato novo (kind-based)
  if(!e.kind) return "";
  const alvo = targetLabel(e.target);
  const turnos = e.turns ? ` por ${e.turns} turno${e.turns>1?'s':''}` : "";
  const chance = (e.chance!==undefined && e.chance<100) ? ` (${e.chance}% de chance)` : "";
  switch(e.kind){
    case "stat": {
      const val = e.pct!==undefined ? `${e.pct>0?'+':''}${e.pct}%` : `${e.flat>0?'+':''}${e.flat}`;
      return `${val} de ${e.stat} ${alvo}${turnos}${chance}`;
    }
    case "heal": return `cura ${e.flat!=null?e.flat:Math.round((e.pctHp||0)*100)+'%'} de vida ${alvo}`;
    case "shield": return `+${e.flat!=null?e.flat:Math.round((e.pctHp||0)*100)+'%'} de escudo ${alvo}`;
    case "stun": return `atordoa${turnos}${chance}`;
    case "dot": return `${e.flat} de dano contínuo${turnos}`;
    case "cleanse": return `remove efeitos negativos ${alvo}`;
    case "dispel": return `remove efeitos positivos ${alvo}`;
    case "revive1": return `revive um aliado caído${turnos}`;
    case "taunt": return `provoca, forçando o alvo a atacar${turnos}`;
    case "confuse": return `confunde${turnos}${chance}`;
    case "recoil": return `causa recuo${chance}`;
    case "absorb": return `absorve parte do dano${turnos}`;
    case "healPctAtk": return `cura ${e.pct}% do ataque atual ${alvo}`;
    case "nextDodge": return `+${e.pct}% de chance de desviar do próximo ataque`;
    default: return "";
  }
}
function describeEffect(e){
  if(!e) return "";
  const list = Array.isArray(e) ? e : [e];
  return list.map(describeOneEffect).filter(Boolean).join(", ");
}

function renderPlayerPanel(state, slot){
  const key="p"+slot;
  const isMe = MY_SLOT===slot;
  const leading = state.currentBid.by===key;
  return `
    <div class="player-panel ${leading?'leader':''}">
      <h3>${playerName(state,key)} ${isMe?'(você)':''} <span class="money">R$ ${state.budget[key]}</span></h3>
      <ul class="team-list">
        ${Array.from({length:5}).map((_,i)=>{
          const cid=state.teams[key][i];
          if(!cid) return `<li class="slot-empty">Vaga ${i+1} — vazia</li>`;
          const ch=charById(cid);
          return `<li><span>${ch.name}</span></li>`;
        }).join("")}
      </ul>
    </div>
  `;
}

async function openBid(){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  if(state.turnToAct!==myKey) return;
  const input = document.getElementById("bidAmt");
  const amt = parseInt(input.value,10);
  if(!amt || amt<=0){ alert("O lance precisa ser maior que zero."); return; }
  if(amt>state.budget[myKey]){ alert("Você não tem saldo suficiente."); return; }
  const c = charById(state.pool[state.poolIndex]);
  state.currentBid = {amount:amt, by:myKey};
  state.log.unshift(`${playerName(state,myKey)} abriu o lance em ${c.name} com R$${amt}.`);
  const opp = otherKey(myKey);
  if(!state.passedThisChar) state.passedThisChar = {p1:false, p2:false};
  if(state.teams[opp].length>=5 || state.passedThisChar[opp]){
    await awardCharacter(state, myKey, c);
  } else {
    state.turnToAct = opp;
  }
  await commitAndDraw(state);
}

async function openDesist(){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  if(state.turnToAct!==myKey) return;
  const c = charById(state.pool[state.poolIndex]);
  if(!state.passedThisChar) state.passedThisChar = {p1:false, p2:false};
  state.passedThisChar[myKey] = true;
  const opp = otherKey(myKey);
  if(state.passedThisChar[opp] || state.teams[opp].length>=5){
    state.log.unshift(`${playerName(state,myKey)} também passou em ${c.name} — ele fica de fora.`);
    advanceCharacter(state);
  } else {
    state.log.unshift(`${playerName(state,myKey)} passou em ${c.name} e não pode mais dar lance nele. Passou a vez.`);
    state.turnToAct = opp;
  }
  await commitAndDraw(state);
}

async function raiseBid(){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  if(state.turnToAct!==myKey) return;
  const input = document.getElementById("bidAmt");
  const amt = parseInt(input.value,10);
  if(!amt || amt<=state.currentBid.amount){ alert("O lance precisa ser maior que o atual."); return; }
  if(amt>state.budget[myKey]){ alert("Você não tem saldo suficiente."); return; }
  const c = charById(state.pool[state.poolIndex]);
  state.currentBid = {amount:amt, by:myKey};
  state.log.unshift(`${playerName(state,myKey)} aumentou o lance em ${c.name} para R$${amt}.`);
  const opp = otherKey(myKey);
  if(!state.passedThisChar) state.passedThisChar = {p1:false, p2:false};
  if(state.teams[opp].length>=5 || state.passedThisChar[opp]){
    await awardCharacter(state, myKey, c);
  } else {
    state.turnToAct = opp;
  }
  await commitAndDraw(state);
}

async function respondDesist(){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  if(state.turnToAct!==myKey) return;
  const c = charById(state.pool[state.poolIndex]);
  if(!state.passedThisChar) state.passedThisChar = {p1:false, p2:false};
  state.passedThisChar[myKey] = true;
  const leader = state.currentBid.by;
  state.log.unshift(`${playerName(state,myKey)} passou em ${c.name}.`);
  await awardCharacter(state, leader, c);
  await commitAndDraw(state);
}

async function awardCharacter(state, winnerKey, c){
  state.teams[winnerKey].push(c.id);
  state.budget[winnerKey] -= state.currentBid.amount;
  state.log.unshift(`${playerName(state,winnerKey)} levou ${c.name} por R$${state.currentBid.amount}!`);
  advanceCharacter(state);
}

function advanceCharacter(state){
  state.poolIndex += 1;
  if(state.poolIndex < state.pool.length && !(state.teams.p1.length>=5 && state.teams.p2.length>=5)){
    setupCharacterTurn(state);
  } else {
    state.currentBid = {amount:0, by:null};
  }
}

function finishAuction(state){
  startScenarioPhase(state);
  saveRoom(state).then(render);
}

/* Embaralho simples e determinístico (Fisher-Yates com Math.random é ok aqui
   -- só precisa ser "aleatório o bastante" pra formação inicial, não criptográfico).
   Roda uma vez só, no instante em que a fase de escalação começa, e o resultado
   fica salvo em state.lineup -- não sorteia de novo a cada redesenho/poll. */
function shuffled(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* Monta a fase de formação (escalar 3 de combate + 2 de suporte), com os 5
   personagens já distribuídos aleatoriamente -- o jogador reorganiza a partir
   daí (arrastando) em vez de montar do zero. */
function startLineupPhase(state){
  state.phase = "order";
  state.attackOrder = {p1:[...state.teams.p1], p2:[...state.teams.p2]};
  state.lineup = {};
  ["p1","p2"].forEach(key=>{
    const embaralhado = shuffled(state.teams[key]);
    state.lineup[key] = {combat: embaralhado.slice(0,COMBAT_SIZE), support: embaralhado.slice(COMBAT_SIZE, COMBAT_SIZE+SUPPORT_SIZE)};
  });
  state.orderReady = {p1:false, p2:false};
}

/* ============ MODO SORTEIO ============
   Cada jogador tem o PRÓPRIO sorteio, então os dois escolhem ao mesmo tempo e
   ninguém espera a vez. Isso é o que torna este modo rápido — e também o motivo
   de ele não precisar de `turnToAct`, moeda nem controle de quem abre.

   O que os dois compartilham é só a exclusão: um personagem já escolhido por
   qualquer um dos dois sai do baralho, pra não existirem dois Gokus em campo. */

/* Sorteio PONDERADO por raridade. Em 98% das vezes cada carta sai independente
   pela distribuição normal; em 2% a rodada inteira vira um "golden roll" — só
   Lendário e Mítico aparecem, 80/20 entre eles. É a rodada inteira que vira
   dourada, não carta por carta, pra ser um evento visível e não um detalhe
   estatístico perdido no meio das 5 cartas. */
const RARITY_WEIGHTS = [["D",30],["C",25],["B",20],["A",15],["S",7],["Z",3]];
const GOLDEN_WEIGHTS = [["S",80],["Z",20]];

function weightedTierPick(weights){
  const total = weights.reduce((s,[,w])=>s+w, 0);
  let r = Math.random()*total;
  for(const [tier,w] of weights){ if(r<w) return tier; r-=w; }
  return weights[weights.length-1][0];
}

// Sorteia DRAFT_OPTIONS personagens ainda livres para um jogador.
function rollDraftOptions(state, key){
  const taken = new Set([...state.teams.p1, ...state.teams.p2]);
  const golden = Math.random() < 0.02;
  const weights = golden ? GOLDEN_WEIGHTS : RARITY_WEIGHTS;
  const escolhidos = [];
  const usados = new Set();
  let guard = 0;
  while(escolhidos.length < DRAFT_OPTIONS && guard++ < 500){
    const tier = weightedTierPick(weights);
    const candidatos = CHARACTERS.filter(c=>c.rankKey===tier && !taken.has(c.id) && !usados.has(c.id));
    if(candidatos.length===0) continue; // esse tier esgotou, tenta outro
    const pick = candidatos[Math.floor(Math.random()*candidatos.length)];
    escolhidos.push(pick.id); usados.add(pick.id);
  }
  // Rede de segurança: se o pool geral estiver curto (fim de jogo), completa
  // com qualquer personagem livre em vez de travar sorteando pra sempre.
  if(escolhidos.length < DRAFT_OPTIONS){
    const livres = CHARACTERS.filter(c=>!taken.has(c.id) && !usados.has(c.id));
    while(escolhidos.length < DRAFT_OPTIONS && livres.length){
      const idx = Math.floor(Math.random()*livres.length);
      escolhidos.push(livres.splice(idx,1)[0].id);
    }
  }
  state.draftOptions[key] = escolhidos;
  if(!state.draftGolden) state.draftGolden = {p1:false, p2:false};
  state.draftGolden[key] = golden;
}

async function startDraft(){
  const state = await loadRoom(ROOM_CODE);
  if(state.phase!=="lobby") return;
  state.phase = "draft";
  state.draftRerolls = {p1:DRAFT_REROLLS, p2:DRAFT_REROLLS};
  // Quem começa a BATALHA. O Leilão define isso na tela de cara-ou-coroa, que o
  // Sorteio não tem — sem isso `coinResult` fica null e a batalha quebra ao
  // tentar dizer de quem é a vez.
  state.coinResult = Math.random()<0.5 ? "p1" : "p2";
  rollDraftOptions(state,"p1");
  rollDraftOptions(state,"p2");
  state.log.unshift(`Sorteio iniciado — cada jogador escolhe ${TEAM_SIZE} lutadores entre ${DRAFT_OPTIONS} cartas por rodada, com ${DRAFT_REROLLS} rerolls.`);
  state.log.unshift(`${playerName(state,state.coinResult)} começa a batalha.`);
  await commitAndDraw(state);
}

async function pickDraft(charId){
  // Durante a revelação a carta ainda está escondida — clicar aqui seria
  // escolher às cegas. Trava por tempo (não por CSS), então nunca fica presa.
  if(Date.now() < animLock) return;
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  if(state.phase!=="draft") return;
  if(state.teams[myKey].length >= TEAM_SIZE) return;
  // Confere contra o estado recém-carregado: entre o desenho da tela e o clique,
  // o adversário pode ter levado esse personagem no sorteio dele.
  if(!state.draftOptions[myKey].includes(charId)) { draw(state); return; }
  const taken = new Set([...state.teams.p1, ...state.teams.p2]);
  if(taken.has(charId)){
    state.log.unshift(`Esse personagem já foi levado — sorteando outras cartas.`);
    rollDraftOptions(state, myKey);
    await commitAndDraw(state);
    return;
  }

  const c = charById(charId);
  state.teams[myKey].push(charId);
  state.log.unshift(`${playerName(state,myKey)} escolheu ${c.name} (${c.rank}).`);

  if(state.teams[myKey].length < TEAM_SIZE){
    rollDraftOptions(state, myKey);
  } else {
    state.draftOptions[myKey] = [];
    state.log.unshift(`${playerName(state,myKey)} fechou o time!`);
  }

  if(state.teams.p1.length>=TEAM_SIZE && state.teams.p2.length>=TEAM_SIZE){
    startScenarioPhase(state);
  }
  await commitAndDraw(state);
}

// Descarta as 5 cartas atuais sem escolher nenhuma e sorteia outras — custa 1
// dos DRAFT_REROLLS do jogador.
async function rerollDraft(){
  const state = await loadRoom(ROOM_CODE);
  const myKey = "p"+MY_SLOT;
  if(state.phase!=="draft") return;
  if(!state.draftRerolls) state.draftRerolls = {p1:DRAFT_REROLLS, p2:DRAFT_REROLLS};
  if(state.draftRerolls[myKey]<=0) return;
  state.draftRerolls[myKey] -= 1;
  rollDraftOptions(state, myKey);
  state.log.unshift(`${playerName(state,myKey)} deu reroll nas cartas (${state.draftRerolls[myKey]} restantes).`);
  await commitAndDraw(state);
}

// Cor final de cada rank, usada tanto pelas variáveis --wash-* da animação
// quanto reaproveitável se precisar em outro lugar. Espelha as CSS rules
// .rank-card-* — se mudar uma, muda a outra junto.
// Cor de brilho de cada rank, usada pela animação de revelação (--wash-color).
// O fundo em si vem das classes .rank-card-* no CSS.
const RANK_WASH = {
  comum:"#8f96a6", raro:"#4f8cff", epico:"#b25cff", lendario:"#ffd76a", mitico:"#ff5b57"
};


// Guarda, por jogador, a assinatura do último conjunto de 5 cartas já
// mostrado. Se bater com o atual, a tela NÃO deve reanimar — só um redesenho
// incidental (poll, troca de aba). Se mudou (pick, reroll, rodada nova), toca
// a revelação do zero.
let lastDraftSig = {p1:null, p2:null};

/* Ordem em que as vagas do time são preenchidas: a 1ª escolha vai pro quadrado
   do MEIO, a 2ª pro meio-esquerda, a 3ª pro meio-direita, e as duas últimas
   pras pontas. Assim o time cresce de dentro pra fora. */
const SLOT_ORDER = [2, 1, 3, 0, 4];

function renderDraft(state){
  const myKey = "p"+MY_SLOT;
  const oppKey = otherKey(myKey);
  const meus = state.teams[myKey];
  const pronto = meus.length >= TEAM_SIZE;
  const oppPronto = state.teams[oppKey].length >= TEAM_SIZE;
  const rodada = meus.length + 1;
  const opcoes = (state.draftOptions && state.draftOptions[myKey]) || [];
  const golden = !!(state.draftGolden && state.draftGolden[myKey]);
  const rerollsLeft = (state.draftRerolls && state.draftRerolls[myKey]) ?? DRAFT_REROLLS;

  const sig = opcoes.join(",");
  const ehNovo = sig && sig!==lastDraftSig[myKey];
  lastDraftSig[myKey] = sig;
  // Mesma trava usada na transformação em batalha: sem isso, um poll (a cada
  // 2s) redesenha a tela no meio da revelação e ela pula direto pro final.
  if(ehNovo) animLock = Date.now() + 3400;

  // Monta as 5 vagas na ordem visual, preenchendo pela SLOT_ORDER.
  const vagas = new Array(TEAM_SIZE).fill(null);
  meus.forEach((id, i)=>{ const pos = SLOT_ORDER[i]; if(pos!==undefined) vagas[pos] = id; });

  app.innerHTML = `
    <div class="eyebrow">Sorteio — ${Math.min(rodada,TEAM_SIZE)} de ${TEAM_SIZE}</div>
    <h1 style="margin-bottom:2px;">${pronto ? "Time fechado" : "Escolha um lutador"}</h1>
    <p class="sub" style="margin-bottom:8px;">${pronto
      ? (oppPronto ? "Os dois times estão prontos!" : `Aguardando ${playerName(state,oppKey)} terminar...`)
      : `${playerName(state,oppKey)}: ${state.teams[oppKey].length}/${TEAM_SIZE}${oppPronto?" ✅":""}`}</p>

    ${golden && !pronto ? `<div class="golden-banner">✨ GOLDEN ROLL — só Lendário e Mítico nesta rodada!</div>` : ''}

    ${pronto ? "" : `
    <div class="draft-row" id="draftRow">
      <div class="draft-track">
      ${opcoes.map(id=>{
        const c = charById(id);
        return `<div class="draft-card rank-card-${c.rankKey} ${ehNovo?'revealing':''}"
             style="--wash-color:${RANK_WASH[c.rankKey]};" onclick="pickDraft('${c.id}')">
          <div class="draft-anime">${c.anime}</div>
          <div class="draft-reveal-body">
            <div class="draft-art">${fighterArt(c,{view:"front"})}</div>
            <div class="draft-radar-mini">${radarChart(c,true)}</div>
            <div class="draft-name">${c.name}</div>
            <div class="draft-meta">
              <span class="badge rank-${c.rankKey}">${c.rank}</span>
              <span class="badge element-${c.element}">${ELEMENT_ICON[c.element]||''} ${c.element}</span>
            </div>
            <div class="draft-class">${c.class}</div>
          </div>
        </div>`;
      }).join("")}
      </div>
    </div>
    <div class="center" style="margin-top:2px;">
      <button class="btn" ${rerollsLeft<=0?'disabled':''} onclick="rerollDraft()">🎲 Reroll (${rerollsLeft})</button>
    </div>`}

    <div style="margin-top:14px;">
      <div class="bench-label center">Seu time — ${meus.length}/${TEAM_SIZE}</div>
      <div class="team-slots">
        ${vagas.map((id,i)=>{
          if(!id) return `<div class="team-slot"><span class="team-slot-num">${i+1}</span></div>`;
          const c = charById(id);
          return `<div class="team-slot filled slot-rank-${c.rankKey}" title="${c.name} — ${c.rank}">
            ${fighterArt(c,{view:"front"})}
          </div>`;
        }).join("")}
      </div>
    </div>
  `;

  // Centraliza a carta do MEIO. Quando as 5 cabem, o track já se centra
  // sozinho (margin auto) e o scrollLeft fica 0; quando não cabem, isto põe o
  // meio da tira no meio da tela em vez de deixar a 1ª carta colada na borda.
  const row = document.getElementById("draftRow");
  if(row) row.scrollLeft = Math.max(0, (row.scrollWidth - row.clientWidth) / 2);

  // Tira a classe quando a revelação acaba. Isso é só limpeza visual — quem
  // libera o clique é a trava de tempo em pickDraft.
  if(ehNovo){
    setTimeout(()=>{
      const cartas = document.querySelectorAll(".draft-card.revealing");
      if(cartas && cartas.forEach) cartas.forEach(el=>el.classList.remove("revealing"));
    }, 3400);
  }
}

async function startTraining(charId){
  const c = charById(charId);
  if(!c) return;
  const st = newRoomState(TRAINING_CODE);
  st.training = true;
  st.trainingCharId = charId;
  st.players = {p1:{name: savedName() || "Você"}, p2:{name: DUMMY.name}};
  st.teams = {p1:[charId], p2:[DUMMY.id]};
  st.attackOrder = {p1:[charId], p2:[DUMMY.id]};
  // O boneco é o mais lento do jogo (vel 1), então você sempre age primeiro.
  st.coinResult = "p1";
  st.phase = "battle";
  st.battle = initBattle(st);

  ROOM_CODE = TRAINING_CODE; MY_SLOT = 1;
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }  // treino é local: não faz polling

}

function exitTraining(){
  TRAINING_STATE = null;
  ROOM_CODE = null; MY_SLOT = null; LAST_STATE = null; LAST_REV = -1;
  showingIndex = true;

}

// Mantém o boneco de pé: vida cheia, sem cooldown e sem efeitos acumulados.
// Chamado no fim de cada rodada de treino.
function refreshDummy(state){
  const b = state.battle;
  b.hp[DUMMY.id] = DUMMY.vida;
  b.stunned[DUMMY.id] = false;
  b.def[DUMMY.id] = {fis:DUMMY.defFis, mag:DUMMY.defMag};
  if(b.tempDef) delete b.tempDef[DUMMY.id];
  if(b.dot) delete b.dot[DUMMY.id];
  if(b.mustSwitch) b.mustSwitch.p2 = false;
  // Se o próprio jogador se derrubou (dano de recuo do Ultimate, veneno...),
  // levanta ele também — é um sandbox, não uma partida.
  const meu = state.trainingCharId;
  if(b.hp[meu] <= 0){
    b.hp[meu] = maxLifeOf(state, meu);
    b.log.unshift("Você caiu — vida restaurada para continuar o treino.");
    if(b.mustSwitch) b.mustSwitch.p1 = false;
  }
}

/* ============ ORDEM DE ENTRADA (pré-batalha) ============ */
const COMBAT_SIZE = 3;   // entram em campo
const SUPPORT_SIZE = 2;  // ficam no banco de suporte

/* ============ CENÁRIOS DE BATALHA ============
   Estrutura pronta pra receber cenários de verdade depois -- por enquanto só
   placeholders (preview/background null caem num visual genérico, sem quebrar
   nada). Adicionar um cenário novo é só acrescentar aqui; nada mais precisa
   mudar (a tela de seleção e a resolução são genéricas). */
const SCENARIOS = [
  {id:"cenario_01", name:"Floresta Mística",  preview:null, background:null, description:"Copas altas e neblina baixa. Nenhum efeito mecânico ainda -- só o visual."},
  {id:"cenario_02", name:"Ruínas do Castelo", preview:null, background:null, description:"Pedra rachada e bandeiras esquecidas. Nenhum efeito mecânico ainda."},
  {id:"cenario_03", name:"Deserto Ardente",   preview:null, background:null, description:"Sol a pino, areia infinita. Nenhum efeito mecânico ainda."},
  {id:"cenario_04", name:"Arena de Pedra",    preview:null, background:null, description:"Uma arena de combate clássica, em círculo. Nenhum efeito mecânico ainda."},
  {id:"cenario_05", name:"Céu Flutuante",     preview:null, background:null, description:"Ilhas suspensas ligadas por pontes de luz. Nenhum efeito mecânico ainda."},
];
function scenarioById(id){ return SCENARIOS.find(s=>s.id===id) || null; }

/* Empate de cenário: os dois escolheram coisas DIFERENTES e nenhuma regra de
   desempate foi definida ainda. Isolado de propósito nesta função só, pra
   trocar a regra depois sem precisar mexer no resto da fase.
   Hoje: sorteia entre as duas escolhas (50/50). */
function resolveScenarioTiebreak(idA, idB){
  return Math.random()<0.5 ? idA : idB;
}

/* Resolve o cenário final a partir das duas escolhas confirmadas (que podem
   ser um id de SCENARIOS ou "random"). O sorteio de "random" só acontece
   AQUI -- depois que os dois já confirmaram -- pra ninguém prever/manipular
   o resultado escolhendo por último. */
function resolveScenarioChoices(choiceA, choiceB){
  const pool = SCENARIOS.map(s=>s.id);
  const realA = choiceA==="random" ? pool[Math.floor(Math.random()*pool.length)] : choiceA;
  const realB = choiceB==="random" ? pool[Math.floor(Math.random()*pool.length)] : choiceB;
  if(realA===realB) return realA;
  return resolveScenarioTiebreak(realA, realB);
}

function ensureScenarioSelection(state){
  if(!state.scenarioSelection){
    state.scenarioSelection = {
      p1:{hoveredScenario:null, selectedScenario:null, confirmed:false},
      p2:{hoveredScenario:null, selectedScenario:null, confirmed:false},
      resolvedScenario:null
    };
  }
}

function startScenarioPhase(state){
  state.phase = "scenario";
  ensureScenarioSelection(state);
}

/* Só escreve no Firestore quando o hover MUDA de verdade (não a cada pixel) --
   é a própria chamada em onmouseenter/onmouseleave que já garante isso, mas
   confere de novo aqui pra sobreviver a cliques rápidos/eventos duplicados. */
async function hoverScenario(id){
  const state = await loadRoom(ROOM_CODE);
  if(!state || state.phase!=="scenario") return;
  ensureScenarioSelection(state);
  const myKey = "p"+MY_SLOT;
  const mine = state.scenarioSelection[myKey];
  const novo = id || null;
  if(mine.hoveredScenario === novo) return; // sem mudança real -- não gasta escrita
  mine.hoveredScenario = novo;
  await saveRoom(state);
}

async function selectScenario(id){
  const state = await loadRoom(ROOM_CODE);
  if(!state || state.phase!=="scenario") return;
  ensureScenarioSelection(state);
  const myKey = "p"+MY_SLOT;
  const mine = state.scenarioSelection[myKey];
  if(mine.confirmed) return; // trocar exige "Alterar escolha" primeiro (ver changeScenarioChoice)
  mine.selectedScenario = id;
  await commitAndDraw(state);
}

async function confirmScenario(){
  const myKey="p"+MY_SLOT;
  try{
    const ref=db.collection("rooms").doc(ROOM_CODE);
    const result=await db.runTransaction(async tx=>{
      const snap=await tx.get(ref);
      if(!snap.exists) return null;
      const state=snap.data();
      if(state.phase!=="scenario") return state;
      ensureScenarioSelection(state);
      const mine=state.scenarioSelection[myKey];
      const oppKey=otherKey(myKey), opp=state.scenarioSelection[oppKey];
      if(!mine.selectedScenario) return state;
      mine.confirmed=true;
      mine.hoveredScenario=null;
      if(opp.confirmed){
        state.scenarioSelection.resolvedScenario=resolveScenarioChoices(mine.selectedScenario,opp.selectedScenario);
        startLineupPhase(state);
      }
      state.rev=(state.rev||0)+1;
      tx.set(ref,state);
      return state;
    });
    if(result){LAST_STATE=result;LAST_REV=result.rev||0;draw(result);}
  }catch(e){
    console.error("Erro ao confirmar cenário:",e);
    alert("Não foi possível confirmar o cenário. Tente novamente.");
  }
}

async function changeScenarioChoice(){
  const state = await loadRoom(ROOM_CODE);
  if(!state || state.phase!=="scenario") return;
  ensureScenarioSelection(state);
  const myKey = "p"+MY_SLOT;
  state.scenarioSelection[myKey].confirmed = false;
  await commitAndDraw(state);
}

function renderScenario(state){
  ensureScenarioSelection(state);
  const myKey = "p"+MY_SLOT, oppKey = otherKey(myKey);
  const mine = state.scenarioSelection[myKey];
  const opp = state.scenarioSelection[oppKey];
  const meuNome = playerName(state,myKey), oppNome = playerName(state,oppKey);

  // Cenário em destaque no preview: minha seleção confirmada > meu hover >
  // minha seleção não confirmada > nada.
  const emFoco = scenarioById(mine.selectedScenario) || scenarioById(mine.hoveredScenario);

  const cards = [...SCENARIOS, {id:"random", name:"Aleatório", isRandom:true}].map(s=>{
    const euEstouAqui = mine.hoveredScenario===s.id;
    const euEscolhiAqui = mine.selectedScenario===s.id;
    const oppEstaAqui = opp.hoveredScenario===s.id;
    const oppEscolheuAqui = opp.selectedScenario===s.id && opp.confirmed;
    const cls = [
      "scenario-card",
      s.isRandom ? "is-random" : "",
      euEstouAqui ? "hover-me" : "",
      oppEstaAqui ? "hover-opp" : "",
      euEscolhiAqui ? "picked-me" : "",
      oppEscolheuAqui ? "picked-opp" : "",
    ].join(" ");

function renderOrder(state){

  // A escalação agora é uma prévia da própria arena: os cinco sprites são

        </div>
        <div class="lineup-formation-row front">
          <span class="lineup-line-label">Dianteira · 3</span>
          ${Array.from({length:COMBAT_SIZE}).map((_,i)=>fighterHTML('c'+i,lu.combat[i])).join('')}
